/* ============ batch C: toggle ============ */
/* MP-MECH id=toggle const=TOGGLE */
/* ============ C3. LIGHT SWITCH (toggle, over-centre spring) ============
   Batch C. Physics (simplified): the lever carries a tube with a spring-loaded plunger that presses on a see-saw
   rocker. The plunger tip is nearest the rocker when the lever is upright, so the spring is most squeezed at
   centre; once the plunger passes over the rocker's pivot the spring re-extends and snaps the rocker onto the
   other contact. Fast make/break limits arcing and the spring holds either position.
   Wrong parts: foam (too weak: creeping, light contact, flicker/arcing), extension spring (pulls the plunger up
   so it never reaches the rocker), rigid pin (can't shorten to pass centre: jams). */
const TOGGLE={
  id:'toggle',title:'Light switch',fig:'Toggle switch · cutaway',rotStep:0,dur:3.2,
  prompt:'Flick the lever and the light should come on with a crisp click, and stay on. The part that makes it snap is missing.',
  answer:{part:'comp',slot:'tube',rot:0},
  slots:[{id:'out',label:'A',x:236,y:62,w:46,h:30,name:'beside the lever, outside'},{id:'tube',label:'B',x:204,y:134,w:38,h:62,name:'in the lever’s tube'}],
  parts:[
    {id:'ext',name:'Extension spring',desc:'Coils wound tight, with hooks. Stretch it and it pulls back.',icon:()=>TOGGLE.extIcon()},
    {id:'foam',name:'Foam plug',desc:'A soft foam cylinder. It squashes easily and slowly swells back.',icon:()=>`<rect x="10" y="17" width="60" height="22" rx="6" fill="#f0e6b8" stroke="${C.ink}" stroke-width="2"/>${[[20,24],[31,31],[43,23],[54,30],[62,24]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.7" fill="#cdbd78"/>`).join('')}`},
    {id:'rigid',name:'Rigid pin',desc:'A solid steel pin, the same length as the spring.',icon:()=>`<rect x="10" y="24" width="60" height="8" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'comp',name:'Compression spring',desc:'Open coils. Squeeze it and it pushes back.',icon:()=>zig(8,28,72,28,6,24,C.ink,2.4)}
  ],
  extIcon(){return zig(16,28,64,28,12,16,C.ink,2)+`<path d="M16 28a6 6 0 1 1-8-4" fill="none" stroke="${C.ink}" stroke-width="2"/><path d="M64 28a6 6 0 1 1 8 4" fill="none" stroke="${C.ink}" stroke-width="2"/>`;},
  evaluate(pl){
    if(pl.slot==='out') return {ok:false,key:'nopush',msg:'Out there it isn’t inside the switch at all. With nothing pushing the plunger down, the lever flops over without a click and the rocker barely shifts. The light stays off.'};
    switch(pl.part){
      case 'comp':return {ok:true,key:'ok'};
      case 'foam':return {ok:false,key:'weak',msg:'Foam is a very weak spring. The rocker creeps over instead of snapping, and the plunger presses so lightly that the contacts barely touch. They flicker and spark (arcing), which is exactly what a quick snap prevents.'};
      case 'ext':return {ok:false,key:'noreach',msg:'An extension spring pulls instead of pushing. It hauls the plunger up into the tube, so the plunger never reaches the rocker. The lever flops over and the light stays off.'};
      default:return {ok:false,key:'jam',msg:'The plunger tip is closest to the rocker when the lever is upright, so the tube has to get shorter to pass the middle. A rigid pin can’t shorten, so the lever won’t budge.'};
    }
  },
  why:'Pushing the lever squeezes the spring in its tube until the plunger rides over the rocker’s pivot. Past that point the spring stretches out again and slams the other end of the rocker down onto the contact. Click. The snap closes (and opens) the contacts fast and firmly, so there’s no time for an electric arc to burn them, and the spring holds the switch in either position.',
  sReq(th,rho){return 114/(Math.cos(rad(th))-Math.sin(rad(th))*Math.tan(rad(rho)));},
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let cap='';
    let th=-22,rho=-8,lit=0,spark=false;
    if(out){
      if(key==='ok'){th=t<1.15?-22+22*Math.pow(seg(t,.3,1.15),1.6):22*ease(seg(t,1.15,1.25));rho=t<1.15?-8:lerp(-8,8,ease(seg(t,1.15,1.2)));lit=t>1.19?1:0;}
      else if(key==='weak'){th=-22+44*ease(seg(t,.3,2));rho=8*clamp(th/6,-1,1);if(rho>7.5){lit=.25+.75*(Math.sin(t*53)*Math.sin(t*31)>0?1:0)*(.5+.5*Math.sin(t*97));spark=Math.sin(t*41)>.2;}}
      else if(key==='jam'){th=-22+1*ease(seg(t,.3,.5))+(t>.5&&t<2.4?Math.sin(t*60)*.4:0);}
      else{th=-22+44*ease(seg(t,.3,.8))+(t>.8?3*Math.exp(-(t-.8)*4)*Math.sin((t-.8)*22):0);if(key==='nopush')rho=-8+.8*Math.sin(seg(t,.45,.7)*Math.PI);}
    }
    const part=pl?pl.part:null,inA=pl&&pl.slot==='tube';
    let sp=this.sReq(th,rho);
    if(inA&&part==='ext') sp=98;
    if(inA&&part==='rigid') sp=this.sReq(-22,-8);
    let s='';
    // housing
    s+=`<rect x="108" y="100" width="184" height="166" rx="4" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/><rect x="120" y="112" width="160" height="146" fill="${C.card}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s+=`<rect x="96" y="96" width="208" height="10" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/><rect x="176" y="96" width="48" height="10" fill="${C.paper}" stroke="${C.ink}" stroke-width="1"/>`;
    // contacts, fulcrum, wiring
    s+=`<rect x="130" y="244" width="22" height="7" fill="#c98b45" stroke="${C.ink}" stroke-width="1.5"/><rect x="248" y="244" width="22" height="7" fill="${C.muted}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<polygon points="200,232 191,252 209,252" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
    s+=`<polyline points="141,251 141,280 345,280 345,186" fill="none" stroke="${C.ink}" stroke-width="1.6"/><polyline points="200,252 200,268 296,268" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`;
    // rocker

    if(spark){for(let i=0;i<5;i++){const a=rad(-160+i*35+Math.sin(t*50+i)*10),r=6+frac(t*7+i*.3)*9;s+=L(142+Math.cos(a)*3,242+Math.sin(a)*3,142+Math.cos(a)*r,242+Math.sin(a)*r,'#f0a020',1.6);}}
    // lever + tube + plunger (local frame: knob up -y, tube down +y)
    let g=`<rect x="-5" y="-68" width="10" height="66" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cy="-74" r="9" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/>`;
    g+=`<rect x="-9" y="6" width="18" height="106" rx="2" fill="${C.paper}" stroke="${C.ink}" stroke-width="2"/>`;
    if(inA){const e=sp-40;
      if(part==='comp') g+=zig(0,14,0,e,6,12,C.acc,2.2);
      else if(part==='ext') g+=zig(0,16,0,e-2,12,10,C.acc,1.8)+`<circle cy="14" r="2.5" fill="none" stroke="${C.acc}" stroke-width="1.6"/><circle cy="${f(e)}" r="2.5" fill="none" stroke="${C.acc}" stroke-width="1.6"/>`;
      else if(part==='foam') g+=`<rect x="-7" y="14" width="14" height="${f(e-14)}" rx="3" fill="#f0e6b8" stroke="${C.acc}" stroke-width="2"/>`;

    }
    g+=`<rect x="-6" y="${f(sp-40)}" width="12" height="30" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.8"/><circle cy="${f(sp-6)}" r="6" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.8"/>`;
    g+=`<circle r="9" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle r="3" fill="${C.ink}"/>`;
    s+=`<g transform="translate(200,112) rotate(${f(th)})">${g}</g>`;
    // part left outside (slot B)
    if(pl&&!inA){
      if(part==='comp') s+=zig(240,80,276,80,5,14,C.acc,2.2);
      else if(part==='ext') s+=zig(244,80,272,80,9,10,C.acc,1.8)+`<circle cx="241" cy="80" r="2.5" fill="none" stroke="${C.acc}" stroke-width="1.6"/><circle cx="275" cy="80" r="2.5" fill="none" stroke="${C.acc}" stroke-width="1.6"/>`;
      else if(part==='foam') s+=`<rect x="240" y="73" width="36" height="14" rx="4" fill="#f0e6b8" stroke="${C.acc}" stroke-width="2"/>`;
      else s+=`<rect x="240" y="77" width="36" height="6" rx="1" fill="${C.steel}" stroke="${C.acc}" stroke-width="2"/>`;
    }
    // bulb
    const bc=[345,150];
    if(lit>0){for(let i=0;i<8;i++){const a=rad(i*45);s+=L(bc[0]+Math.cos(a)*27,bc[1]+Math.sin(a)*27,bc[0]+Math.cos(a)*(33+4*lit),bc[1]+Math.sin(a)*(33+4*lit),'#e0a52a',2);}}

    s+=`<path d="M338 168V156l4-6 3 6 3-6 4 6V168" fill="none" stroke="${lit>0?'#b56a10':C.muted}" stroke-width="1.4"/>`;
    // labels
    s+=T(60,40,'LEVER')+L(84,42,194,94)+T(30,150,'SPRING TUBE')+T(30,159,'+ PLUNGER')+L(84,154,196,150);
    s+=T(30,214,'ROCKER')+L(64,212,150,228)+T(30,262,'ON CONTACT')+L(84,258,130,250)+T(274,240,'STOP',{size:7})+T(300,271,'SUPPLY',{size:7})+T(345,118,'LIGHT',{a:'middle'});

      else if(key==='weak') cap=pre||(t<1.7?'Pushing the lever… no click. The rocker creeps over.':'The contacts barely touch. The light flickers and sparks.');
      else if(key==='jam') cap=pre||'The lever won’t move past the start. The rigid pin can’t shorten.';

};

/* ============ batch C: escapement ============ */
/* MP-MECH id=escapement const=ESCAPEMENT */
/* ============ C4. PENDULUM CLOCK ESCAPEMENT (anchor) ============
   Batch C. Physics (simplified): the falling weight tries to spin the escape wheel; the anchor, rocking with the
   pendulum, lets it advance by half a tooth per swing (one pallet lifts out as the other dips in), and each
   escaping tooth gives a small push to the pallet that keeps the pendulum going. Simplifications: tooth/pallet
   contact geometry is drawn schematically (the wheel steps at each end of the swing); recoil and drop are not
   modelled. Wrong parts: plain bar / anchor upside down / anything low on the rod -> nothing holds the wheel
   (runaway); single hook -> wheel only held half the time (gallops); meshing gear -> pendulum locked to the wheel. */
const ESCAPEMENT={
  id:'escapement',title:'Pendulum clock',fig:'Escapement · front view',rotStep:180,dur:3.6,
  prompt:'The weight tries to spin the escape wheel as fast as it can. Something on the pendulum must let it turn only one tooth at a time, tick, tock.',
  answer:{part:'anchor',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:146,y:62,w:108,h:70,name:'at the pendulum’s pivot'},{id:'B',label:'B',x:172,y:228,w:56,h:28,name:'low on the pendulum rod'}],
  parts:[
    {id:'hook',name:'Single hook',desc:'One arm ending in one hard pallet, like a ratchet pawl.',icon:()=>`<g transform="translate(40,7) scale(.78)">${ESCAPEMENT.shape('hook',C.ink,C.steel)}</g>`},
    {id:'bar',name:'Straight bar',desc:'A plain crossbar that rocks with the pendulum.',icon:()=>`<g transform="translate(40,28) scale(.78)">${ESCAPEMENT.shape('bar',C.ink,C.steel)}</g>`},
    {id:'anchor',name:'Anchor',desc:'Two arms, each ending in a hard pallet. As one dips in, the other lifts out.',icon:()=>`<g transform="translate(40,7) scale(.78)">${ESCAPEMENT.shape('anchor',C.ink,C.steel)}</g>`},
    {id:'gear',name:'Small gear',desc:'A little gear whose teeth mesh with the escape wheel. It rocks with the pendulum.',icon:()=>gear(40,28,19,10,6,0,C.steel)}
  ],
  pallet(x,y,dx,dy,len,w,st,fill){const n=Math.hypot(dx,dy);dx/=n;dy/=n;const px=-dy,py=dx;
    return `<polygon points="${f(x+px*w/2)},${f(y+py*w/2)} ${f(x+dx*len+px*w/4)},${f(y+dy*len+py*w/4)} ${f(x+dx*len-px*w/4)},${f(y+dy*len-py*w/4)} ${f(x-px*w/2)},${f(y-py*w/2)}" fill="${fill}" stroke="${st}" stroke-width="1.8" stroke-linejoin="round"/>`;},
  /* local frame: pivot at 0,0, escape-wheel centre at 0,92 */
  shape(id,st,fill){
    const arm=pts=>`<polyline points="${pts}" fill="none" stroke="${st}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${pts}" fill="none" stroke="${fill}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const hub=`<circle r="7" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
    if(id==='anchor') return arm('-46.7,45.3 -24,6 0,0 24,6 46.7,45.3')+this.pallet(-46.7,45.3,46.7,46.7,14,8,st,fill)+this.pallet(46.7,45.3,-46.7,46.7,14,8,st,fill)+hub;
    if(id==='hook') return arm('-46.7,45.3 -24,6 0,0 10,2')+this.pallet(-46.7,45.3,46.7,46.7,14,8,st,fill)+hub;
    if(id==='bar') return arm('-46,0 46,0')+hub;
    return gear(0,0,28,10,6,0,fill,st,2);
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'runaway',msg:'Down on the rod it’s nowhere near the escape wheel. Nothing holds the wheel back, so the weight spins it in a blur, the hands race around and the weight thumps to the floor.'};
    if(pl.part==='gear') return {ok:false,key:'geared',msg:'A gear never lets go. It locks the pendulum and the wheel together, so the weight just shoves the pendulum off to one side and holds it there. No swinging, no ticking.'};
    if(pl.part==='bar') return {ok:false,key:'runaway',msg:'The plain bar never dips between the teeth. Nothing holds the escape wheel back, so the weight spins it in a blur and the hands race around. With no little pushes from the teeth, the pendulum dies away.'};
    if(pl.rot%360!==0) return {ok:false,key:'runaway',msg:'Upside down, its pallets point up, away from the wheel. Nothing catches the teeth, so the wheel spins in a blur and the weight crashes down.'};
    if(pl.part==='hook') return {ok:false,key:'gallop',msg:'With only one pallet, the wheel is held only half the time. Each time the hook lifts out, the wheel races ahead several teeth before it’s caught again. The clock gallops, and the pendulum gets random knocks instead of steady pushes.'};
    return {ok:true,key:'ok'};
  },
  why:'The anchor rocks with the pendulum. As one pallet lifts out of the teeth, the other dips in and catches the next tooth, so the wheel can only creep forward half a tooth per swing: tick, tock. Each tooth also gives its pallet a little push as it slides off, which keeps the pendulum swinging. The weight supplies the power; the pendulum’s steady swing sets the pace.',
  render(st){

    const W=[200,170],P=[200,78],per=1.2;let th=0,phi=0;

      else if(key==='runaway'){th=sw(t)*Math.exp(-1.4*t);phi=200*t*t;}
      else if(key==='gallop'){th=sw(t)+(t>.3?.8*Math.sin(t*17)*Math.exp(-frac(t/.6)*5):0);for(let x=0;x<t;x+=1/120){if(Math.sin(2*Math.PI*x/per)>.35)phi+=150/120;}}
      else{const k=ease(seg(t,.15,.9));th=lerp(sw(t),13,k)+(t>.9?1.5*Math.exp(-(t-.9)*3)*Math.sin((t-.9)*14):0);phi=-th*.45;}
    }
    const wy=Math.min(246,124+phi*.05);
    let s='';

    // escape wheel (clockwise drive)
    let d='';const n=30,stp=360/n;
    for(let k=0;k<n;k++){const a=phi+k*stp;const p=(ang,r)=>f(W[0]+Math.cos(rad(ang))*r)+','+f(W[1]+Math.sin(rad(ang))*r);d+=(k?'L':'M')+p(a,52)+'L'+p(a+8,62)+'L'+p(a+stp-1,52.5);}
    s+=`<path d="${d}Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${W[0]}" cy="${W[1]}" r="34" fill="none" stroke="${C.ink}" stroke-dasharray="2 3" opacity=".5"/>`;
    [0,90,180,270].forEach(a=>{const r=rad(a+phi);s+=L(W[0]+Math.cos(r)*8,W[1]+Math.sin(r)*8,W[0]+Math.cos(r)*46,W[1]+Math.sin(r)*46,C.ink,3);});
    s+=`<circle cx="${W[0]}" cy="${W[1]}" r="8" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=arcArrow(W[0],W[1],78,20,60,C.ink)+T(268,252,'FROM WEIGHT',{fill:C.ink,size:7});
    // drive weight (via gear train) and seconds dial
    s+=`<circle cx="340" cy="52" r="9" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`+L(349,52,349,wy,C.rope,2)+L(340,52,W[0]+10,W[1]-6,C.muted,1,'4 3');
    s+=`<rect x="334" y="${f(wy)}" width="30" height="34" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/>`+T(349,f(wy+20),'kg',{a:'middle',fill:C.ink,size:8,halo:false})+T(388,30,'WEIGHT',{a:'end'})+T(300,96,'via gear train',{size:7});
    s+=L(316,286,390,286,C.ink,2);
    s+=`<circle cx="66" cy="84" r="32" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    for(let i=0;i<12;i++){const a=rad(i*30);s+=L(66+Math.cos(a)*26,84+Math.sin(a)*26,66+Math.cos(a)*30,84+Math.sin(a)*30,C.ink,1.2);}
    const ha=rad(phi-90);s+=L(66,84,66+Math.cos(ha)*24,84+Math.sin(ha)*24,C.acc,2)+`<circle cx="66" cy="84" r="3" fill="${C.ink}"/>`+T(66,130,'SECONDS',{a:'middle'});
    // pendulum rod + bob

      else s+=`<g transform="rotate(${f(th)} ${P[0]} ${P[1]}) translate(200,${pl.part==='bar'||pl.part==='gear'?242:232}) scale(.5) rotate(${pl.part==='gear'?0:pl.rot})">${this.shape(pl.part,C.acc,fill)}</g>`;

    if(out&&key==='ok'&&t>.3){const k=Math.floor((t-.3)/.6);if(frac((t-.3)/.6)<.45) s+=T(k%2?262:112,64,k%2?'tock':'tick',{fill:C.blue,w:600,size:10,a:k%2?'start':'end'});}

/* ============ batch C: jack ============ */
/* MP-MECH id=jack const=SCISSORJACK */
/* ============ C5. SCISSOR CAR JACK (lead screw) ============
   Batch C. Physics (simplified): four equal arms form a diamond. The lead screw passes freely through the left
   side pivot (bearing on a collar) and threads into a nut on the right one; turning it pulls the side pivots
   together, which makes the diamond taller. A fine thread gives large mechanical advantage and is self-locking
   (its lead angle is smaller than the friction angle), so the load can't back-drive it.
   Wrong parts: coarse/steep thread (lifts but back-drives when released), nylon screw (threads strip under a car's
   load), smooth rod (nothing pulls the nut), rod lying across the base (not connected to the side pivots). */
const SCISSORJACK={
  id:'jack',title:'Scissor car jack',fig:'Jack · side view',rotStep:0,dur:3.6,
  prompt:'Turn the crank and the jack should lift the car, then hold it up when you let go. The part that joins the two side pivots is missing.',
  answer:{part:'fine',slot:'pivots',rot:0},
  slots:[{id:'base',label:'A',x:150,y:252,w:100,h:16,name:'across the base'},{id:'pivots',label:'B',x:82,y:215,w:240,h:22,name:'between the side pivots'}],
  parts:[
    {id:'coarse',name:'Fast screw',desc:'A steel rod with a steep, coarse thread. It travels much further per turn.',icon:()=>SCISSORJACK.rod('coarse',8,28,64,C.ink,0)},
    {id:'fine',name:'Steel lead screw',desc:'A steel rod with a fine thread and a collar at one end.',icon:()=>SCISSORJACK.rod('fine',8,28,64,C.ink,0)},
    {id:'nylon',name:'Nylon screw',desc:'The same fine thread and collar as the steel screw, but moulded in plastic.',icon:()=>SCISSORJACK.rod('nylon',8,28,64,C.ink,0)},
    {id:'smooth',name:'Smooth steel rod',desc:'A plain steel rod with a collar at one end. No thread at all, just polished smooth.',icon:()=>SCISSORJACK.rod('smooth',8,28,64,C.ink,0)}
  ],
  /* rod from x0 (collar end) length len, centred on y; ph shifts the thread marks (turning) */
  rod(id,x0,y,len,st,ph){
    const fill=id==='nylon'?'#f4efe2':C.steel;
    let s=`<rect x="${f(x0)}" y="${f(y-3.5)}" width="${f(len)}" height="7" rx="2" fill="${fill}" stroke="${st}" stroke-width="1.8"/>`;
    if(id!=='smooth'){const p=id==='coarse'?11:4.5,sl=id==='coarse'?5:2;
      for(let x=x0+8+frac(ph/p)*p;x<x0+len-2;x+=p) s+=L(x-sl/2,y+3,x+sl/2,y-3,id==='nylon'?'#a89f88':C.ink,1);}
    s+=`<rect x="${f(x0+1)}" y="${f(y-6.5)}" width="5" height="13" rx="1" fill="${fill}" stroke="${st}" stroke-width="1.6"/>`;
    return s;
  },
  evaluate(pl){
    if(pl.slot==='base') return {ok:false,key:'nolink',msg:'Lying across the base it isn’t connected to the side pivots. Turning it does nothing, so the jack never rises.'};
    switch(pl.part){
      case 'fine':return {ok:true,key:'ok'};
      case 'coarse':return {ok:false,key:'backdrive',msg:'A steep thread lifts fast, but it can’t hold. Let go and the car’s weight pushes the arms apart and simply spins the screw backwards, so down comes the car. A fine thread’s slope is so gentle that friction stops the weight from turning it. That’s called self-locking.'};
      case 'nylon':return {ok:false,key:'strip',msg:'Plastic threads can’t carry the weight of a car. As the load comes on they shear off, the nut slides along the stripped rod and the jack slumps back down.'};
      default:return {ok:false,key:'spin',msg:'A smooth rod has no thread to drag the nut along. The crank spins, the side pivots don’t move and the car stays down.'};
    }
  },
  why:'Turning the screw drags the nut on the right-hand pivot toward the collar on the left one. Pulling the side pivots together makes the diamond taller, so the car rises. The fine thread turns a small effort into a big push, and because its slope is so gentle, friction stops the car’s weight from spinning it backwards. Let go and it stays put.',
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let cap='';
    let h=46,c=0;
    if(out){
      if(key==='ok'){h=46+30*ease(seg(t,.2,2.2));c=1080*seg(t,.2,2.2);}
      else if(key==='backdrive'){h=46+30*ease(seg(t,.2,1.4))-30*Math.pow(seg(t,1.6,2.2),2);c=540*seg(t,.2,1.4)-700*Math.pow(seg(t,1.6,2.2),2);}
      else if(key==='strip'){h=46+6*ease(seg(t,.2,.9))-6*ease(seg(t,.95,1.15));c=1080*seg(t,.2,2.2);}
      else c=1080*seg(t,.2,2.2);
    }
    const Lr=110,w=Math.sqrt(Lr*Lr-h*h),yS=272-h,top=272-2*h,sill=top-10;
    const lift=2*(h-46),wl=Math.max(0,lift-16),wy=260-wl,WX=350;
    let s='';
    // ground
    s+=`<rect x="0" y="286" width="400" height="14" fill="url(#hatch2)"/>`+L(0,286,400,286,C.ink,2);
    // car body (sill) + wheel on its suspension
    s+=`<path d="M-4 ${f(sill)}H404V${f(sill-96)}H330L290 ${f(sill-150)}H120L80 ${f(sill-96)}H-4Z" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/><path d="M130 ${f(sill-140)}H200V${f(sill-100)}H100Z M212 ${f(sill-140)}H284L312 ${f(sill-100)}H212Z" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.2"/><rect x="150" y="${f(sill-6)}" width="100" height="6" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s+=zig(WX,sill,WX,wy-12,5,12,C.ink,2)+L(WX,wy-12,WX,wy,C.ink,4);
    s+=`<circle cx="${WX}" cy="${f(wy)}" r="26" fill="${C.rub}" stroke="${C.ink}" stroke-width="2"/><circle cx="${WX}" cy="${f(wy)}" r="13" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(wl>0.5) s+=L(WX,wy+28,WX,285,C.blue,1,'3 3')+T(WX-6,282,'WHEEL OFF THE GROUND',{a:'end',fill:C.blue,size:7});
    s+=T(30,f(sill-40),'CAR',{fill:C.ink,size:9});
    // base + arms
    s+=`<rect x="152" y="272" width="96" height="14" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/>`;
    const Lp=[200-w,yS],Rp=[200+w,yS],Tp=[200,top],Bp=[200,272];
    const arm=(a,b)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.ink}" stroke-width="10" stroke-linecap="round"/><line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.steel}" stroke-width="6" stroke-linecap="round"/>`;
    s+=arm(Lp,Bp)+arm(Rp,Bp)+arm(Lp,Tp)+arm(Rp,Tp);
    s+=`<rect x="178" y="${f(top-10)}" width="44" height="10" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/>`;
    [Tp,Bp].forEach(p=>{s+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="1.8"/>`;});
    // screw / rod
    let ex=null,ey=null;
    if(pl){
      if(pl.slot==='pivots'){const x0=Lp[0]-12;s+=this.rod(pl.part,x0,yS,Rp[0]+14-x0,C.acc,c/360*(pl.part==='coarse'?11:4.5));ex=x0-6;ey=yS;}
      else{s+=this.rod(pl.part,152,263,98,C.acc,c/360*(pl.part==='coarse'?11:4.5));ex=146;ey=263;}
    }
    // side pivot blocks: left = clearance hole, right = threaded nut
    s+=`<rect x="${f(Lp[0]-6)}" y="${f(yS-8)}" width="12" height="16" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.8"/><rect x="${f(Rp[0]-7)}" y="${f(yS-9)}" width="14" height="18" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.8"/>`;
    if(key==='strip'&&t>.9) for(let i=0;i<4;i++){const ph=frac(t*1.5+i*.25);s+=`<circle cx="${f(Rp[0]+4+ph*14)}" cy="${f(yS+6+ph*18)}" r="1.6" fill="#a89f88" opacity="${f(1-ph)}"/>`;}
    // crank
    if(ex!==null){s+=L(ex,ey,34,ey,C.ink,3)+`<circle cx="${f(ex)}" cy="${f(ey)}" r="4" fill="none" stroke="${C.ink}" stroke-width="2"/>`;
      const ca=rad(c);s+=L(34,ey,34+Math.cos(ca)*12,ey+Math.sin(ca)*12,C.ink,3)+`<circle cx="${f(34+Math.cos(ca)*12)}" cy="${f(ey+Math.sin(ca)*12)}" r="4.5" fill="${C.acc}" stroke="${C.ink}" stroke-width="1.5"/>`;}
    s+=T(Rp[0]+4,f(yS+24),'NUT',{size:7})+L(Rp[0]+8,yS+16,Rp[0]+3,yS+9)+T(148,282,'BASE',{size:7,a:'end'})+T(20,f(yS-18),'CRANK',{size:7})+T(Lp[0]-14,f(yS+24),'COLLAR',{size:7,a:'end'})+L(Lp[0]-14,yS+18,Lp[0]-10,yS+6);
    if(out&&key==='ok'&&t>2.3) s+=T(200,f(top-18),'HOLDS ✓',{a:'middle',fill:C.blue,w:600,size:9});
    if(out){
      if(key==='ok') cap=t<.2?'The jack’s saddle is touching the car…':t<2.2?'Cranking: the screw pulls the side pivots together and the jack rises…':'Let go. The car stays up. ✓';
      else if(key==='backdrive') cap=t<.2?'The jack’s saddle is touching the car…':t<1.4?'Cranking… it rises quickly.':t<1.6?'Letting go…':'The car’s weight spins the screw backwards. Down it comes.';
      else if(key==='strip') cap=t<.2?'The jack’s saddle is touching the car…':t<.95?'Cranking… the car starts to rise…':'Crack. The plastic threads strip and the jack slumps. The crank spins freely.';
      else if(key==='spin') cap=t<.2?'The jack’s saddle is touching the car…':'Cranking… the rod just spins. The jack doesn’t move.';
      else cap=t<.2?'The jack’s saddle is touching the car…':'Cranking… the rod spins on the base, joined to nothing. The jack doesn’t move.';
    }
    return [s,cap];
  }
};

/* ============ batch C: corkscrew ============ */
/* MP-MECH id=corkscrew const=CORKSCREW */
/* ============ C6. WING CORKSCREW (rack and pinion) ============
   Batch C. Physics (simplified): the body sits on the bottle neck. Turning the handle screws the worm into the
   cork, so the shaft sinks; its rack turns the gear segments on the ends of the wings and the wings rise. Pushing
   the wings down drives the rack (and cork) up with lever advantage. The rack's teeth are full rings so the shaft
   can still spin while meshed.
   Wrong parts: flat-sided rack (keys the shaft to the gears: handle can't turn), smooth sleeve (no mesh), short
   rack (runs out of teeth halfway), anything up by the handle (never reaches the wing gears). */
const CORKSCREW={
  id:'corkscrew',title:'Wing corkscrew',fig:'Corkscrew · cutaway',rotStep:0,dur:4,
  prompt:'Turn the handle and the worm screws into the cork while the wings rise. Push the wings down and the cork comes out. The toothed part on the shaft is missing.',
  answer:{part:'ring',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:186,y:52,w:28,h:36,name:'up by the handle'},{id:'A',label:'B',x:186,y:98,w:28,h:64,name:'between the wing gears'}],
  parts:[
    {id:'flat',name:'Flat-sided rack',desc:'A sleeve with straight teeth, cut across two flat faces only.',icon:()=>`<g transform="rotate(-90 40 28)">${CORKSCREW.rack('flat',40,-2,60,C.ink)}</g>`},
    {id:'smooth',name:'Smooth sleeve',desc:'A plain metal sleeve, the same size. No teeth.',icon:()=>`<g transform="rotate(-90 40 28)">${CORKSCREW.rack('smooth',40,-2,60,C.ink)}</g>`},
    {id:'short',name:'Short ring-toothed rack',desc:'Ring teeth like the proper rack, but the sleeve is less than half as long.',icon:()=>`<g transform="rotate(-90 40 28)">${CORKSCREW.rack('short',40,16,24,C.ink)}</g>`},
    {id:'ring',name:'Ring-toothed rack',desc:'A sleeve with its teeth cut as rings, all the way around.',icon:()=>`<g transform="rotate(-90 40 28)">${CORKSCREW.rack('ring',40,-2,60,C.ink)}</g>`}
  ],
  /* vertical sleeve centred on x, from y0 down len */
  rack(id,x,y0,len,st){
    const fill=C.part;let s=`<rect x="${f(x-7)}" y="${f(y0)}" width="14" height="${f(len)}" rx="1.5" fill="${fill}" stroke="${st}" stroke-width="1.8"/>`;
    if(id==='smooth') return s;
    for(let y=y0+3;y<y0+len-2;y+=5){
      s+=`<polygon points="${f(x-7)},${f(y)} ${f(x-10)},${f(y+2)} ${f(x-7)},${f(y+4)}" fill="${fill}" stroke="${st}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${f(x+7)},${f(y)} ${f(x+10)},${f(y+2)} ${f(x+7)},${f(y+4)}" fill="${fill}" stroke="${st}" stroke-width="1.2" stroke-linejoin="round"/>`;
      if(id!=='flat') s+=L(x-7,y+2,x+7,y+2,st,.9);
    }
    if(id==='flat') s+=L(x-3,y0+3,x-3,y0+len-3,st,.8)+L(x+3,y0+3,x+3,y0+len-3,st,.8);
    return s;
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'nomesh',msg:'Up by the handle it never comes near the wing gears. The worm screws into the cork, but the wings never rise, and pushing on them does nothing. The cork stays put.'};
    switch(pl.part){
      case 'ring':return {ok:true,key:'ok'};
      case 'flat':return {ok:false,key:'noturn',msg:'Straight teeth on flat faces lock into the wing gears like a key in a lock, so the shaft can’t spin. You can’t turn the handle, and the worm never goes into the cork.'};
      case 'smooth':return {ok:false,key:'slip',msg:'A smooth sleeve has no teeth for the wing gears to grip. The worm goes in, but the wings never rise, and pushing on them does nothing. The cork stays put.'};
      default:return {ok:false,key:'short',msg:'The rack is too short. The wings rise partway, then the shaft runs past the last tooth and the gears lose their grip. Push the wings down and they just swing freely. The cork stays in.'};
    }
  },
  why:'As the worm screws into the cork, the body stays on the bottle neck and the shaft sinks. The rack on the shaft turns the little gears on the ends of the wings, so the wings rise. Push the wings down and it runs backwards: the gears drive the rack up and pull the cork with plenty of leverage. The teeth are rings, not straight cuts, so the shaft can still spin while it’s meshed.',
  render(st){

        const p1=ease(seg(t,.2,1.8)),p2=ease(seg(t,2.2,3.6));spin=1080*seg(t,.2,1.8);

    s+=`<path d="M174 268Q160 290 120 300M226 268Q240 290 280 300" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`;
    // body (bell) on the neck, cutaway window

    s+=`<rect x="156" y="136" width="88" height="16" rx="3" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.6"/>`;
    // cork
    const cy=208-pull;
    s+=`<rect x="181" y="${f(cy)}" width="38" height="40" rx="3" fill="#c9a06a" stroke="${C.ink}" stroke-width="1.8"/>`;
    [[188,cy+10],[205,cy+18],[195,cy+30],[211,cy+33]].forEach(([x,y])=>{s+=`<circle cx="${x}" cy="${f(y)}" r="1.5" fill="#9b7646"/>`;});
    // worm (helix) + shaft
    const wt=168+D,wb=208+D;let wp='';
    for(let y=wt;y<=wb;y+=1){const ph=(y-wt)/40*4*Math.PI+rad(spin);wp+=(y===wt?'M':'L')+f(200+Math.sin(ph)*7*Math.min(1,(wb-y)/6+.15))+','+f(y);}
    s+=`<path d="${wp}" fill="none" stroke="${C.ink}" stroke-width="3.6" stroke-linecap="round"/><path d="${wp}" fill="none" stroke="${C.steel}" stroke-width="1.8" stroke-linecap="round"/>`;
    s+=`<rect x="197" y="${f(40+D)}" width="6" height="${f(128)}" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    // handle (spinning)
    const hw=Math.max(12,100*Math.abs(Math.cos(rad(spin))));
    s+=`<rect x="${f(200-hw/2+shake)}" y="${f(34+D)}" width="${f(hw)}" height="12" rx="6" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/>`;
    // rack / sleeve
    if(pl){if(inA){if(part==='short')s+=this.rack(part,200,128+D,24,C.acc);else s+=this.rack(part,200,100+D,60,C.acc);}
      else s+=this.rack(part,200,56+D,part==='short'?20:30,C.acc);}
    // wings: gear segment + lever
    const wing=(cx,a)=>{const r=rad(a),ex=cx+Math.cos(r)*66,ey=146+Math.sin(r)*66;

    s+=wing(179,aL)+wing(221,aR);
    if(out&&t>2.2&&t<3.6&&key!=='noturn'){[[179,aL,-1],[221,aR,1]].forEach(([cx,a,sg])=>{const r=rad(a),ex=cx+Math.cos(r)*66,ey=146+Math.sin(r)*66;s+=`<polygon points="${f(ex+sg*16)},${f(ey-4)} ${f(ex+sg*16-5)},${f(ey-12)} ${f(ex+sg*16+5)},${f(ey-12)}" fill="${C.blue}" transform="rotate(${f(sg*-30)} ${f(ex+sg*16)} ${f(ey-8)})"/>`;});}

};

/* ============ batch C: nozzle ============ */
/* MP-MECH id=nozzle const=HOSENOZZLE */
/* ============ C7. GARDEN HOSE TRIGGER NOZZLE (poppet valve + spring) ============
   Batch C. Physics (simplified): the poppet sits on the hose (upstream) side of the seat, rubber face toward the
   hole. Both the return spring and the water pressure push it into the hole, so higher pressure seals harder.
   The trigger lever presses the stem and pushes the poppet off its seat against them.
   Simplification: the trigger is drawn as a lever across the top of the nozzle that presses straight down on the
   stem (many real nozzles route a front trigger to the stem through a short linkage).
   Wrong parts: poppet upside down (stem away from the trigger, metal back on the seat: drips, can't open),
   small poppet (passes the hole: always on), stemless disc (seals but can't be opened), brass poppet (opens,
   but metal-to-metal never seals: drips), anything above the seat (pressure lifts it off: always on). */
const HOSENOZZLE={
  id:'nozzle',title:'Hose nozzle',fig:'Nozzle · cutaway',rotStep:180,dur:3.8,
  prompt:'With the hose on, nothing should come out until you squeeze the trigger. Let go and it should shut off without a drip. The valve plug is missing.',
  answer:{part:'poppet',slot:'below',rot:180},
  slots:[{id:'above',label:'A',x:308,y:114,w:40,h:30,name:'above the seat (nozzle side)'},{id:'below',label:'B',x:308,y:160,w:40,h:30,name:'below the seat (hose side)'}],
  parts:[
    {id:'small',name:'Small poppet',desc:'The same shape, but narrower than the hole in the seat.',icon:()=>HOSENOZZLE.plug('small',40,6,true,26,C.ink)},
    {id:'disc',name:'Rubber disc',desc:'A thick rubber disc, as wide as the poppet. No stem.',icon:()=>HOSENOZZLE.plug('disc',40,23,false,0,C.ink)},
    {id:'poppet',name:'Rubber-faced poppet',desc:'A plug with a rubber face, and a long stem sticking out of that same face.',icon:()=>HOSENOZZLE.plug('poppet',40,6,true,26,C.ink)},
    {id:'brass',name:'Brass poppet',desc:'The same shape as the rubber-faced poppet, but solid brass. No rubber.',icon:()=>HOSENOZZLE.plug('brass',40,6,true,26,C.ink)}
  ],
  /* local plug: face y0..y0+6 (top), body to y0+18, stem up from y0. flip: body on top, face below, stem down */
  plug(id,cx,y0,flip,stem,st){
    const wF=id==='small'?12:28,wB=id==='small'?10:24,face=id==='brass'?'#c9a24a':C.rub,body=id==='brass'?'#c9a24a':C.steel;
    let g='';
    if(id==='disc') return `<rect x="${f(cx-14)}" y="${f(y0)}" width="28" height="10" rx="2" fill="${C.rub}" stroke="${st}" stroke-width="2"/>`;
    if(stem>0) g+=`<rect x="${f(cx-3)}" y="${f(y0-stem)}" width="6" height="${f(stem+2)}" fill="${body}" stroke="${st}" stroke-width="1.6"/>`;
    g+=`<rect x="${f(cx-wB/2)}" y="${f(y0+6)}" width="${wB}" height="12" rx="2" fill="${body}" stroke="${st}" stroke-width="2"/><rect x="${f(cx-wF/2)}" y="${f(y0)}" width="${wF}" height="6" rx="1.5" fill="${face}" stroke="${st}" stroke-width="2"/>`;
    return flip?`<g transform="translate(0,${f(2*y0+18)}) scale(1,-1)">${g}</g>`:g;
  },
  evaluate(pl){
    if(pl.slot==='above') return {ok:false,key:'alwayson',msg:'Above the seat, the water pushes the plug up and away from the hole, and the spring can’t reach it. Water pours out the moment the hose is on, and letting go of the trigger can’t stop it.'};
    const up=pl.rot%360===180;
    switch(pl.part){
      case 'poppet':return up?{ok:true,key:'ok'}:{ok:false,key:'backwards',msg:'The poppet is upside down. Its stem points down into the spring, so the trigger has nothing to press, and its bare metal back sits on the seat, so it seeps. A slow drip, but no spray.'};
      case 'small':return {ok:false,key:'alwayson',msg:'The small poppet is narrower than the hole, so it can never block it. Water flows straight around it: it sprays as soon as the hose is on, and letting go of the trigger doesn’t stop it.'};
      case 'disc':return {ok:false,key:'noopen',msg:'The disc seals the hole nicely, but it has no stem. The trigger has nothing to press, so nothing can push the disc off its seat. Not a drop comes out.'};
      default:return up?{ok:false,key:'drip',msg:'It opens fine, but hard brass on a hard metal seat never seals perfectly. Let go and it keeps dribbling. The rubber face is what makes the seal.'}
        :{ok:false,key:'backwards',msg:'Upside down, its stem points down into the spring, so the trigger has nothing to press. And bare brass on a metal seat never seals perfectly. A slow drip, but no spray.'};
    }
  },
  why:'The poppet sits on the hose side of the seat, rubber face up. The spring and the water pressure both push it into the hole, so the harder the water pushes, the tighter it seals. Squeezing the trigger presses the stem and shoves the poppet off its seat against them. Let go and the spring snaps it shut, and the soft rubber seals without a drip.',
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let cap='';
    const part=pl?pl.part:null,inA=pl&&pl.slot==='below',up=pl?pl.rot%360===180:true;
    const stemToLever=inA&&up&&part!=='disc'&&part!=='small'||(inA&&part==='small'&&up);
    let beta=0;
    if(out){const bm=stemToLever?11:11.5;beta=t<2.2?bm*ease(seg(t,.3,.7)):bm*(1-ease(seg(t,2.2,2.5)));}
    const pp=stemToLever?Math.max(0,44*Math.sin(rad(beta))-.5):0;
    let flow=0,drip=false;
    if(out){
      if(key==='ok')flow=pp>1?1:0;
      else if(key==='alwayson')flow=t>.15?1:0;
      else if(key==='drip'){flow=pp>1?1:0;drip=!flow&&t>.2;}
      else if(key==='backwards')drip=t>.3;
    }
    let s='';
    // body shell
    s+=`<path d="M120 76H356V270H300V112H120Z" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/>`;
    s+=`<polygon points="120,80 100,90 100,98 120,108" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/>`;
    // passages
    s+=`<path d="M126 84H348V258H308V104H126Z" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.2" stroke-linejoin="round"/>`;
    s+=`<rect x="308" y="158" width="40" height="100" fill="${C.water}" opacity=".75"/>`;
    if(flow>0) s+=`<path d="M126 84H348V150H308V104H126Z" fill="${C.water}" opacity="${f(.75*flow)}"/>`;
    else if(drip) s+=`<rect x="126" y="100" width="182" height="4" fill="${C.water}" opacity=".6"/>`;
    // hose connector
    s+=`<rect x="312" y="270" width="32" height="22" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.6"/>`+L(316,276,340,276,C.ink,1)+L(316,282,340,282,C.ink,1);
    // seat plate with hole, bottom cap
    s+=`<rect x="308" y="150" width="12" height="8" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.4"/><rect x="336" y="150" width="12" height="8" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.4"/>`;
    s+=`<rect x="308" y="258" width="40" height="6" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.4"/><rect x="316" y="258" width="5" height="6" fill="${C.water}"/><rect x="335" y="258" width="5" height="6" fill="${C.water}"/>`;
    // gland where the stem leaves the top
    s+=`<rect x="322" y="72" width="12" height="6" rx="1" fill="${C.rub}" stroke="${C.ink}" stroke-width="1.2"/>`;
    // the plug, drawn over the existing return spring
    let springTop=176,ps='';
    if(pl){
      if(inA){
        if(part==='disc'){ps=this.plug('disc',328,158,false,0,C.acc);springTop=168;}
        else if(part==='small'){const y=up?150+pp:150;ps=this.plug('small',328,y,!up,up?y-49:22,C.acc);springTop=y+18;}
        else if(up){const y=158+pp;ps=this.plug(part,328,y,false,y-49,C.acc);springTop=y+18;}
        else ps=this.plug(part,328,158,true,26,C.acc);
      }else{
        if(part==='disc') ps=this.plug('disc',328,122,false,0,C.acc);
        else{const y=part==='small'?124:120;ps=this.plug(part,328,y,!up,up?y-49:22,C.acc);}
      }
    }
    s+=zig(328,springTop,328,258,6,22,C.ink,2)+ps;
    // trigger lever
    const b=rad(beta),lx=372-140*Math.cos(b),ly=44+140*Math.sin(b);
    s+=`<line x1="372" y1="76" x2="372" y2="44" stroke="${C.ink}" stroke-width="5"/>`;
    s+=`<line x1="372" y1="44" x2="${f(lx)}" y2="${f(ly)}" stroke="${C.ink}" stroke-width="11" stroke-linecap="round"/><line x1="372" y1="44" x2="${f(lx)}" y2="${f(ly)}" stroke="${C.blue}" stroke-width="7" stroke-linecap="round"/>`;
    for(let i=0;i<5;i++){const d=106+i*7;s+=L(372-d*Math.cos(b),44+d*Math.sin(b)-3.5,372-d*Math.cos(b),44+d*Math.sin(b)+3.5,'#c9d7e4',1.4);}
    s+=`<circle cx="372" cy="44" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    if(out&&t>.3&&t<2.3) s+=`<polygon points="${f(lx+8)},${f(ly-22)} ${f(lx+2)},${f(ly-32)} ${f(lx+14)},${f(ly-32)}" fill="${C.ink}"/>`;
    // spray / drips
    if(flow>0){for(let i=0;i<9;i++){const a=rad(180-24+i*6);for(let j=0;j<3;j++){const u=frac(t*2.4+j/3+i*.13),r0=8+u*84;s+=`<circle cx="${f(100+Math.cos(a)*r0)}" cy="${f(94+Math.sin(a)*r0*.8)}" r="${f(1.3+u*1.2)}" fill="#5f9cbf" opacity="${f(1-u*.7)}"/>`;}}}
    if(drip){for(let j=0;j<2;j++){const u=frac(t*.9+j*.5);s+=`<path d="M103 ${f(100+u*170)}q-3 5 0 7q3-2 0-7z" fill="#5f9cbf" opacity="${f(1-u*.5)}"/>`;}}
    // labels
    s+=T(128,40,'TRIGGER (SQUEEZE)')+T(150,272,'WATER UNDER',{size:7})+T(150,281,'HOSE PRESSURE →',{size:7})+T(270,140,'SEAT',{a:'end'})+L(272,138,308,153)+T(270,218,'RETURN',{a:'end'})+T(270,227,'SPRING',{a:'end'})+L(272,221,318,221);
    s+=T(300,298,'FROM HOSE ↑',{a:'end',size:7})+T(100,124,'SPRAY TIP')+T(392,140,'STEM',{a:'end'})+L(372,138,331,124);
    if(out&&key==='ok'&&t>2.6) s+=T(150,150,'NO DRIP ✓',{fill:C.blue,w:600,size:9});
    if(out){
      const pre=t<.3?'Hose on, trigger released…':null;
      if(key==='ok') cap=pre||(t<.7?'Squeezing the trigger…':t<2.2?'The stem pushes the poppet off its seat. Spray!':t<2.6?'Letting go…':'The spring snaps the poppet shut. Not a drop. ✓');
      else if(key==='alwayson') cap=t<.3?'Hose on… it’s already spraying.':t<2.4?'It sprays whether you squeeze or not…':'Let go, and it keeps spraying.';
      else if(key==='noopen') cap=pre||(t<2.2?'Squeezing… the trigger presses on nothing. No water.':'Nothing ever comes out.');
      else if(key==='backwards') cap=pre||'Squeezing does nothing, and the nozzle just drips.';
      else cap=pre||(t<.7?'Squeezing the trigger…':t<2.2?'Spray!':t<2.6?'Letting go…':'It keeps dribbling.');
    }
    return [s,cap];
  }
};

/* ============ batch C: toaster ============ */
/* MP-MECH id=toaster const=TOASTER */
/* ============ C8. POP-UP TOASTER (latch + spring) ============
   Batch C. Physics (simplified): pushing the lever stretches the lift spring and drives a tab on the carriage down
   past a sprung catch. The catch's sloped top lets the tab push it aside; its flat underside then hooks over the
   tab and holds the carriage down (which also closes the power switch, so the elements heat). At the end of the
   time the timer pulls the catch aside and the spring pops the carriage up.
   Simplifications: the power switch is implied (elements on only while the carriage is latched at the bottom);
   the timer is drawn as a dial with a pull cable to the catch.
   Wrong parts: catch upside down / fixed hook (tab can't get past: jams, never switches on), springy bump (rides
   over and back: no latch), permanent magnet (holds, but can't be released: burns), anything high on the rail. */
const TOASTER={
  id:'toaster',title:'Pop-up toaster',fig:'Toaster · cutaway',rotStep:180,dur:4.4,
  prompt:'Push the lever down and the bread should stay down while it toasts, then pop up when the timer runs out. Something has to hold the carriage down.',
  answer:{part:'catch',slot:'low',rot:0},
  slots:[{id:'high',label:'A',x:254,y:84,w:52,h:34,name:'high on the rail'},{id:'low',label:'B',x:254,y:228,w:52,h:40,name:'low, beside the tab'}],
  parts:[
    {id:'fixed',name:'Fixed hook',desc:'The same hook shape, sloped top and flat underside, but bolted solid. It can’t swing.',icon:()=>`<g transform="translate(48,49) scale(1.15)">${TOASTER.shape('fixed',C.ink,C.steel,0)}</g>`},
    {id:'catch',name:'Sprung catch',desc:'A hook with a sloped top and a flat underside. It swings on a pin, and a small spring pushes it back.',icon:()=>`<g transform="translate(48,49) scale(1.15)">${TOASTER.shape('catch',C.ink,C.steel,0)}</g>`},
    {id:'bump',name:'Springy bump',desc:'A smooth, rounded bump on a strip of spring steel.',icon:()=>`<g transform="translate(48,49) scale(1.15)">${TOASTER.shape('bump',C.ink,C.steel,0)}</g>`},
    {id:'magnet',name:'Permanent magnet',desc:'A strong permanent magnet. It will grip the steel carriage and hold it down.',icon:()=>`<g transform="translate(52,40) scale(1.4)">${TOASTER.shape('magnet',C.ink,C.steel,0)}</g>`}
  ],
  /* local frame: catch pivot at 0,0 on the floor (world 284,268 for spot A); the hook stands up from it.
     defl swings the top of the hook (or the bump) out to the right */
  shape(id,st,fill,defl){
    const hook=`<polygon points="4,2 4,-34 -18,-22 -18,-19 -4,-19 -4,2" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/>`;
    if(id==='catch') return zig(4,-10,22,-10,3,6,st,1.6)+`<g transform="rotate(${f(defl)})">${hook}<circle r="3" fill="${C.card}" stroke="${st}" stroke-width="1.6"/></g>`;
    if(id==='fixed') return hook+`<circle cy="-4" r="1.8" fill="${st}"/><circle cy="-11" r="1.8" fill="${st}"/><rect x="-8" y="0" width="16" height="4" fill="${st}"/>`;
    if(id==='bump') return `<path d="M2 4V-12Q${f(-18+defl)} -21 2 -30V-36" fill="none" stroke="${st}" stroke-width="3.2" stroke-linecap="round"/><rect x="2" y="-38" width="6" height="42" fill="${fill}" stroke="${st}" stroke-width="1.5"/>`;
    return `<rect x="-26" y="-14" width="14" height="9" fill="#c0503a" stroke="${st}" stroke-width="1.6"/><rect x="-12" y="-14" width="14" height="9" fill="#5b7fa6" stroke="${st}" stroke-width="1.6"/>`;
  },
  evaluate(pl){
    if(pl.slot==='high') return {ok:false,key:'nolatch',msg:'Up there it’s above the tab’s whole path, so nothing holds the carriage down. Let go of the lever and the spring pops the bread straight back up, untoasted.'};
    switch(pl.part){
      case 'catch':return pl.rot%360===0?{ok:true,key:'ok'}:{ok:false,key:'upside',msg:'Upside down, the catch’s flat side faces up. The tab lands on the flat top and can’t push it aside, so the lever jams partway down and the toaster never switches on.'};
      case 'fixed':return {ok:false,key:'block',msg:'The hook is bolted solid, so it can’t swing aside to let the tab past. The lever jams just short of the bottom, and the toaster never switches on.'};
      case 'bump':return {ok:false,key:'nolatch',msg:'The tab rides over the smooth bump on the way down, and straight back over it on the way up. Nothing hooks it, so the bread pops up the moment you let go.'};
      default:return {ok:false,key:'burn',msg:'The magnet holds the carriage down just fine, but nothing can switch a permanent magnet off. The timer runs out, the elements stay on, and the toast turns to charcoal. (Many toasters do use a magnet here, but an electromagnet that the timer switches off.)'};

  /* v3: stop quietly if the player has moved on (another mechanism, practice) while this one was still animating */
  const fr=nowT=>{if(anim!==a)return;a.t=Math.min(mech.dur,Math.max(0,(nowT-t0)/1000));drawStage();
    if(a.t<mech.dur) requestAnimationFrame(fr); else{a.running=false;cb&&cb();}};
  requestAnimationFrame(fr);
}
function showFeedback(kind,out){
  const fb=$('feedback'),r=R(),last=idx>=order.length-1;
  const nextBtn=`<button class="btn dark" id="nextBtn">${last?'See results →':'Next mechanism →'}</button>`;
  let h='';
  if(kind==='win'){fb.className='feedback win';h=`<b class="h">It works! ${starStr(r.stars)}</b>${mech.why}<div class="row">${nextBtn}</div>`;}
  else if(kind==='fail'){fb.className='feedback fail';const left=3-r.tries.length;h=`<b class="h">Didn’t work.</b>${out.msg}<div class="row"><span class="mono" style="font-size:12px;color:var(--muted)">${left} attempt${left===1?'':'s'} left. Adjust and test again.</span></div>`;}
  else if(kind==='out'){fb.className='feedback fail';h=`<b class="h">Out of attempts.</b>${out.msg}<div class="row"><button class="btn" id="revealBtn">Watch the working setup</button>${nextBtn}</div>`;}
  else{fb.className='feedback win';h=`<b class="h">The working setup ${r.stars?starStr(r.stars):''}</b>${mech.why}<div class="row">${nextBtn}</div>`;}
  if(kind!=='fail') h+=replayNote(mech.id);
  fb.innerHTML=h;fb.classList.remove('hidden');setStageState(kind==='fail'||kind==='out'?'fail':'win');
  fb.querySelectorAll('[data-replay]').forEach(x=>x.onclick=()=>replayMech(x.dataset.replay));
  const nb=$('nextBtn');if(nb)nb.onclick=()=>{if(idx>=order.length-1)showSummary();else loadMech(idx+1);};
  const rb=$('revealBtn');if(rb)rb.onclick=()=>{place={...mech.answer};fb.classList.add('hidden');setStageState('');runAnim({ok:true,key:'ok'},()=>showFeedback('reveal'));renderAll();};
}
function showSummary(){
  $('game').classList.add('hidden');renderProgress();
  const tot=order.reduce((a,id)=>a+((res[id]&&res[id].stars)||0),0),max=order.length*3;
  const grid=order.map(id=>{const n=(res[id]&&res[id].stars)||0;return '⭐'.repeat(n)+'⬜'.repeat(3-n);}).join('\n');
  const sk=mode==='daily'?streak():null;
  const share=`Missing Piece${mode==='daily'?' No. '+puzzleNo:' (practice)'}\n${grid}\n${tot}/${max}${sk&&sk.n>1?` · 🔥${sk.n}-day streak`:''}`;
  const S=$('summary');S.classList.remove('hidden');
  S.innerHTML=`<div class="sum"><div class="plate-head">${mode==='daily'?'Today’s bench · complete':'Practice · complete'}</div><h2>${tot} / ${max} stars</h2>${sk?`<div class="streak">${sk.n>1?`🔥 ${sk.n}-day streak`:'Day 1 of a new streak'}${sk.best>sk.n?` · best ${sk.best}`:''}${tot===max?' · perfect bench':''}</div>`:''}
  <table>${order.map((id,i)=>`<tr><td>${i+1}. ${MECHS[id].title}${res[id]&&res[id].replay?' <span class="hint">(replayed)</span>':''}</td><td>${starStr((res[id]&&res[id].stars)||0)}</td></tr>`).join('')}</table>
  ${order.map(id=>replayNote(id).replace('Replay this mechanism','Replay '+esc(MECHS[id].title))).join('')}
  <pre class="share" id="shareTxt">${share}</pre>
  <div class="row acts"><button class="btn primary" style="margin-left:0" id="copyBtn">Copy result</button><button class="btn" id="reviewBtn">Review mechanisms</button><button class="btn" id="otherBtn">${mode==='daily'?`Practice all ${IDS.length}`:'Back to today’s puzzle'}</button></div>
  ${mode==='daily'?'<div class="cd" id="cd"></div>':''}</div>`;
  S.querySelectorAll('[data-replay]').forEach(x=>x.onclick=()=>replayMech(x.dataset.replay));
  $('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(share);$('copyBtn').textContent='Copied ✓';}catch(e){const rg=document.createRange();rg.selectNodeContents($('shareTxt'));const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);$('copyBtn').textContent='Selected. Press Ctrl/⌘+C';}};
  $('reviewBtn').onclick=()=>{$('summary').classList.add('hidden');$('game').classList.remove('hidden');loadMech(0);};
  $('otherBtn').onclick=()=>start(mode==='daily'?'practice':'daily');
  clearTimeout(cdTimer);
  if(mode==='daily'){const tick=()=>{const e=$('cd');if(!e)return;const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),d=Math.max(0,m-n);const h=Math.floor(d/36e5),mi=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);e.textContent=`Next bench in ${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`;cdTimer=setTimeout(tick,1000);};tick();}
}
$('modeBtn').onclick=()=>start(mode==='daily'?'practice':'daily');
start('daily');
</script>
