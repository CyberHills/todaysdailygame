<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missing Piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2621;--paper:#f3ede1;--card:#fbf8f1;--acc:#d4572a;--blue:#2f5d8a;--muted:#7d7466;--line:#d9d0bf;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);background-image:linear-gradient(rgba(47,93,138,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(47,93,138,.05) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.tag{font-size:13px;color:var(--muted);margin-top:5px;font-style:italic}
.meta{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.meta>*{white-space:nowrap}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
nav{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);border-radius:4px;padding:6px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--card);display:flex;justify-content:space-between;gap:4px;color:var(--muted);min-width:0}
.chip span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.cur{border-color:var(--ink);color:var(--ink)}
.chip .st{color:var(--acc);letter-spacing:1px;white-space:nowrap}
.plate{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 14px 10px;box-shadow:4px 4px 0 rgba(43,38,33,.12);position:relative}
.plate-head{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.pip.used{background:var(--acc);border-color:var(--acc)}
.pip.win{background:var(--blue);border-color:var(--blue)}
h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:6px 0 4px}
#mPrompt{margin:0 0 10px;font-size:15px;line-height:1.45}
.stage-wrap{position:relative;border:1.5px solid var(--line);border-radius:4px;background:#f8f4ea;overflow:hidden}
#stage{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.caption{font-size:12px;color:var(--ink);min-height:34px;padding:8px 2px 0;line-height:1.4}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--card);font:12px "IBM Plex Mono",monospace;padding:6px 10px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.feedback{margin-top:12px;border-radius:6px;padding:12px 14px;border:2px solid var(--ink);background:var(--card);font-size:14.5px;line-height:1.5}
.feedback.fail{border-color:var(--acc)}
.feedback.win{border-color:var(--blue)}
.feedback b.h{display:block;font-family:Fraunces,Georgia,serif;font-size:18px;margin-bottom:2px}
.feedback.fail b.h{color:var(--acc)}
.feedback.win b.h{color:var(--blue)}
.feedback .row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.bench{margin-top:14px}
.bench-head{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.part{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:6px 4px 7px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative}
.part:hover{border-color:var(--ink)}
.part.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(212,87,42,.25);transform:translateY(-2px)}
.part.off{opacity:.45;pointer-events:none}
.part svg{width:100%;height:auto;display:block;transition:transform .2s}
.part .nm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.25;margin-top:2px}
.part .badge{position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;font:600 9px "IBM Plex Mono",monospace;padding:1px 4px;border-radius:3px}
.inspect{min-height:44px;margin:10px 0 2px;font-size:14px;line-height:1.45;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.inspect b{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.03em}
.inspect .hint{color:var(--muted)}
.controls{display:flex;gap:8px;margin-top:10px}
.btn{font:600 14px "IBM Plex Sans",sans-serif;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn:hover{background:#efe8da}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--line)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;margin-left:auto;min-width:120px}
.btn.primary:hover{background:#bf4a20}
.btn.dark{background:var(--ink);color:var(--card)}
.ghost-drag{position:fixed;z-index:50;width:84px;pointer-events:none;transform:translate(-50%,-60%);opacity:.9;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
#summary{margin-top:16px}
.sum{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:4px 4px 0 rgba(43,38,33,.12)}
.sum h2{margin-top:0}
.sum table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.sum td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.sum td:last-child{text-align:right;color:var(--acc);letter-spacing:2px}
.share{background:#f3ede1;border:1.5px dashed var(--line);border-radius:4px;padding:10px;font:13px/1.5 "IBM Plex Mono",monospace;white-space:pre-wrap;margin:0 0 10px}
.cd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:12px}
@media (max-width:520px){
 h1{font-size:25px}.tag{font-size:12px}
 .tray{grid-template-columns:repeat(4,1fr);gap:6px}
 .part .nm{font-size:9.5px}
 .btn{padding:9px 10px;font-size:13px}
 .btn.primary{min-width:96px}
 h2{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l3 5 5-2 1 5 5 1-2 5 5 3-5 3 2 5-5 1-1 5-5-2-3 5-3-5-5 2-1-5-5-1 2-5-5-3 5-3-2-5 5-1 1-5 5 2z" fill="#f3cdb6" stroke="#2b2621" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="20" r="6" fill="#fbf8f1" stroke="#2b2621" stroke-width="2"/><path d="M20 3l3 5 5-2 1 5" fill="none" stroke="#d4572a" stroke-width="2.4" stroke-dasharray="3 2"/></svg>
      <div><h1>Missing Piece</h1><div class="tag">You know the object. Do you know what makes it work?</div></div>
    </div>
    <div class="meta"><span id="dateLbl"></span><button id="modeBtn" class="link">Practice all 5</button></div>
  </header>
  <nav id="progress"></nav>
  <main id="game">
    <section class="plate">
      <div class="plate-head"><span id="figNo"></span><span class="pips" id="pips" title="Attempts"></span></div>
      <h2 id="mTitle"></h2>
      <p id="mPrompt"></p>
      <div class="stage-wrap"><svg id="stage" viewBox="0 0 400 300" aria-label="Mechanism"></svg><div id="toast"></div></div>
      <div id="caption" class="mono caption"></div>
    </section>
    <section id="feedback" class="feedback hidden"></section>
    <section class="bench" id="bench">
      <div class="bench-head mono">PARTS BIN · TAP TO INSPECT · DRAG ONTO A MARKED SPOT (OR TAP THE SPOT)</div>
      <div id="tray" class="tray"></div>
      <div id="inspect" class="inspect"></div>
      <div class="controls">
        <button id="rotBtn" class="btn">↻ Rotate</button>
        <button id="clrBtn" class="btn ghost">Remove</button>
        <button id="testBtn" class="btn primary">Test it</button>
      </div>
    </section>
  </main>
  <section id="summary" class="hidden"></section>
</div>

<script>
/* ============ drawing helpers ============ */
const C={ink:'#2b2621',paper:'#f6f1e6',card:'#fbf8f1',acc:'#d4572a',blue:'#2f5d8a',steel:'#cdc7ba',steelD:'#9d968a',rub:'#3b3834',water:'#9fcbe2',ghost:'#ebe4d5',part:'#f3cdb6',rope:'#a07d4a',muted:'#8a8174'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const f=n=>(+n).toFixed(1);
const rad=d=>d*Math.PI/180;
const frac=x=>x-Math.floor(x);
function T(x,y,s,o={}){return `<text x="${f(x)}" y="${f(y)}" font-family="IBM Plex Mono, monospace" font-size="${o.size||8}" fill="${o.fill||C.muted}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" letter-spacing=".05em">${s}</text>`;}
function L(x1,y1,x2,y2,col=C.muted,w=0.8,dash=''){return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;}
function zig(x1,y1,x2,y2,n,w,col=C.acc,sw=2.6){
  const dx=x2-x1,dy=y2-y1,Ln=Math.hypot(dx,dy)||1,ux=dx/Ln,uy=dy/Ln,nx=-uy,ny=ux;
  const lead=Math.min(5,Ln*.1);const pts=[[x1,y1],[x1+ux*lead,y1+uy*lead]];
  const sg=(Ln-2*lead)/(n*2);
  for(let i=0;i<n*2;i++){const s=lead+sg*(i+.5),sd=(i%2?-1:1)*w/2;pts.push([x1+ux*s+nx*sd,y1+uy*s+ny*sd]);}
  pts.push([x2-ux*lead,y2-uy*lead],[x2,y2]);
  return `<polyline points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function gearPath(cx,cy,r,n,depth,ang){
  const st=2*Math.PI/n,a0=rad(ang),ri=r-depth/2,ro=r+depth/2;let d='';
  for(let k=0;k<n;k++){const a=a0+k*st;
    const P=[[a-st*.5,ri],[a-st*.22,ri],[a-st*.13,ro],[a+st*.13,ro],[a+st*.22,ri]];
    P.forEach((p,i)=>{d+=(k===0&&i===0?'M':'L')+f(cx+Math.cos(p[0])*p[1])+','+f(cy+Math.sin(p[0])*p[1]);});}
  return d+'Z';
}
function gear(cx,cy,r,n,depth,ang,fill,stroke=C.ink,sw=2){
  const a=rad(ang);
  return `<path d="${gearPath(cx,cy,r,n,depth,ang)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`+
  `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r*.62)}" fill="none" stroke="${C.ink}" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>`+
  `<line x1="${f(cx)}" y1="${f(cy)}" x2="${f(cx+Math.cos(a)*r*.62)}" y2="${f(cy+Math.sin(a)*r*.62)}" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`+
  `<circle cx="${f(cx)}" cy="${f(cy)}" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
}
function arcArrow(cx,cy,r,a1,a2,col=C.blue){
  const p=a=>[cx+Math.cos(rad(a))*r,cy+Math.sin(rad(a))*r];const [x1,y1]=p(a1),[x2,y2]=p(a2);
  const ar=rad(a2),dx=-Math.sin(ar),dy=Math.cos(ar),nx=Math.cos(ar),ny=Math.sin(ar);
  const large=(a2-a1)>180?1:0;
  return `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 ${large} 1 ${f(x2)},${f(y2)}" fill="none" stroke="${col}" stroke-width="1.6"/>`+
  `<polygon points="${f(x2+dx*2)},${f(y2+dy*2)} ${f(x2-dx*7+nx*4)},${f(y2-dy*7+ny*4)} ${f(x2-dx*7-nx*4)},${f(y2-dy*7-ny*4)}" fill="${col}"/>`;
}
function torsion(cx,cy,rot,col=C.acc){
  return `<g transform="translate(${f(cx)},${f(cy)}) rotate(${rot})"><circle r="9" fill="none" stroke="${col}" stroke-width="2.6"/><circle r="5" fill="none" stroke="${col}" stroke-width="2"/><polyline points="-8,-4 -26,-20 -30,-17" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/><polyline points="8,4 26,20 30,17" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/></g>`;
}
const DEFS=`<defs>
<pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#2f5d8a" stroke-opacity=".07" stroke-width=".6"/></pattern>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#efe7d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2b2621" stroke-opacity=".12" stroke-width="1.4"/></pattern>
<pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#e6dfcf"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2b2621" stroke-opacity=".25" stroke-width="1"/></pattern>
</defs><rect width="400" height="300" fill="url(#grid)"/>`;

/* ============ 1. DOOR LATCH ============ */
const LATCH={
  id:'latch',title:'Door latch',fig:'Door latch · cutaway',rotStep:90,dur:2.8,
  prompt:'Turn the handle and the bolt slides into the door. Let go, and it should spring back out to catch the frame. One part is missing.',
  answer:{part:'comp',slot:'B',rot:0},
  slots:[{id:'A',label:'A',x:66,y:108,w:31,h:84,name:'in front of the flange'},{id:'B',label:'B',x:110,y:108,w:98,h:84,name:'behind the flange'}],
  parts:[
    {id:'comp',name:'Compression spring',desc:'Squeeze its ends together and it pushes back.',icon:()=>zig(8,28,72,28,6,24,C.ink,2.4)},
    {id:'tors',name:'Torsion spring',desc:'Twist its legs around a pin and it twists back.',icon:()=>torsion(40,28,0,C.ink)},
    {id:'washer',name:'Flat washer',desc:'A thin steel ring that spreads a load or fills a gap.',icon:()=>`<circle cx="40" cy="28" r="18" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'spacer',name:'Rigid spacer',desc:'A solid block that holds two parts a fixed distance apart.',icon:()=>`<rect x="12" y="17" width="56" height="22" rx="2" fill="#dccfb4" stroke="${C.ink}" stroke-width="2"/><line x1="12" y1="23" x2="68" y2="23" stroke="${C.ink}" stroke-opacity=".25"/>`}
  ],
  evaluate(pl){
    const vert=pl.rot%180!==0;
    if(pl.part==='comp'){
      if(vert) return {ok:false,key:'sideways',msg:'Turned sideways, the spring presses on the housing walls instead of along the bolt’s path. Nothing pushes the latch back out.'};
      if(pl.slot==='B') return {ok:true,key:'ok'};
      return {ok:false,key:'wrongside',msg:'In front of the flange, the spring pushes the bolt <i>into</i> the door. It holds the latch in, so the door never catches.'};
    }
    if(pl.part==='tors') return {ok:false,key:'noreturn',msg:'A torsion spring stores energy by twisting around a pin. Nothing here twists, so it just rattles around and the latch stays in.'};
    if(pl.part==='washer') return {ok:false,key:'noreturn',msg:'A washer only takes up space. It stores no energy, so nothing pushes the latch back out.'};
    if(pl.slot==='B') return {ok:false,key:'jam',msg:'A solid spacer behind the flange leaves the bolt nowhere to go. The handle won’t turn and the door is stuck shut.'};
    return {ok:false,key:'noreturn',msg:'In front of the flange the spacer doesn’t block anything, but it doesn’t push anything back either. The latch stays in.'};
  },
  why:'The compression spring sits between the bolt’s back flange and the housing wall. Turning the handle drags the flange back and squeezes the spring. Let go, and the spring pushes the bolt out into the strike plate. That’s the click you hear when a door shuts.',
  render(st){
    const {pl,out,t}=st;let g=0,p=0,sh=0,cap='';
    if(out){
      if(out.key==='jam'){g=.05*ease(seg(t,0,.5));sh=(t>.15&&t<2)?Math.sin(t*70)*1.4:0;cap=t<.9?'Turning the handle…':'The handle won’t turn. The door is stuck shut.';}
      else if(t<.9){g=p=ease(t/.9);cap='Turning the handle…';}
      else if(t<1.3){g=p=1;cap='Handle held…';}
      else{g=1-ease(seg(t,1.3,1.65));
        if(out.ok){const r=seg(t,1.3,1.5);p=1-ease(r);if(r>=1)p=-.07*Math.sin(seg(t,1.5,1.85)*Math.PI);cap='Released. The bolt snaps back out and catches the frame. Click.';}
        else{p=1;cap='Released. The bolt stays in, so the door swings free.';}}
    }
    const bx=18+40*p+sh,fl=bx+80,fr=bx+90;let s='';
    s+=`<rect x="55" y="58" width="330" height="214" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="6" y="58" width="30" height="214" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="10" y="126" width="26" height="48" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s+=`<rect x="65" y="104" width="153" height="92" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<rect x="210" y="104" width="8" height="92" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="55" y="70" width="10" height="190" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<polygon points="${f(bx)},152 ${f(bx+16)},132 ${f(fl)},132 ${f(fl)},168 ${f(bx)},168" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
    s+=`<rect x="${f(fl)}" y="116" width="10" height="68" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/>`;
    if(pl){const A=pl.slot==='A',vert=pl.rot%180!==0,x1=A?65:fr,x2=A?fl:210,cx=(x1+x2)/2;
      if(pl.part==='comp') s+=vert?zig(cx,120,cx,180,4,16):zig(x1,150,x2,150,A?4:6,A?48:38);
      else if(pl.part==='tors') s+=torsion(A?81:160,150,pl.rot);
      else if(pl.part==='washer') s+=A?`<rect x="66" y="122" width="6" height="56" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`:`<rect x="157" y="128" width="6" height="44" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
      else if(pl.part==='spacer') s+=A?`<rect x="66" y="172" width="31" height="13" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`:`<rect x="${f(fr)}" y="134" width="${f(210-fr)}" height="32" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
    }
    const th=rad(lerp(-3,29,g)),tx=100+75*Math.sin(th),ty=245-75*Math.cos(th);
    s+=`<line x1="100" y1="245" x2="${f(tx)}" y2="${f(ty)}" stroke="${C.ink}" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="245" x2="${f(tx)}" y2="${f(ty)}" stroke="${C.steel}" stroke-width="5" stroke-linecap="round"/>`;
    s+=`<circle cx="100" cy="245" r="13" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><rect x="95" y="240" width="10" height="10" fill="${C.ink}"/>`;
    s+=T(8,51,'FRAME')+T(58,51,'DOOR EDGE')+T(120,266,'HANDLE')+T(222,100,'HOUSING')+L(fl+5,112,fl+5,92)+T(fl-6,88,'FLANGE')+L(bx+40,138,bx+40,74)+T(bx+30,70,'BOLT');
    if(out&&out.ok&&t>1.45&&t<2.3) s+=T(24,120,'CLICK!',{fill:C.blue,w:600,size:10});
    return [s,cap];
  }
};

/* ============ 2. GEAR TRAIN ============ */
const GEARS={
  id:'gears',title:'Gear train',fig:'Gear train · front view',rotStep:0,dur:2.8,
  prompt:'Turning the crank should turn the output gear the same way, clockwise. There’s a gap in the train.',
  answer:{part:'idler',slot:'C',rot:0},
  slots:[{id:'C',label:'A',x:150,y:140,w:100,h:100,name:'between the gears'},{id:'U',label:'B',x:160,y:44,w:80,h:80,name:'upper mount'}],
  parts:[

  why:'The 14-tooth idler has the same tooth size as its neighbours, so it meshes cleanly with both. Each meshing pair reverses direction: clockwise → counter-clockwise → clockwise. The idler’s size doesn’t change the speed. Its only job is to flip direction back.',

      switch(out.key){

        case 'jam':a=(t>.3&&t<2.4)?Math.sin(t*60)*2:0;jam=t>.3;if(t>.7)cap='Jammed. The teeth collide and nothing turns.';break;

      if(jam){[[146,190],[254,190]].forEach(([x,y])=>{s+=`<g transform="translate(${x},${y})"><polygon points="0,-12 3,-4 11,-6 5,1 10,9 1,5 -3,12 -4,4 -12,4 -5,-2 -9,-10 -1,-5" fill="${C.acc}" stroke="${C.ink}" stroke-width="1"/></g>`;});}
    }
    s+=arcArrow(96,190,66,-150,-80,C.ink)+T(30,105,'CRANK',{fill:C.ink});
    s+=arcArrow(304,190,66,-100,-30)+T(318,105,'OUTPUT',{fill:C.blue,w:600})+T(318,115,'turns this way',{fill:C.blue});
    if(out&&out.key==='ok'&&t>1.1) s+=T(304,272,'✓ CLOCKWISE',{fill:C.blue,w:600,a:'middle',size:9});

const BRAKE={

    // arms

    s+=arm(`198,56 ${f(166+sL)},80 ${f(166+sL)},246`)+arm(`202,56 ${f(234-sR)},80 ${f(234-sR)},246`);
    s+=`<circle cx="200" cy="54" r="7" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/>`;
    // cable
    s+=`<polyline points="${f(234-sR)},80 ${f(262-sR*.3)},60 ${f(300)},${f(20-pull*6)}" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`+T(306,20,'CABLE → LEVER');
    if(pull>0) s+=`<polygon points="300,${f(10-pull*6)} 296,${f(18-pull*6)} 304,${f(18-pull*6)}" fill="${C.blue}"/>`;
    // right pad (existing)
    const rx=215-sR;s+=`<rect x="${f(rx)}" y="187" width="9" height="36" rx="1.5" fill="${C.rub}" stroke="${C.ink}" stroke-width="1.5"/><rect x="${f(rx+9)}" y="185" width="5" height="40" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    // left part
    if(pl){const y=pl.slot==='R'?205:145,x0=171+sL;
      if(pl.part==='pad'){const back=pl.rot%360!==0;
        s+=back?`<rect x="${f(x0)}" y="${y-18}" width="9" height="36" rx="1.5" fill="${C.rub}" stroke="${C.acc}" stroke-width="2"/><rect x="${f(x0+9)}" y="${y-20}" width="5" height="40" fill="${C.steel}" stroke="${C.acc}" stroke-width="2"/>`
               :`<rect x="${f(x0)}" y="${y-20}" width="5" height="40" fill="${C.steel}" stroke="${C.acc}" stroke-width="2"/><rect x="${f(x0+5)}" y="${y-18}" width="9" height="36" rx="1.5" fill="${C.rub}" stroke="${C.acc}" stroke-width="2"/>`;}

    }
    // effects
    if(out&&t>1&&(k==='steel'||k==='backwards')){for(let i=0;i<7;i++){const ph=frac(t*3+i*.37),a=rad(-150+i*45),r0=6+ph*18;s+=`<line x1="${f(188+Math.cos(a)*r0*.4)}" y1="${f(205+Math.sin(a)*r0)}" x2="${f(188+Math.cos(a)*r0*.4-6)}" y2="${f(205+Math.sin(a)*r0+4)}" stroke="#f0a020" stroke-width="2" stroke-linecap="round" opacity="${f(1-ph)}"/>`;}}

    for(let i=0;i<8;i++){const a=rad(ang+i*45);s+=L(wx,wy,wx+Math.cos(a)*39,wy+Math.sin(a)*39,C.ink,1.2);}

  evaluate(pl){

  },
  why:'The hollow ball is mostly air, so it floats. As the water rises it lifts the arm, and at the end of a long lever a gentle lift becomes a firm push on the valve. The valve shuts while the water is still below the overflow.',

    s+=`<rect x="80" y="92" width="14" height="194" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><rect x="70" y="64" width="34" height="28" rx="3" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><rect x="58" y="80" width="12" height="7" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(ph.open&&out){s+=`<rect x="60" y="87" width="5" height="${f(wL-87)}" fill="${C.water}"/>`;for(let i=0;i<4;i++){const y=87+frac(tt*2+i/4)*(wL-87);s+=L(62.5,y,62.5,y+6,'#3f7ea3',1.6);}}
    s+=T(46,58,'FILL VALVE')+T(98,280,'SUPPLY ↑',{size:7});

    if(pl){const [x,y]=pt(pl.slot==='E'?195:55),cy=y+40;

      if(pl.part==='ball') s+=`<circle cx="${f(x)}" cy="${f(cy)}" r="22" fill="${C.part}" stroke="${C.acc}" stroke-width="2.2"/><path d="M${f(x-13)} ${f(cy-8)}a15 15 0 0 1 10-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;

    {id:'roller',name:'Roller arm',desc:'A swinging arm with a free-spinning wheel at its tip.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('roller',C.ink,C.steel)}</g>`},
    {id:'rubber',name:'Rubber pad arm',desc:'A swinging arm tipped with a grippy rubber pad.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('rubber',C.ink,C.steel)}</g>`}
  ],
  shape(id,st,fill){
    if(id==='pawl') return `<polygon points="-3,-7 30,-5 41,2 30,5.5 -3,7" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
    if(id==='stop') return `<polygon points="-6,-9 28,-8 41,0 28,8 -6,9" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><circle cx="2" r="3" fill="${C.ink}"/><circle cx="16" r="3" fill="${C.ink}"/>`;
    if(id==='roller') return `<line x1="0" y1="0" x2="31" y2="0" stroke="${st}" stroke-width="5" stroke-linecap="round"/><circle cx="34" r="7" fill="${fill}" stroke="${st}" stroke-width="2"/><circle cx="34" r="2" fill="${st}"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
    return `<line x1="0" y1="0" x2="28" y2="0" stroke="${st}" stroke-width="5" stroke-linecap="round"/><rect x="27" y="-7" width="14" height="14" rx="3" fill="${C.rub}" stroke="${st}" stroke-width="2"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
  },
  evaluate(pl){
    if(pl.rot%360!==0) return {ok:false,key:'drop',msg:'Pointed that way, it never touches anything. Let go of the crank and the bucket drops.'};
    if(pl.slot==='D') return {ok:false,key:'drop',msg:'The rope drum is smooth, so there’s nothing to catch on. It slides along the drum and the bucket drops.'};
    switch(pl.part){
      case 'pawl':return {ok:true,key:'ok'};
      case 'stop':return {ok:false,key:'jam',msg:'A fixed stop can’t swing out of the way. It blocks the teeth in both directions, so you can’t even crank the bucket up.'};
      case 'roller':return {ok:false,key:'drop',msg:'A roller rolls up and over the teeth in either direction. It clicks, but it never locks, and the bucket drops.'};
      default:return {ok:false,key:'rubber',msg:'Rubber friction can’t hold the weight. It squeals, slips, and the bucket drops.'};
    }
  },
  why:'While you crank, the sloped backs of the teeth lift the pawl out of the way: click, click, click. When the load pulls back, a steep tooth face drives straight into the pawl’s tip and pushes it toward its own pivot. It can’t swing out, so the drum locks. One-way motion from one free-swinging part.',
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let phi=0,cap='';
    if(out){
      if(key==='jam'){phi=(t>.2&&t<1.8)?-2.5*Math.abs(Math.sin(t*40)):0;cap=t<.3?'Cranking…':'The crank won’t budge. The stop blocks the teeth both ways.';}
      else if(t<1.5){phi=-160*ease(seg(t,.2,1.5));cap='Cranking the bucket up…';}
      else{const tau=t-1.5;
        if(key==='ok'){phi=-160+3*ease(seg(tau,0,.12));cap='Let go. The pawl catches and the bucket stays up. ✓';}
        else if(key==='rubber'){phi=Math.min(0,-160+22*tau+(tau>.6?450*(tau-.6)**2:0));cap='Let go. It squeals, slips, and drops.';}
        else{phi=Math.min(0,-160+450*tau*tau);cap='Let go. The bucket drops.';}}
    }
    const W=[120,140],D=[250,140];let s='';
    s+=`<rect x="10" y="285" width="380" height="12" fill="url(#hatch2)"/>`+L(10,285,390,285,C.ink,2);
    s+=`<polygon points="110,150 130,150 150,285 90,285" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/><polygon points="240,150 260,150 228,285 212,285" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=L(W[0],W[1],D[0],D[1],C.ink,1,'4 3')+T(186,133,'AXLE');
    // ratchet wheel
    let d='';const n=16,stp=360/n;
    for(let k=0;k<n;k++){const a=phi+k*stp;const r1=[W[0]+Math.cos(rad(a))*48,W[1]+Math.sin(rad(a))*48],r2=[W[0]+Math.cos(rad(a+stp-1))*60,W[1]+Math.sin(rad(a+stp-1))*60];d+=(k?'L':'M')+f(r1[0])+','+f(r1[1])+'L'+f(r2[0])+','+f(r2[1]);}
    s+=`<path d="${d}Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="${W[0]}" cy="${W[1]}" r="30" fill="none" stroke="${C.ink}" stroke-dasharray="2 3" opacity=".5"/>`;
    s+=L(W[0],W[1],W[0]+Math.cos(rad(phi))*34,W[1]+Math.sin(rad(phi))*34,C.ink,3)+`<circle cx="${W[0]}" cy="${W[1]}" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=T(14,214,'RATCHET WHEEL');
    // rope + bucket
    const lift=28*rad(-phi),by=244-lift;
    s+=L(278,140,278,by,C.rope,3);
    s+=`<path d="M262 ${f(by)} Q278 ${f(by-14)} 294 ${f(by)}" fill="none" stroke="${C.ink}" stroke-width="1.8"/><polygon points="258,${f(by+2)} 298,${f(by+2)} 293,${f(by+40)} 263,${f(by+40)}" fill="#b98b5a" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>${L(260,by+12,296,by+12,C.ink,1)}${T(278,by+28,'LOAD',{a:'middle',fill:C.ink,size:7})}`;
    // drum
    s+=`<circle cx="${D[0]}" cy="${D[1]}" r="28" fill="${C.ghost}" stroke="${C.ink}" stroke-width="2"/><circle cx="${D[0]}" cy="${D[1]}" r="25" fill="none" stroke="${C.rope}" stroke-width="5"/>`;
    const ca=rad(phi-90);s+=`<line x1="${D[0]}" y1="${D[1]}" x2="${f(D[0]+Math.cos(ca)*22)}" y2="${f(D[1]+Math.sin(ca)*22)}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(D[0]+Math.cos(ca)*22)}" cy="${f(D[1]+Math.sin(ca)*22)}" r="6" fill="${C.acc}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="${D[0]}" cy="${D[1]}" r="6" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=T(306,186,'ROPE DRUM')+T(306,196,'+ CRANK');
    s+=arcArrowCCW(D[0],D[1],40,-10,-80)+T(268,90,'LIFT',{fill:C.ink});
    // pivot posts
    s+=`<line x1="172" y1="74" x2="186" y2="34" stroke="${C.ink}" stroke-width="3"/><line x1="292" y1="96" x2="306" y2="56" stroke="${C.ink}" stroke-width="3"/>`;
    s+=`<circle cx="172" cy="74" r="2" fill="${C.ink}"/><circle cx="292" cy="96" r="2" fill="${C.ink}"/>`;
    if(pl){const P=pl.slot==='T'?[172,74]:[292,96];let bump=0;
      const contact=pl.slot==='T'&&pl.rot%360===0&&pl.part!=='stop';
      if(out&&contact&&!(key==='ok'&&t>=1.5)) bump=8*frac(-phi/stp);
      s+=`<g transform="translate(${P[0]},${P[1]}) rotate(${f(159.8+pl.rot+bump)})">${this.shape(pl.part,C.acc,C.part)}</g>`;
      if(out&&key==='ok'&&t<1.5&&t>.25&&frac(-phi/stp)<.25) s+=T(150,48,'click',{fill:C.blue,w:600,size:9});
    }
    return [s,cap];
  }
};
function arcArrowCCW(cx,cy,r,a1,a2,col=C.ink){
  const p=a=>[cx+Math.cos(rad(a))*r,cy+Math.sin(rad(a))*r];const [x1,y1]=p(a1),[x2,y2]=p(a2);
  const ar=rad(a2),dx=Math.sin(ar),dy=-Math.cos(ar),nx=Math.cos(ar),ny=Math.sin(ar);
  return `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 0 0 ${f(x2)},${f(y2)}" fill="none" stroke="${col}" stroke-width="1.6"/><polygon points="${f(x2+dx*2)},${f(y2+dy*2)} ${f(x2-dx*7+nx*4)},${f(y2-dy*7+ny*4)} ${f(x2-dx*7-nx*4)},${f(y2-dy*7-ny*4)}" fill="${col}"/>`;
}

/* ============ game ============ */
const MECHS={latch:LATCH,gears:GEARS,brake:BRAKE,float:FLOAT,ratchet:RATCHET};
const IDS=Object.keys(MECHS);
const now=new Date();
const dayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const puzzleNo=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(2026,10,1))/864e5)+1;
function rngFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function dailyOrder(k){const ids=[...IDS];const r=rngFrom('missing-piece:'+k);for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return ids.slice(0,3);}
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

const $=id=>document.getElementById(id);
const stage=$('stage');
let mode='daily',order=dailyOrder(dayKey),res={},idx=0,mech=null;
let place=null,selected=null,curRot=0,anim=null,dragging=false,drag=null,revealing=false;

function saveRes(){if(mode==='daily')store.set('mp-'+dayKey,res);}
function R(){return res[mech.id]||(res[mech.id]={tries:[],stars:null,done:false});}
function locked(){return (anim&&anim.running)||R().done;}

function start(m){
  mode=m;order=m==='daily'?dailyOrder(dayKey):[...IDS];
  res=m==='daily'?(store.get('mp-'+dayKey)||{}):{};
  $('modeBtn').textContent=m==='daily'?'Practice all 5':'Back to today’s puzzle';
  $('dateLbl').textContent=m==='daily'?`${now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · No. ${puzzleNo}`:'Practice · all five mechanisms';
  idx=order.findIndex(id=>!(res[id]&&res[id].done));
  if(idx<0){showSummary();return;}
  $('game').classList.remove('hidden');$('summary').classList.add('hidden');
  loadMech(idx);
}
function loadMech(i){
  idx=i;mech=MECHS[order[i]];place=null;selected=null;curRot=0;anim=null;revealing=false;
  $('figNo').textContent=`Fig. ${i+1} of ${order.length} · ${mech.fig}`;
  $('mTitle').textContent=mech.title;$('mPrompt').textContent=mech.prompt;
  $('feedback').classList.add('hidden');
  $('inspect').innerHTML='<span class="hint">Tap a part to inspect it. Then drag it onto a marked spot, or tap the spot.</span>';
  const r=R();
  if(r.done){place={...mech.answer};anim={out:{ok:true,key:'ok'},t:mech.dur,running:false};showFeedback(r.stars>0?'win':'reveal');}
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){renderProgress();renderPips();renderTray();drawStage();renderControls();}
function starStr(n){return n==null?'':'★'.repeat(n)+'☆'.repeat(3-n);}
function renderProgress(){
  const nav=$('progress');nav.style.setProperty('--n',order.length);
  nav.innerHTML=order.map((id,i)=>{const r=res[id];return `<div class="chip ${i===idx&&!$('game').classList.contains('hidden')?'cur':''}"><span>${i+1}. ${MECHS[id].title}</span><span class="st">${r&&r.done?starStr(r.stars):''}</span></div>`;}).join('');
}
function renderPips(){const r=R();let h='';for(let i=0;i<3;i++){const tr=r.tries[i];h+=`<span class="pip ${tr?(tr.ok?'win':'used'):''}"></span>`;}$('pips').innerHTML=h;}
function renderTray(){
  const lk=locked();
  $('tray').innerHTML=mech.parts.map(p=>{
    const rot=(selected===p.id?curRot:0);
    return `<div class="part ${selected===p.id?'sel':''} ${lk?'off':''}" data-id="${p.id}">${place&&place.part===p.id?`<span class="badge">${mech.slots.find(s=>s.id===place.slot).label}</span>`:''}<svg viewBox="0 0 80 56" style="transform:rotate(${rot}deg)">${p.icon()}</svg><div class="nm">${p.name}</div></div>`;
  }).join('');
}
function renderControls(){const lk=locked();$('rotBtn').disabled=lk||!(place||selected);$('clrBtn').disabled=lk||!place;$('testBtn').disabled=lk||!place;$('bench').style.display=R().done?'none':'';}
function slotOverlay(){
  const hi=dragging||(selected&&!place)||(selected&&place&&place.part!==selected);
  return mech.slots.map(s=>{const filled=place&&place.slot===s.id;const col=hi?C.acc:'#8a8174';
    return (filled?'':`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="4" fill="${hi?'rgba(212,87,42,.10)':'rgba(255,255,255,.25)'}" stroke="${col}" stroke-width="${hi?1.8:1.2}" stroke-dasharray="4 3"/>`)+
    `<circle cx="${s.x}" cy="${s.y}" r="7.5" fill="${filled?C.acc:C.card}" stroke="${filled?C.acc:col}" stroke-width="1.5"/><text x="${s.x}" y="${s.y+3}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" font-weight="600" fill="${filled?'#fff':col}">${s.label}</text>`;}).join('');
}
function drawStage(){
  const st={pl:place,out:anim?anim.out:null,t:anim?anim.t:0};
  const [inner,cap]=mech.render(st);
  stage.innerHTML=DEFS+inner+(anim||R().done?'':slotOverlay());
  let c=cap;
  if(!anim){
    if(place){const p=mech.parts.find(x=>x.id===place.part),s=mech.slots.find(x=>x.id===place.slot);c=`${p.name} → spot ${s.label} (${s.name})${mech.rotStep&&place.rot?`, rotated ${place.rot}°`:''}. Press “Test it”.`;}
    else c='Choose a part from the bin and place it on a marked spot.';
  }
  $('caption').textContent=c||'';
}
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200);}

function resetAnim(){if(anim&&!anim.running&&!R().done){anim=null;$('feedback').classList.add('hidden');}}
function selectPart(id){
  if(locked())return;resetAnim();
  if(selected!==id){selected=id;curRot=(place&&place.part===id)?place.rot:0;}
  const p=mech.parts.find(x=>x.id===id);
  $('inspect').innerHTML=`<b>${p.name.toUpperCase()}</b><br>${p.desc}${mech.rotStep?'':' <span class="hint">(Rotation doesn’t matter here.)</span>'}`;
  renderAll();
}
function placePart(id,slot){
  if(locked())return;resetAnim();
  if(selected!==id){selected=id;curRot=(place&&place.part===id)?place.rot:0;}
  place={part:id,slot,rot:curRot};
  const p=mech.parts.find(x=>x.id===id);
  $('inspect').innerHTML=`<b>${p.name.toUpperCase()}</b><br>${p.desc}`;
  renderAll();
}
function svgPt(e){const pt=stage.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(stage.getScreenCTM().inverse());}
function slotAt(p){let best=null,bd=1e9;for(const s of mech.slots){const pad=14;if(p.x>=s.x-pad&&p.x<=s.x+s.w+pad&&p.y>=s.y-pad&&p.y<=s.y+s.h+pad){const d=Math.hypot(p.x-(s.x+s.w/2),p.y-(s.y+s.h/2));if(d<bd){bd=d;best=s;}}}return best;}

$('tray').addEventListener('pointerdown',e=>{const card=e.target.closest('.part');if(!card||locked())return;e.preventDefault();drag={id:card.dataset.id,x:e.clientX,y:e.clientY,moved:false,ghost:null};});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;dragging=true;resetAnim();
    if(selected!==drag.id){selected=drag.id;curRot=(place&&place.part===drag.id)?place.rot:0;}
    const p=mech.parts.find(x=>x.id===drag.id);const g=document.createElement('div');g.className='ghost-drag';
    g.innerHTML=`<svg viewBox="0 0 80 56" style="transform:rotate(${curRot}deg)">${p.icon()}</svg>`;document.body.appendChild(g);drag.ghost=g;renderTray();drawStage();
  }
  if(drag.moved){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';}
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.moved){d.ghost.remove();dragging=false;const r=stage.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const s=slotAt(svgPt(e));if(s){placePart(d.id,s.id);return;}else toast('Drop it on one of the marked spots.');}
    renderAll();}
  else selectPart(d.id);
});
window.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;dragging=false;});
stage.addEventListener('click',e=>{
  if(locked())return;const s=slotAt(svgPt(e));if(!s)return;
  if(selected) placePart(selected,s.id);
  else if(place) placePart(place.part,s.id);
  else toast('Pick a part from the bin first.');
});
$('rotBtn').onclick=()=>{
  if(locked())return;
  if(!mech.rotStep){toast('Round parts look the same at any angle. No need to rotate.');return;}
  resetAnim();
  if(place&&(!selected||selected===place.part)){place.rot=(place.rot+mech.rotStep)%360;curRot=place.rot;selected=place.part;}
  else if(selected) curRot=(curRot+mech.rotStep)%360;
  renderAll();
};
$('clrBtn').onclick=()=>{if(locked())return;resetAnim();place=null;renderAll();};
$('testBtn').onclick=()=>{
  if(!place||locked())return;
  const out=mech.evaluate(place);const r=R();
  const sig=place.part+'|'+place.slot+'|'+out.key;
  const repeat=!out.ok&&r.tries.some(x=>x.sig===sig);
  if(repeat) toast('You already tried that one, so this test is free.');
  else r.tries.push({sig,ok:out.ok});
  $('feedback').classList.add('hidden');
  runAnim(out,()=>{
    if(!repeat){
      if(out.ok){r.stars=4-r.tries.length;r.done=true;}
      else if(r.tries.length>=3){r.stars=0;r.done=true;}
      saveRes();
    }
    showFeedback(out.ok?'win':(r.done?'out':'fail'),out);
    renderAll();
  });
  renderAll();
};
function runAnim(out,cb){
  anim={out,t:0,running:true};const t0=performance.now();renderControls();renderTray();
  const fr=nowT=>{anim.t=Math.min(mech.dur,(nowT-t0)/1000);drawStage();
    if(anim.t<mech.dur) requestAnimationFrame(fr); else{anim.running=false;cb&&cb();}};
  requestAnimationFrame(fr);
}
function showFeedback(kind,out){
  const fb=$('feedback'),r=R(),last=idx>=order.length-1;
  const nextBtn=`<button class="btn dark" id="nextBtn">${last?'See results →':'Next mechanism →'}</button>`;
  let h='';
  if(kind==='win'){fb.className='feedback win';h=`<b class="h">It works! ${starStr(r.stars)}</b>${mech.why}<div class="row">${nextBtn}</div>`;}
  else if(kind==='fail'){fb.className='feedback fail';const left=3-r.tries.length;h=`<b class="h">Didn’t work.</b>${out.msg}<div class="row"><span class="mono" style="font-size:12px;color:var(--muted)">${left} attempt${left===1?'':'s'} left. Adjust and test again.</span></div>`;}
  else if(kind==='out'){fb.className='feedback fail';h=`<b class="h">Out of attempts.</b>${out.msg}<div class="row"><button class="btn" id="revealBtn">Watch the working setup</button>${nextBtn}</div>`;}
  else{fb.className='feedback win';h=`<b class="h">The working setup ${r.stars?starStr(r.stars):''}</b>${mech.why}<div class="row">${nextBtn}</div>`;}
  fb.innerHTML=h;fb.classList.remove('hidden');
  const nb=$('nextBtn');if(nb)nb.onclick=()=>{if(idx>=order.length-1)showSummary();else loadMech(idx+1);};
  const rb=$('revealBtn');if(rb)rb.onclick=()=>{place={...mech.answer};fb.classList.add('hidden');runAnim({ok:true,key:'ok'},()=>showFeedback('reveal'));renderAll();};
}
function showSummary(){
  $('game').classList.add('hidden');renderProgress();
  const tot=order.reduce((a,id)=>a+((res[id]&&res[id].stars)||0),0),max=order.length*3;
  const grid=order.map(id=>{const n=(res[id]&&res[id].stars)||0;return '⭐'.repeat(n)+'▫️'.repeat(3-n);}).join('\n');
  const share=`Missing Piece${mode==='daily'?' No. '+puzzleNo:' (practice)'}\n${grid}\n${tot}/${max}`;
  const S=$('summary');S.classList.remove('hidden');
  S.innerHTML=`<div class="sum"><div class="plate-head">${mode==='daily'?'Today’s bench · complete':'Practice · complete'}</div><h2>${tot} / ${max} stars</h2>
  <table>${order.map((id,i)=>`<tr><td>${i+1}. ${MECHS[id].title}</td><td>${starStr((res[id]&&res[id].stars)||0)}</td></tr>`).join('')}</table>
  <pre class="share" id="shareTxt">${share}</pre>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" style="margin-left:0" id="copyBtn">Copy result</button><button class="btn" id="reviewBtn">Review mechanisms</button><button class="btn" id="otherBtn">${mode==='daily'?'Practice all 5':'Back to today’s puzzle'}</button></div>
  ${mode==='daily'?'<div class="cd" id="cd"></div>':''}</div>`;
  $('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(share);$('copyBtn').textContent='Copied ✓';}catch(e){const rg=document.createRange();rg.selectNodeContents($('shareTxt'));const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);$('copyBtn').textContent='Selected. Press Ctrl/⌘+C';}};
  $('reviewBtn').onclick=()=>{$('summary').classList.add('hidden');$('game').classList.remove('hidden');loadMech(0);};
  $('otherBtn').onclick=()=>start(mode==='daily'?'practice':'daily');
  if(mode==='daily'){const tick=()=>{const e=$('cd');if(!e)return;const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),d=Math.max(0,m-n);const h=Math.floor(d/36e5),mi=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);e.textContent=`Next bench in ${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`;setTimeout(tick,1000);};tick();}
}
$('modeBtn').onclick=()=>start(mode==='daily'?'practice':'daily');
start('daily');
</script>
