<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missing Piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2621;--paper:#f3ede1;--card:#fbf8f1;--acc:#d4572a;--blue:#2f5d8a;--muted:#7d7466;--line:#d9d0bf;
 /* layout: one centred workbench column; figure plate on top, parts bin below */
 --display:Fraunces,Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
 --ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);background-image:linear-gradient(rgba(47,93,138,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(47,93,138,.05) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
h1{text-wrap:balance;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.tag{font-size:13px;color:var(--muted);margin-top:5px;font-style:italic;text-wrap:balance}
.meta{font-variant-numeric:tabular-nums;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.meta>*{white-space:nowrap}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
nav{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);border-radius:4px;padding:6px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);min-width:0;position:relative;transition:border-color .2s,color .2s,background-color .2s}
.chip .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.cur{border-color:var(--ink);color:var(--ink);box-shadow:2px 2px 0 rgba(43,38,33,.12)}
.chip.cur::after{content:"";position:absolute;left:8px;right:8px;bottom:-1.5px;height:2px;background:var(--acc);border-radius:2px}
.chip.done{background:#f6f1e6}
.chip .st{color:var(--acc);letter-spacing:1px;white-space:nowrap;flex:none}
.chip .st.num{color:inherit}
.plate{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 14px 10px;box-shadow:4px 4px 0 rgba(43,38,33,.12);position:relative}
.plate-head{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.pip.used{background:var(--acc);border-color:var(--acc)}
.pip.win{background:var(--blue);border-color:var(--blue)}
.pip.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.005em}
#mPrompt{margin:0 0 12px;font-size:15px;line-height:1.5;max-width:62ch;text-wrap:pretty}
.stage-wrap{position:relative;border:1.5px solid var(--line);border-radius:4px;background:#f8f4ea;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.stage-wrap.win{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,93,138,.14)}
.stage-wrap.fail{border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,87,42,.12)}
.stage-wrap.placed{animation:placed .45s var(--ease)}
@keyframes placed{0%{box-shadow:0 0 0 0 rgba(212,87,42,.35)}100%{box-shadow:0 0 0 10px rgba(212,87,42,0)}}
#stage{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.caption{font-size:12px;color:var(--ink);min-height:34px;padding:8px 2px 0;line-height:1.45}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--card);font:12px "IBM Plex Mono",monospace;padding:6px 10px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.feedback{margin-top:12px;border-radius:6px;padding:12px 14px;border:2px solid var(--ink);background:var(--card);font-size:14.5px;line-height:1.55;box-shadow:4px 4px 0 rgba(43,38,33,.10);animation:fbIn .35s var(--ease)}
.feedback.fail{animation:fbIn .35s var(--ease),nudge .4s .1s}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{translate:0}25%{translate:-4px}50%{translate:3px}75%{translate:-2px}}
.feedback.fail{border-color:var(--acc)}
.feedback.win{border-color:var(--blue)}
.feedback b.h{display:block;font-family:Fraunces,Georgia,serif;font-size:18px;margin-bottom:2px}
.feedback.fail b.h{color:var(--acc)}
.feedback.win b.h{color:var(--blue)}
.feedback .row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.replay{margin-top:10px;padding:8px 10px;border:1.5px dashed var(--acc);border-radius:6px;font-size:13.5px;line-height:1.45;text-align:left}
.replay .btn{margin:6px 0 0;display:inline-block}
.hidden{display:none!important}
.bench{margin-top:14px}
.bench-head{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.part{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:6px 4px 7px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s;position:relative;min-height:44px;overflow:hidden}
@media (hover:hover){.part:hover{border-color:var(--ink)}}
.part:active{cursor:grabbing}
.part.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(212,87,42,.25),2px 3px 0 rgba(43,38,33,.10);transform:translateY(-2px)}
.part.lifted{opacity:.4}
.part:focus-visible,.btn:focus-visible,.link:focus-visible,.spot:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.part.off{opacity:.45;pointer-events:none}
.part svg{width:100%;height:auto;display:block;transition:transform .2s}
.part .nm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.25;margin-top:2px}
.part .badge{position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;font:600 9px "IBM Plex Mono",monospace;padding:1px 4px;border-radius:3px;z-index:1}
.inspect{min-height:44px;margin:10px 0 2px;font-size:14px;line-height:1.45;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.inspect b{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.03em}
.inspect .hint{color:var(--muted)}
.sum .hint{color:var(--muted);font-size:12px}
.spots{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.spots .lbl{font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.spot{font:600 12px var(--mono);border:1.5px dashed var(--acc);background:rgba(212,87,42,.06);color:var(--ink);border-radius:5px;padding:6px 10px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,border-color .15s}
.spot:hover{background:rgba(212,87,42,.14)}
.spot .sl{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);font-size:10px}
.spot[aria-pressed="true"]{border-style:solid;background:var(--acc);color:#fff}
.spot[aria-pressed="true"] .sl{background:#fff;border-color:#fff}
.controls{display:flex;gap:8px;margin-top:10px}
.btn{font:600 14px "IBM Plex Sans",sans-serif;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:10px 14px;cursor:pointer;min-height:44px;transition:background-color .15s,transform .1s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:not(:disabled):active{transform:translateY(1px)}
@media (hover:hover){.btn:hover{background:#efe8da}}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary:not(:disabled){box-shadow:2px 2px 0 rgba(43,38,33,.18)}
.btn.ghost{border-color:var(--line)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;margin-left:auto;min-width:120px}
@media (hover:hover){.btn.primary:hover{background:#bf4a20}}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.dark:hover{background:#3d362f}
.ghost-drag{position:fixed;z-index:50;width:88px;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);background:var(--card);border:1.5px solid var(--acc);border-radius:6px;padding:4px;opacity:.95;box-shadow:3px 5px 0 rgba(43,38,33,.15)}
.ghost-drag.touch{transform:translate(-50%,-125%) rotate(-3deg)}
.ghost-drag svg{display:block;width:100%;height:auto}
#summary{margin-top:16px}
.sum{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:4px 4px 0 rgba(43,38,33,.12);animation:fbIn .4s var(--ease)}
.sum .acts{display:flex;gap:8px;flex-wrap:wrap}
.sum h2{margin-top:0}
.sum table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.sum td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.sum td:last-child{text-align:right;color:var(--acc);letter-spacing:2px;white-space:nowrap}
.sum h2{font-variant-numeric:tabular-nums}
.share{background:#f3ede1;border:1.5px dashed var(--line);border-radius:4px;padding:10px;font:13px/1.5 "IBM Plex Mono",monospace;white-space:pre-wrap;margin:0 0 10px}
.streak{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--acc);margin:-6px 0 6px;letter-spacing:.02em}
.cd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
nav.lots{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
nav.lots .chip{justify-content:center;padding:4px 2px;font-size:10px;min-height:26px}
nav.lots .chip .ct{display:none}
nav.lots .chip .st{letter-spacing:0}
@media (max-width:520px){
 h1{font-size:25px}.tag{font-size:12px}
 .tray{grid-template-columns:repeat(4,1fr);gap:6px}
 .part .nm{font-size:9.5px}
 .btn{padding:9px 10px;font-size:13px}
 .btn.primary{min-width:96px}
 h2{font-size:21px}
 header{flex-wrap:wrap;align-items:center}
 .brand{flex:1 1 260px;min-width:0}
 .meta{flex:1 1 100%;flex-direction:row;justify-content:space-between;align-items:baseline;text-align:left}
 .chip{flex-direction:column;align-items:flex-start;gap:2px;padding:5px 7px;font-size:10.5px}
 .chip .ct{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
 nav.many .chip .ct{display:none}
 nav.many .chip{align-items:center}
 .sum .acts{display:grid;grid-template-columns:1fr 1fr}
 .sum .acts #copyBtn{grid-column:1/-1}
 .bench-head{line-height:1.5}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
/* ============ drawing helpers ============ */
const C={ink:'#2b2621',paper:'#f6f1e6',card:'#fbf8f1',acc:'#d4572a',blue:'#2f5d8a',steel:'#cdc7ba',steelD:'#9d968a',rub:'#3b3834',water:'#9fcbe2',ghost:'#ebe4d5',part:'#f3cdb6',rope:'#a07d4a',muted:'#8a8174'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const f=n=>(+n).toFixed(1);
const rad=d=>d*Math.PI/180;
const frac=x=>x-Math.floor(x);
function T(x,y,s,o={}){return `<text x="${f(x)}" y="${f(y)}" font-family="IBM Plex Mono, monospace" font-size="${o.size||8}" fill="${o.fill||C.muted}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" letter-spacing=".05em"${o.halo===false?'':` stroke="#f8f4ea" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke"`}>${s}</text>`;}
function L(x1,y1,x2,y2,col=C.muted,w=0.8,dash=''){return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;}
function zig(x1,y1,x2,y2,n,w,col=C.acc,sw=2.6){
  const dx=x2-x1,dy=y2-y1,Ln=Math.hypot(dx,dy)||1,ux=dx/Ln,uy=dy/Ln,nx=-uy,ny=ux;
  const lead=Math.min(5,Ln*.1);const pts=[[x1,y1],[x1+ux*lead,y1+uy*lead]];
  const sg=(Ln-2*lead)/(n*2);
  for(let i=0;i<n*2;i++){const s=lead+sg*(i+.5),sd=(i%2?-1:1)*w/2;pts.push([x1+ux*s+nx*sd,y1+uy*s+ny*sd]);}
  pts.push([x2-ux*lead,y2-uy*lead],[x2,y2]);
  return `<polyline points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function gearPath(cx,cy,r,n,depth,ang){
  const st=2*Math.PI/n,a0=rad(ang),ri=r-depth/2,ro=r+depth/2;let d='';
  for(let k=0;k<n;k++){const a=a0+k*st;
    const P=[[a-st*.5,ri],[a-st*.22,ri],[a-st*.13,ro],[a+st*.13,ro],[a+st*.22,ri]];
    P.forEach((p,i)=>{d+=(k===0&&i===0?'M':'L')+f(cx+Math.cos(p[0])*p[1])+','+f(cy+Math.sin(p[0])*p[1]);});}
  return d+'Z';
}
function gear(cx,cy,r,n,depth,ang,fill,stroke=C.ink,sw=2){
  const a=rad(ang);
  return `<path d="${gearPath(cx,cy,r,n,depth,ang)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`+
  `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r*.62)}" fill="none" stroke="${C.ink}" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>`+
  `<line x1="${f(cx)}" y1="${f(cy)}" x2="${f(cx+Math.cos(a)*r*.62)}" y2="${f(cy+Math.sin(a)*r*.62)}" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`+
  `<circle cx="${f(cx)}" cy="${f(cy)}" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
}
function arcArrow(cx,cy,r,a1,a2,col=C.blue){
  const p=a=>[cx+Math.cos(rad(a))*r,cy+Math.sin(rad(a))*r];const [x1,y1]=p(a1),[x2,y2]=p(a2);
  const ar=rad(a2),dx=-Math.sin(ar),dy=Math.cos(ar),nx=Math.cos(ar),ny=Math.sin(ar);
  const large=(a2-a1)>180?1:0;
  return `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 ${large} 1 ${f(x2)},${f(y2)}" fill="none" stroke="${col}" stroke-width="1.6"/>`+
  `<polygon points="${f(x2+dx*2)},${f(y2+dy*2)} ${f(x2-dx*7+nx*4)},${f(y2-dy*7+ny*4)} ${f(x2-dx*7-nx*4)},${f(y2-dy*7-ny*4)}" fill="${col}"/>`;
}
function torsion(cx,cy,rot,col=C.acc){
  return `<g transform="translate(${f(cx)},${f(cy)}) rotate(${rot})"><circle r="9" fill="none" stroke="${col}" stroke-width="2.6"/><circle r="5" fill="none" stroke="${col}" stroke-width="2"/><polyline points="-8,-4 -26,-20 -30,-17" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/><polyline points="8,4 26,20 30,17" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/></g>`;
}
const DEFS=`<defs>
<pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#2f5d8a" stroke-opacity=".07" stroke-width=".6"/></pattern>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#efe7d6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#2b2621" stroke-opacity=".12" stroke-width="1.4"/></pattern>
<pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#e6dfcf"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2b2621" stroke-opacity=".25" stroke-width="1"/></pattern>
</defs><rect width="400" height="300" fill="url(#grid)"/>`;

/* ============ 1. DOOR LATCH ============ */
const LATCH={
  id:'latch',title:'Door latch',fig:'Door latch · cutaway',rotStep:90,dur:2.8,
  prompt:'Turn the handle and the bolt slides into the door. Let go, and it should spring back out to catch the frame. One part is missing.',
  answer:{part:'comp',slot:'B',rot:0},
  slots:[{id:'A',label:'A',x:66,y:108,w:31,h:84,name:'in front of the flange'},{id:'B',label:'B',x:110,y:108,w:98,h:84,name:'behind the flange'}],
  parts:[
    {id:'comp',name:'Compression spring',desc:'Squeeze its ends together and it pushes back.',icon:()=>zig(8,28,72,28,6,24,C.ink,2.4)},

      if(pl.slot==='B') return {ok:true,key:'ok'};
      return {ok:false,key:'wrongside',msg:'In front of the flange, the spring pushes the bolt <i>into</i> the door. It holds the latch in, so the door never catches.'};
    }
    if(pl.part==='tors') return {ok:false,key:'noreturn',msg:'A torsion spring stores energy by twisting around a pin. Nothing here twists, so it just rattles around and the latch stays in.'};
    if(pl.part==='washer') return {ok:false,key:'noreturn',msg:'A washer only takes up space. It stores no energy, so nothing pushes the latch back out.'};
    if(pl.slot==='B') return {ok:false,key:'jam',msg:'A solid spacer behind the flange leaves the bolt nowhere to go. The handle won’t turn and the door is stuck shut.'};

  },
  why:'The compression spring sits between the bolt’s back flange and the housing wall. Turning the handle drags the flange back and squeezes the spring. Let go, and the spring pushes the bolt out into the strike plate. That’s the click you hear when a door shuts.',

    const {pl,out,t}=st;let g=0,p=0,sh=0,cap='';

      else if(t<.9){g=p=ease(t/.9);cap='Turning the handle…';}

        if(out.ok){const r=seg(t,1.3,1.5);p=1-ease(r);if(r>=1)p=-.07*Math.sin(seg(t,1.5,1.85)*Math.PI);cap='Released. The bolt snaps back out and catches the frame. Click.';}
        else{p=1;cap='Released. The bolt stays in, so the door swings free.';}}
    }
    const bx=18+40*p+sh,fl=bx+80,fr=bx+90;let s='';
    s+=`<rect x="55" y="58" width="330" height="214" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="6" y="58" width="30" height="214" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="10" y="126" width="26" height="48" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s+=`<rect x="65" y="104" width="153" height="92" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<rect x="210" y="104" width="8" height="92" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="55" y="70" width="10" height="190" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<polygon points="${f(bx)},152 ${f(bx+16)},132 ${f(fl)},132 ${f(fl)},168 ${f(bx)},168" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
    s+=`<rect x="${f(fl)}" y="116" width="10" height="68" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/>`;
    if(pl){const A=pl.slot==='A',vert=pl.rot%180!==0,x1=A?65:fr,x2=A?fl:210,cx=(x1+x2)/2;
      if(pl.part==='comp') s+=vert?zig(cx,120,cx,180,4,16):zig(x1,150,x2,150,A?4:6,A?48:38);
      else if(pl.part==='tors') s+=torsion(A?81:160,150,pl.rot);
      else if(pl.part==='washer') s+=A?`<rect x="66" y="122" width="6" height="56" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`:`<rect x="157" y="128" width="6" height="44" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
      else if(pl.part==='spacer') s+=A?`<rect x="66" y="172" width="31" height="13" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`:`<rect x="${f(fr)}" y="134" width="${f(210-fr)}" height="32" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
    }
    const th=rad(lerp(-3,29,g)),tx=100+75*Math.sin(th),ty=245-75*Math.cos(th);
    s+=`<line x1="100" y1="245" x2="${f(tx)}" y2="${f(ty)}" stroke="${C.ink}" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="245" x2="${f(tx)}" y2="${f(ty)}" stroke="${C.steel}" stroke-width="5" stroke-linecap="round"/>`;

    s+=T(8,51,'FRAME')+T(58,51,'DOOR EDGE')+T(120,266,'HANDLE')+T(222,100,'HOUSING')+L(fl+5,112,fl+5,92)+T(fl-6,88,'FLANGE')+L(bx+40,138,bx+40,74)+T(bx+30,70,'BOLT');
    if(out&&out.ok&&t>1.45&&t<2.3) s+=T(24,120,'CLICK!',{fill:C.blue,w:600,size:10});

/* ============ 2. GEAR TRAIN ============ */
const GEARS={
  id:'gears',title:'Gear train',fig:'Gear train · front view',rotStep:0,dur:2.8,
  prompt:'Turning the crank should turn the output gear the same way, clockwise. There’s a gap in the train.',
  answer:{part:'idler',slot:'C',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'C' is shown to players as B */
  slots:[{id:'U',label:'A',x:160,y:44,w:80,h:80,name:'upper mount'},{id:'C',label:'B',x:150,y:140,w:100,h:100,name:'between the gears'}],
  parts:[
    {id:'idler',name:'Gear, 14 teeth',desc:'Same tooth size as the crank and output gears.',icon:()=>gear(40,28,19,14,6,0,C.steel)},

    if(pl.slot==='U') return {ok:false,key:'notouch',msg:'On the upper mount the part doesn’t reach either gear. The crank spins and the output never moves.'};
    switch(pl.part){
      case 'idler':return {ok:true,key:'ok'};
      case 'large':return {ok:false,key:'jam',msg:'The 18-tooth gear is too big for the gap. Its teeth crash into both neighbours and the whole train locks up.'};
      case 'fine':return {ok:false,key:'skip',msg:'Those teeth are half the size of the others. Gears only mesh when their teeth match (the same <i>pitch</i>), so these skip and grind instead of driving.'};

    }

  why:'The 14-tooth idler has the same tooth size as its neighbours, so it meshes cleanly with both. Each meshing pair reverses direction: clockwise → counter-clockwise → clockwise. The idler’s size doesn’t change the speed. Its only job is to flip direction back.',

      switch(out.key){
        case 'ok':a=run;ai=-run*12/14;ao=run;if(t>1.1)cap='The output turns clockwise, same as the crank. ✓';break;
        case 'jam':a=(t>.3&&t<2.4)?Math.sin(t*60)*2:0;jam=t>.3;if(t>.7)cap='Jammed. The teeth collide and nothing turns.';break;
        case 'notouch':a=run;if(t>1)cap='The crank spins, but the output never moves.';break;
        case 'skip':a=run;ai=t>.3?Math.sin(t*38)*5:0;if(t>1)cap='The teeth skip and grind. Nothing gets driven.';break;
        case 'slip':a=run;ai=-run*.1;if(t>1)cap='The wheel slips. The output stays still.';break;

    s+=`<circle cx="200" cy="190" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="200" cy="84" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=gear(96,190,48,12,12,a,C.steel);
    s+=gear(304,190,48,12,12,180+ao,'#c9d7e4');
    const ca=rad(a-90);s+=`<line x1="96" y1="190" x2="${f(96+Math.cos(ca)*30)}" y2="${f(190+Math.sin(ca)*30)}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(96+Math.cos(ca)*30)}" cy="${f(190+Math.sin(ca)*30)}" r="6" fill="${C.acc}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(pl){const cx=200,cy=pl.slot==='C'?190:84;
      if(pl.part==='idler') s+=gear(cx,cy,56,14,12,192.857+ai,C.part,C.acc,2.2);
      else if(pl.part==='large') s+=gear(cx,cy,72,18,12,ai,C.part,C.acc,2.2);
      else if(pl.part==='fine') s+=gear(cx,cy,56,28,6,ai,C.part,C.acc,2.2);
      else{const r=rad(ai);s+=`<circle cx="${cx}" cy="${cy}" r="55" fill="${C.rub}" stroke="${C.acc}" stroke-width="2.2"/><circle cx="${cx}" cy="${cy}" r="46" fill="${C.part}" stroke="${C.ink}" stroke-width="1.5"/><line x1="${cx}" y1="${cy}" x2="${f(cx+Math.cos(r)*40)}" y2="${f(cy+Math.sin(r)*40)}" stroke="${C.ink}" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;}
      if(jam){[[146,190],[254,190]].forEach(([x,y])=>{s+=`<g transform="translate(${x},${y})"><polygon points="0,-12 3,-4 11,-6 5,1 10,9 1,5 -3,12 -4,4 -12,4 -5,-2 -9,-10 -1,-5" fill="${C.acc}" stroke="${C.ink}" stroke-width="1"/></g>`;});}
    }
    s+=arcArrow(96,190,66,-150,-80,C.ink)+T(30,105,'CRANK',{fill:C.ink});
    s+=arcArrow(304,190,66,-100,-30)+T(318,105,'OUTPUT',{fill:C.blue,w:600})+T(318,115,'turns this way',{fill:C.blue});
    if(out&&out.key==='ok'&&t>1.1) s+=T(304,272,'✓ CLOCKWISE',{fill:C.blue,w:600,a:'middle',size:9});
    return [s,cap];
  }
};

    {id:'nylon',name:'Nylon bushing',desc:'A tough, slippery plastic block, the kind used where parts need to slide past each other.',icon:()=>`<rect x="24" y="12" width="32" height="32" rx="6" fill="#f6f3ec" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="6" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`},

      case 'pad':return pl.rot%360===0?{ok:true,key:'ok'}:{ok:false,key:'backwards',msg:'The pad is on backwards. Its steel holder scrapes the rim while the rubber faces the arm. Lots of noise, very little stopping.'};
      case 'steel':return {ok:false,key:'steel',msg:'Steel on an aluminium rim has very little grip. It skates and squeals, and it gouges the braking surface.'};
      case 'nylon':return {ok:false,key:'nylon',msg:'Nylon is slippery by design. It’s used for bushings precisely because it slides. It barely slows the wheel.'};

  why:'Pulling the cable swings both arms inward. With a pad on each side the rim is clamped evenly, and soft rubber against the rim’s flat braking surface gives a lot of friction without wearing the metal.',

    // right pad (existing)

    // left part
    if(pl){const y=pl.slot==='R'?205:145,x0=171+sL;
      if(pl.part==='pad'){const back=pl.rot%360!==0;
        s+=back?`<rect x="${f(x0)}" y="${y-18}" width="9" height="36" rx="1.5" fill="${C.rub}" stroke="${C.acc}" stroke-width="2"/><rect x="${f(x0+9)}" y="${y-20}" width="5" height="40" fill="${C.steel}" stroke="${C.acc}" stroke-width="2"/>`

    if(pl.part==='steel') return {ok:false,key:'sink',msg:'A steel ball is far denser than water. It sinks, the arm hangs down, and the valve stays wide open.'};
    if(pl.part==='sponge') return {ok:false,key:'sink',msg:'The sponge soaks up water and sinks. A float only works if it stays lighter than the water it pushes aside.'};
    return {ok:false,key:'sink',msg:'Water pours straight through the funnel, so it traps no air. No trapped air, no lift.'};
  },
  why:'The hollow ball is mostly air, so it floats. As the water rises it lifts the arm, and at the end of a long lever a gentle lift becomes a firm push on the valve. The valve shuts while the water is still below the overflow.',
  phys(key,slot,t){
    const d=slot==='E'?195:55,sMax=.72;let wL=255-45*Math.max(0,t-.3),sin;
    if(key==='ok'){if(wL<=120)wL=120;sin=clamp((wL-120)/d,0,sMax);}
    else if(key==='leverage'){wL=Math.max(wL,100);sin=clamp((wL-120)/d,.12,sMax);}

    return {wL,sin,open:sin>.004,over:wL<=100.5};
  },
  render(st){
    const {pl,out,t}=st;const key=pl?this.evaluate(pl).key:null;const tt=out?t:0;
    const ph=this.phys(key,pl?pl.slot:'E',tt);const {wL,sin}=ph;const cos=Math.sqrt(1-sin*sin);let cap='';
    if(out){cap=t<.4?'Flushed. The tank is refilling…':key==='ok'&&wL<=120.5?'The float lifts the arm and shuts the valve. The water stops below the overflow. ✓':ph.over?'Overflowing. The valve never shuts, so the water runs forever.':'Refilling…';}
    let s='';
    // water
    s+=`<rect x="41" y="${f(wL)}" width="318" height="${f(285-wL)}" fill="${C.water}" opacity=".75"/>`;
    s+=`<path d="M41 ${f(wL)} ${Array.from({length:17},(_,i)=>`Q${f(41+i*20+5)} ${f(wL-2*Math.sin(tt*6+i))} ${f(41+i*20+10)} ${f(wL)} T${f(41+i*20+20)} ${f(wL)}`).join(' ')}" fill="none" stroke="#5f9cbf" stroke-width="1.2"/>`;
    // tank walls
    s+=`<path d="M40 40V286H360V40" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/>`+L(36,40,364,40,C.ink,1.2,'5 4')+T(306,34,'LID (REMOVED)');
    // overflow pipe
    s+=`<rect x="330" y="100" width="14" height="186" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    if(ph.over&&out){s+=`<rect x="332" y="100" width="10" height="186" fill="${C.water}"/>`;for(let i=0;i<6;i++){const y=100+frac(tt*1.5+i/6)*180;s+=L(337,y,337,y+10,'#3f7ea3',2);}}
    s+=T(326,166,'OVERFLOW',{a:'end'})+T(326,175,'PIPE',{a:'end'})+L(327,170,331,170);
    // fill valve
    s+=`<rect x="80" y="92" width="14" height="194" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><rect x="70" y="64" width="34" height="28" rx="3" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><rect x="58" y="80" width="12" height="7" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(ph.open&&out){s+=`<rect x="60" y="87" width="5" height="${f(wL-87)}" fill="${C.water}"/>`;for(let i=0;i<4;i++){const y=87+frac(tt*2+i/4)*(wL-87);s+=L(62.5,y,62.5,y+6,'#3f7ea3',1.6);}}
    s+=T(46,58,'FILL VALVE')+T(98,280,'SUPPLY ↑',{size:7});
    // arm
    const px=106,py=80,ex=px+200*cos,ey=py+200*sin,pt=d=>[px+d*cos,py+d*sin];
    s+=`<line x1="${px}" y1="${py}" x2="${f(ex)}" y2="${f(ey)}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><line x1="${px}" y1="${py}" x2="${f(ex)}" y2="${f(ey)}" stroke="${C.steelD}" stroke-width="2" stroke-linecap="round"/>`;
    s+=`<circle cx="${px}" cy="${py}" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    [55,195].forEach(d=>{const [x,y]=pt(d);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="3.5" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`;});
    s+=T(px+4,py-10,'PIVOT')+T(150,74,'FLOAT ARM');
    if(pl){const [x,y]=pt(pl.slot==='E'?195:55),cy=y+40;
      s+=L(x,y,x,cy-18,C.ink,2);
      if(pl.part==='ball') s+=`<circle cx="${f(x)}" cy="${f(cy)}" r="22" fill="${C.part}" stroke="${C.acc}" stroke-width="2.2"/><path d="M${f(x-13)} ${f(cy-8)}a15 15 0 0 1 10-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
      else if(pl.part==='steel') s+=`<circle cx="${f(x)}" cy="${f(cy)}" r="17" fill="${C.steelD}" stroke="${C.acc}" stroke-width="2.2"/>`;
      else if(pl.part==='sponge') s+=`<rect x="${f(x-22)}" y="${f(cy-14)}" width="44" height="28" rx="4" fill="#e9d47c" stroke="${C.acc}" stroke-width="2.2"/>`;
      else s+=`<path d="M${f(x-20)} ${f(cy-18)}h40l-15 22v14h-10v-14z" fill="#d8e6ee" stroke="${C.acc}" stroke-width="2.2" stroke-linejoin="round"/>`;
    }
    if(out&&key==='ok'&&wL<=120.5) s+=T(112,100,'SHUT ✓',{fill:C.blue,w:600,size:9});
    return [s,cap];
  }
};

/* ============ 5. WINCH RATCHET ============ */
const RATCHET={
  id:'ratchet',title:'Winch ratchet',fig:'Hand winch · front view',rotStep:90,dur:3.2,
  prompt:'Crank the bucket up, then let go. It should stay up. Something has to catch the ratchet wheel.',
  answer:{part:'pawl',slot:'T',rot:0},
  slots:[{id:'T',label:'A',x:128,y:52,w:58,h:46,name:'on the ratchet teeth'},{id:'D',label:'B',x:248,y:74,w:58,h:46,name:'on the rope drum'}],
  parts:[
    {id:'pawl',name:'Pawl',desc:'A hooked lever that swings freely on its pin.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('pawl',C.ink,C.steel)}</g>`},
    {id:'stop',name:'Fixed stop',desc:'A pointed block, bolted down so it can’t move.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('stop',C.ink,C.steel)}</g>`},
    {id:'roller',name:'Roller arm',desc:'A swinging arm with a free-spinning wheel at its tip.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('roller',C.ink,C.steel)}</g>`},
    {id:'rubber',name:'Rubber pad arm',desc:'A swinging arm tipped with a grippy rubber pad.',icon:()=>`<g transform="translate(62,22) rotate(160)">${RATCHET.shape('rubber',C.ink,C.steel)}</g>`}
  ],
  shape(id,st,fill){
    if(id==='pawl') return `<polygon points="-3,-7 30,-5 41,2 30,5.5 -3,7" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
    if(id==='stop') return `<polygon points="-6,-9 28,-8 41,0 28,8 -6,9" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><circle cx="2" r="3" fill="${C.ink}"/><circle cx="16" r="3" fill="${C.ink}"/>`;
    if(id==='roller') return `<line x1="0" y1="0" x2="31" y2="0" stroke="${st}" stroke-width="5" stroke-linecap="round"/><circle cx="34" r="7" fill="${fill}" stroke="${st}" stroke-width="2"/><circle cx="34" r="2" fill="${st}"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
    return `<line x1="0" y1="0" x2="28" y2="0" stroke="${st}" stroke-width="5" stroke-linecap="round"/><rect x="27" y="-7" width="14" height="14" rx="3" fill="${C.rub}" stroke="${st}" stroke-width="2"/><circle r="5" fill="${C.card}" stroke="${st}" stroke-width="2"/>`;
  },
  evaluate(pl){
    if(pl.rot%360!==0) return {ok:false,key:'drop',msg:'Pointed that way, it never touches anything. Let go of the crank and the bucket drops.'};
    if(pl.slot==='D') return {ok:false,key:'drop',msg:'The rope drum is smooth, so there’s nothing to catch on. It slides along the drum and the bucket drops.'};
    switch(pl.part){
      case 'pawl':return {ok:true,key:'ok'};
      case 'stop':return {ok:false,key:'jam',msg:'A fixed stop can’t swing out of the way. It blocks the teeth in both directions, so you can’t even crank the bucket up.'};
      case 'roller':return {ok:false,key:'drop',msg:'A roller rolls up and over the teeth in either direction. It clicks, but it never locks, and the bucket drops.'};
      default:return {ok:false,key:'rubber',msg:'Rubber friction can’t hold the weight. It squeals, slips, and the bucket drops.'};
    }
  },
  why:'While you crank, the sloped backs of the teeth lift the pawl out of the way: click, click, click. When the load pulls back, a steep tooth face drives straight into the pawl’s tip and pushes it toward its own pivot. It can’t swing out, so the drum locks. One-way motion from one free-swinging part.',
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let phi=0,cap='';
    if(out){
      if(key==='jam'){phi=(t>.2&&t<1.8)?-2.5*Math.abs(Math.sin(t*40)):0;cap=t<.3?'Cranking…':'The crank won’t budge. The stop blocks the teeth both ways.';}
      else if(t<1.5){phi=-160*ease(seg(t,.2,1.5));cap='Cranking the bucket up…';}
      else{const tau=t-1.5;
        if(key==='ok'){phi=-160+3*ease(seg(tau,0,.12));cap='Let go. The pawl catches and the bucket stays up. ✓';}
        else if(key==='rubber'){phi=Math.min(0,-160+22*tau+(tau>.6?450*(tau-.6)**2:0));cap='Let go. It squeals, slips, and drops.';}
        else{phi=Math.min(0,-160+450*tau*tau);cap='Let go. The bucket drops.';}}
    }
    const W=[120,140],D=[250,140];let s='';
    s+=`<rect x="10" y="285" width="380" height="12" fill="url(#hatch2)"/>`+L(10,285,390,285,C.ink,2);
    s+=`<polygon points="110,150 130,150 150,285 90,285" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/><polygon points="240,150 260,150 228,285 212,285" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=L(W[0],W[1],D[0],D[1],C.ink,1,'4 3')+T(186,133,'AXLE');
    // ratchet wheel
    let d='';const n=16,stp=360/n;
    for(let k=0;k<n;k++){const a=phi+k*stp;const r1=[W[0]+Math.cos(rad(a))*48,W[1]+Math.sin(rad(a))*48],r2=[W[0]+Math.cos(rad(a+stp-1))*60,W[1]+Math.sin(rad(a+stp-1))*60];d+=(k?'L':'M')+f(r1[0])+','+f(r1[1])+'L'+f(r2[0])+','+f(r2[1]);}
    s+=`<path d="${d}Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="${W[0]}" cy="${W[1]}" r="30" fill="none" stroke="${C.ink}" stroke-dasharray="2 3" opacity=".5"/>`;
    s+=L(W[0],W[1],W[0]+Math.cos(rad(phi))*34,W[1]+Math.sin(rad(phi))*34,C.ink,3)+`<circle cx="${W[0]}" cy="${W[1]}" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=T(14,214,'RATCHET WHEEL');
    // rope + bucket
    const lift=28*rad(-phi),by=244-lift;
    s+=L(278,140,278,by,C.rope,3);
    s+=`<path d="M262 ${f(by)} Q278 ${f(by-14)} 294 ${f(by)}" fill="none" stroke="${C.ink}" stroke-width="1.8"/><polygon points="258,${f(by+2)} 298,${f(by+2)} 293,${f(by+40)} 263,${f(by+40)}" fill="#b98b5a" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>${L(260,by+12,296,by+12,C.ink,1)}${T(278,by+28,'LOAD',{a:'middle',fill:C.ink,size:7,halo:false})}`;
    // drum
    s+=`<circle cx="${D[0]}" cy="${D[1]}" r="28" fill="${C.ghost}" stroke="${C.ink}" stroke-width="2"/><circle cx="${D[0]}" cy="${D[1]}" r="25" fill="none" stroke="${C.rope}" stroke-width="5"/>`;
    const ca=rad(phi-90);s+=`<line x1="${D[0]}" y1="${D[1]}" x2="${f(D[0]+Math.cos(ca)*22)}" y2="${f(D[1]+Math.sin(ca)*22)}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(D[0]+Math.cos(ca)*22)}" cy="${f(D[1]+Math.sin(ca)*22)}" r="6" fill="${C.acc}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="${D[0]}" cy="${D[1]}" r="6" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=T(306,186,'ROPE DRUM')+T(306,196,'+ CRANK');
    s+=arcArrowCCW(D[0],D[1],40,-10,-80)+T(268,90,'LIFT',{fill:C.ink});
    // pivot posts
    s+=`<line x1="172" y1="74" x2="186" y2="34" stroke="${C.ink}" stroke-width="3"/><line x1="292" y1="96" x2="306" y2="56" stroke="${C.ink}" stroke-width="3"/>`;
    s+=`<circle cx="172" cy="74" r="2" fill="${C.ink}"/><circle cx="292" cy="96" r="2" fill="${C.ink}"/>`;
    if(pl){const P=pl.slot==='T'?[172,74]:[292,96];let bump=0;
      const contact=pl.slot==='T'&&pl.rot%360===0&&pl.part!=='stop';
      if(out&&contact&&!(key==='ok'&&t>=1.5)) bump=8*frac(-phi/stp);
      s+=`<g transform="translate(${P[0]},${P[1]}) rotate(${f(159.8+pl.rot+bump)})">${this.shape(pl.part,C.acc,C.part)}</g>`;
      if(out&&key==='ok'&&t<1.5&&t>.25&&frac(-phi/stp)<.25) s+=T(150,48,'click',{fill:C.blue,w:600,size:9});
    }
    return [s,cap];
  }
};
function arcArrowCCW(cx,cy,r,a1,a2,col=C.ink){
  const p=a=>[cx+Math.cos(rad(a))*r,cy+Math.sin(rad(a))*r];const [x1,y1]=p(a1),[x2,y2]=p(a2);
  const ar=rad(a2),dx=Math.sin(ar),dy=-Math.cos(ar),nx=Math.cos(ar),ny=Math.sin(ar);
  return `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 0 0 ${f(x2)},${f(y2)}" fill="none" stroke="${col}" stroke-width="1.6"/><polygon points="${f(x2+dx*2)},${f(y2+dy*2)} ${f(x2-dx*7+nx*4)},${f(y2-dy*7+ny*4)} ${f(x2-dx*7-nx*4)},${f(y2-dy*7-ny*4)}" fill="${col}"/>`;
}

/* ============ batch A: clickpen ============ */
/* ============ A1. RETRACTABLE CLICK PEN ============ */
/* Batch A. Uses the shared helpers from index.html (C, T, L, zig, torsion, ease, seg, lerp, f, rad, frac).
   Physics: the return spring sits around the refill between the barrel's inner seat (near the tip) and a collar
   on the refill. Clicking pushes the refill toward the tip, squeezing the spring; the rotating cam catches the
   refill in the "out" notch on one click and lets it go on the next, so the spring pulls the tip back in. */
const CLICKPEN={
  id:'clickpen',title:'Retractable pen',fig:'Click pen · cutaway',rotStep:0,dur:3,
  prompt:'Click once and the tip should come out and stay out. Click again and it should go back in. One part is missing from inside the barrel.',
  answer:{part:'comp',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:288,y:126,w:34,h:48,name:'between cam and button'},{id:'A',label:'B',x:76,y:126,w:50,h:48,name:'between seat and collar'}],
  parts:[
    {id:'comp',name:'Compression spring',desc:'Open coils. Squeeze it and it pushes back.',icon:()=>zig(8,28,72,28,6,24,C.ink,2.4)},
    {id:'ext',name:'Extension spring',desc:'Coils pressed tight together, with hooks. Pull it apart and it pulls back.',icon:()=>CLICKPEN.extIcon()},
    {id:'tors',name:'Torsion spring',desc:'Twist its legs around a pin and it twists back.',icon:()=>torsion(40,28,0,C.ink)},
    {id:'tube',name:'Rigid tube',desc:'A short, solid plastic sleeve.',icon:()=>`<rect x="10" y="18" width="60" height="20" rx="2" fill="#dccfb4" stroke="${C.ink}" stroke-width="2"/><ellipse cx="70" cy="28" rx="3" ry="10" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`}
  ],
  extIcon(){let s=`<path d="M10 28 a6 6 0 1 1 6 6" fill="none" stroke="${C.ink}" stroke-width="2.2"/><path d="M70 28 a6 6 0 1 0 -6 6" fill="none" stroke="${C.ink}" stroke-width="2.2"/>`;
    for(let x=18;x<=62;x+=4) s+=`<line x1="${x}" y1="18" x2="${x+2}" y2="38" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/>`;return s;},
  evaluate(pl){
    const A=pl.slot==='A';
    switch(pl.part){
      case 'comp':return A?{ok:true,key:'ok'}:{ok:false,key:'pushout',msg:'Behind the cam, the spring pushes the cam and refill <i>toward</i> the tip. The tip pops out and stays out, and the button just squashes the spring. Nothing ever pushes the tip back in.'};
      case 'ext':return A?{ok:false,key:'jam',msg:'An extension spring’s coils already touch, so it can’t get any shorter. Between the seat and the collar it acts like a solid tube, and the button won’t go down.'}
                        :{ok:false,key:'loose',msg:'With its coils already touching, the extension spring is just a solid spacer here. It passes the click along, the tip comes out, but nothing pushes the refill back, so the tip never goes back in.'};
      case 'tors':return {ok:false,key:'loose',msg:'A torsion spring works by being twisted around a pin. Nothing in a pen twists it, so it just sits there. The tip comes out and nothing pushes it back in.'};
      default:return A?{ok:false,key:'jam',msg:'The solid tube fills the gap between the seat and the collar, so the refill can’t move toward the tip. The button won’t go down.'}
                      :{ok:false,key:'loose',msg:'Between the cam and the button the tube just passes the push along. The tip comes out, but nothing pushes the refill back, so it never goes back in.'};
    }
  },
  why:'The spring sits around the refill, between a seat inside the barrel and the refill’s collar. Each click pushes the refill forward and squeezes the spring. The cam turns one notch per click: one notch holds the refill out against the spring, the next lets it go, and the spring pushes the tip back inside.',
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let sh=0,bsh=0,step=0,cap='';
    /* sh = refill shift toward the tip (26 = latched out, 32 = fully pressed); bsh = button shift */
    if(out){
      if(key==='ok'){
        step=.5*(seg(t,.42,.6)+seg(t,.6,.75)+seg(t,1.45,1.6)+seg(t,1.7,1.85));
        if(t<.6){bsh=sh=32*ease(seg(t,.2,.6));cap='Click…';}
        else if(t<1.3){bsh=sh=lerp(32,26,ease(seg(t,.6,.8)));cap='The cam catches the refill in a shallow notch. Tip out, and it stays out.';}
        else if(t<1.7){bsh=sh=lerp(26,32,ease(seg(t,1.3,1.6)));cap='Click again…';}
        else{bsh=sh=32*(1-ease(seg(t,1.7,1.95)));cap='The cam turns on to a deep slot and the spring pushes the tip back in. ✓';}
      }else if(key==='jam'){bsh=sh=(t>.2&&t<1.6)?Math.abs(Math.sin(t*55))*1.5:0;cap=t<.3?'Click…':'The button won’t go down.';}
      else if(key==='pushout'){sh=32*ease(seg(t,.1,.35));
        const pr=t<1.2?Math.sin(Math.PI*seg(t,.5,1.1)):Math.sin(Math.PI*seg(t,1.5,2.1));bsh=14*pr;
        cap=t<.45?'The spring shoves the refill forward…':'Click… click. The tip is stuck out, and the button just squashes the spring.';}
      else{bsh=sh=32*ease(seg(t,.2,.6));cap=t<.6?'Click…':t<1.3?'Let go. Nothing pushes back, so the refill stays forward.':'Click again… nothing changes. The tip won’t go back in.';}
    }
    let s='';
    /* barrel (cut walls hatched) */
    s+=`<path d="M18 145 L70 116 H340 V184 H70 L18 155 Z" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.8" stroke-linejoin="round"/>`;
    s+=`<path d="M18 147.5 L72 124 H332 V176 H72 L18 152.5 Z" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
    s+=`<rect x="332" y="136" width="9" height="28" fill="${C.card}"/>`;
    /* inner seat ring */
    s+=`<rect x="68" y="124" width="6" height="18" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/><rect x="68" y="158" width="6" height="18" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/>`;
    /* cam ridges in barrel */
    s+=`<path d="M236 124 V131 H248 L254 127 H262 V131 H270 V124 Z" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.3" stroke-linejoin="round"/><path d="M236 176 V169 H248 L254 173 H262 V169 H270 V176 Z" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.3" stroke-linejoin="round"/>`;
    /* refill */
    const rx=x=>f(x-sh);
    s+=`<rect x="${rx(50)}" y="145" width="212" height="10" fill="#c9d7e4" stroke="${C.ink}" stroke-width="1.5"/><line x1="${rx(60)}" y1="150" x2="${rx(250)}" y2="150" stroke="${C.blue}" stroke-width="3" opacity=".6"/>`;
    s+=`<polygon points="${rx(36)},150 ${rx(50)},146 ${rx(50)},154" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${rx(36)}" cy="150" r="1.8" fill="${C.ink}"/>`;
    s+=`<rect x="${rx(130)}" y="136" width="8" height="28" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/>`;
    /* cam rotor: stripes shift as it turns */
    s+=`<rect x="${rx(256)}" y="133" width="28" height="34" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.8"/>`;
    s+=`<clipPath id="cpRot"><rect x="${rx(257)}" y="134" width="26" height="32"/></clipPath><g clip-path="url(#cpRot)">`;
    for(let i=-1;i<5;i++){const y=134+((i*10+step*5)%40+40)%40-4;s+=`<line x1="${rx(257)}" y1="${f(y)}" x2="${rx(283)}" y2="${f(y+8)}" stroke="${C.ink}" stroke-width="1" opacity=".45"/>`;}
    s+=`</g>`;
    /* plunger */
    const px=x=>f(x-bsh);

    s+=T(18,108,'TIP')+L(24,111,24,140)+T(56,206,'SEAT')+L(71,196,71,177)+T(116,206,'COLLAR')+L(134-sh,196,134-sh,165)+T(150,108,'INK REFILL')+L(180,111,180,144);

    return [s,cap];

};

/* ============ batch A: mousetrap ============ */
/* ============ A2. SNAP MOUSETRAP ============ */
/* Batch A. Classic wooden snap trap, side view. The torsion spring wraps the hinge pin: one leg braced on the base,
   the other on the hammer. Setting the trap winds it; the hold-down bar (tucked under the bait pedal's lip) keeps it
   wound; tipping the pedal frees the bar and the spring whips the hammer over. */
const MOUSETRAP={
  id:'mousetrap',title:'Snap mousetrap',fig:'Snap trap · side view',rotStep:0,dur:2.6,
  prompt:'The trap is set and baited. When the bait pedal tips, the hammer should whip over and snap down. One part is missing.',

  parts:[
    {id:'tors',name:'Torsion spring',desc:'Steel coil with two legs. Twist the legs around a pin and it twists back hard.',icon:()=>torsion(40,28,0,C.ink)},
    {id:'comp',name:'Compression spring',desc:'Open steel coils. Squeeze its ends together and it pushes back hard.',icon:()=>zig(8,28,72,28,6,24,C.ink,2.4)},
    {id:'copper',name:'Copper coil',desc:'Looks like a spring, but it’s soft copper wire. Bend it and it stays bent.',icon:()=>`<g transform="translate(40,28)"><circle r="9" fill="none" stroke="#b5652f" stroke-width="2.8"/><circle r="5" fill="none" stroke="#b5652f" stroke-width="2.2"/><polyline points="-8,-4 -24,-16 -30,-20" fill="none" stroke="#b5652f" stroke-width="2.8" stroke-linecap="round"/><polyline points="8,4 24,16 30,20" fill="none" stroke="#b5652f" stroke-width="2.8" stroke-linecap="round"/></g>`},
    {id:'washer',name:'Nylon washer',desc:'A slippery plastic ring that lets parts turn freely on a pin.',icon:()=>`<circle cx="40" cy="28" r="18" fill="#f6f3ec" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`}
  ],
  evaluate(pl){

      case 'comp':return {ok:false,key:'axial',msg:A?'A compression spring pushes along its own length. Slid onto the hinge pin, that push runs along the pin, so it never turns the hammer.':'On the pedal’s pin it only pushes along the pin. And with no spring at the hinge, nothing drives the hammer.'};
      case 'copper':return A?{ok:false,key:'soft',msg:'Soft copper bends and stays bent. Setting the trap just bent the coil into a new shape, so it stores almost no energy. The hammer barely twitches.'}
                            :{ok:false,key:'limp',msg:'Soft copper stores no energy, and the pedal’s pin is the wrong place for a spring anyway. Nothing drives the hammer.'};
      default:return {ok:false,key:'limp',msg:'A washer stores no energy. The pedal tips and lets the bar go, but nothing drives the hammer, so it just lies there.'};

  why:'The torsion spring wraps the hinge pin. One leg presses on the base and the other on the hammer, so pulling the hammer back winds it up. The hold-down bar keeps it wound until the bait pedal tips and lets the bar go. Then the spring whips the hammer over in a few hundredths of a second.',

      if(key==='ok'){const u=seg(t,.82,.98);th=180*(1-u*u);if(t>.98)th=5*Math.sin(Math.PI*seg(t,.98,1.18));ba=-38*Math.sin(Math.PI*seg(t,.84,1.4));}
      else if(key==='soft'){th=180-5*ease(seg(t,.85,1.4));ba=-3*ease(seg(t,.8,1));}
      else ba=-3*ease(seg(t,.8,1));
      if(key==='axial'&&t>.85&&t<2.2) th=180+1.2*Math.sin(t*55)*(1-seg(t,.85,2.2));
      cap=t<.45?'Trap set. Waiting…':t<.82?'Something nudges the bait. The pedal tips and lets the bar go…':
        key==='ok'?'SNAP. The spring whips the hammer over. ✓':key==='soft'?'The hammer twitches and stops. No stored energy.':key==='axial'?'The spring shoves along the pin, not around it. The hammer only rattles.':key==='pedal'?'The pedal bounces back up on its spring… but the hammer just lies there.':'The bar is free… and the hammer just lies there. Nothing was wound up.';

    s+=`<circle cx="${P[0]}" cy="${P[1]}" r="3" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`;

    const he=[H[0]+130*Math.cos(rad(th)),H[1]-130*Math.sin(rad(th))];

    /* missing part */

        s+=`<polyline points="${c[0]+7},${c[1]+4} ${c[0]+34},230" fill="none" stroke="${C.acc}" stroke-width="2.6" stroke-linecap="round"/>`;
        s+=`<polyline points="${c[0]},${c[1]} ${f(c[0]+26*Math.cos(ha))},${f(c[1]-26*Math.sin(ha)-3)}" fill="none" stroke="${C.acc}" stroke-width="2.6" stroke-linecap="round"/>`;}
      else if(pl.part==='comp'){const k=key==='axial'&&t>.85?4*Math.abs(Math.sin(t*14))*(1-seg(t,.85,2.4)):0;s+=zig(c[0]-16+k,c[1]-12,c[0]+16-k,c[1]-12,4,10);
        if(key==='axial'&&t>.9){const y=c[1]-30;s+=L(c[0]-24,y,c[0]+24,y,C.blue,1.6)+`<polygon points="${c[0]-28},${y} ${c[0]-21},${y-4} ${c[0]-21},${y+4}" fill="${C.blue}"/><polygon points="${c[0]+28},${y} ${c[0]+21},${y-4} ${c[0]+21},${y+4}" fill="${C.blue}"/>`+T(c[0],y-7,'PUSHES ALONG THE PIN',{fill:C.blue,w:600,a:'middle'});}}

        (A?`<polyline points="${c[0]},${c[1]} ${f(c[0]+22*Math.cos(ha))},${f(c[1]-22*Math.sin(ha)-6)}" fill="none" stroke="#b5652f" stroke-width="2.6" stroke-linecap="round"/>`:'')+`<circle cx="${c[0]}" cy="${c[1]}" r="12" fill="none" stroke="${C.acc}" stroke-width="1" stroke-dasharray="2 2"/>`;}

    s+=T(34,250,'BASE')+T(64,206,'HOLD-DOWN BAR')+L(110,209,110,216)+T(70,276,'HAMMER')+L(96,268,104,229)+T(352,206,'BAIT',{a:'end'})+T(290,276,'BAIT PEDAL')+L(312,268,312,231)+T(166,276,'HINGE PIN')+L(196,268,196,240);

/* ============ batch A: pintumbler ============ */
/* ============ A3. PIN-TUMBLER CYLINDER LOCK ============ */
/* Batch A. Side cutaway with the key inserted. Each stack = key pin (brass, bottom) + driver pin (steel, 6 mm) + spring.
   The plug turns only if every stack splits exactly at the shear line. Stack 3 is missing its key pin: the key's cut
   under it sits 5 mm below the shear line (drawn 8 px per mm). */
const PINTUMBLER={
  id:'pintumbler',title:'Cylinder lock',fig:'Pin-tumbler lock · cutaway',rotStep:0,dur:2.4,
  prompt:'The right key is in. Turn it and the plug should rotate. Stack 3 is missing a part, so for now its driver pin has dropped onto the key.',
  answer:{part:'p5',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:161,y:64,w:28,h:40,name:'stack 3, above the driver pin'},{id:'A',label:'B',x:161,y:152,w:28,h:38,name:'stack 3, in the plug'}],
  LEN:{p5:40,p7:56,p3:24,spring:18},
  parts:[
    {id:'p5',name:'Key pin, 5 mm',desc:'Brass pin with a rounded tip. 5 mm long.',icon:()=>PINTUMBLER.pinIcon(40)},
    {id:'p7',name:'Key pin, 7 mm',desc:'Brass pin with a rounded tip. 7 mm long.',icon:()=>PINTUMBLER.pinIcon(56)},
    {id:'p3',name:'Key pin, 3 mm',desc:'Brass pin with a rounded tip. 3 mm long.',icon:()=>PINTUMBLER.pinIcon(24)},
    {id:'spring',name:'Pin spring',desc:'A small, soft coil spring, like the ones on top of each stack.',icon:()=>zig(16,28,64,28,6,18,C.ink,2.2)}
  ],
  pinIcon(len){const w=len*1.15,x0=40-w/2;return `<path d="M${f(x0)} 21 H${f(x0+w-6)} Q${f(x0+w)} 28 ${f(x0+w-6)} 35 H${f(x0)} Z" fill="#d8b45a" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`+T(40,50,(len/8)+' mm',{a:'middle',size:7,halo:false,fill:C.ink});},
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'nokey',msg:pl.part==='spring'
      ?'A second spring above the driver pin only adds push. With no key pin below it, the 6 mm driver pin drops onto the key. That’s 1 mm too long for the 5 mm gap, so it sticks across the shear line and the plug won’t turn.'
      :'Above the driver pin, the extra pin just squashes the spring. With no key pin below, the 6 mm driver pin drops onto the key. That’s 1 mm too long for the 5 mm gap, so it sticks across the shear line and the plug won’t turn.'};
    switch(pl.part){
      case 'p5':return {ok:true,key:'ok'};
      case 'p7':return {ok:false,key:'long',msg:'The 7 mm pin is 2 mm too long. It pokes up out of the plug into the housing, bridging the shear line, so the plug can’t turn.'};
      case 'p3':return {ok:false,key:'short',msg:'The 3 mm pin leaves a 2 mm gap. The spring pushes the driver pin down into the plug, across the shear line, and it blocks the turn.'};
      default:return {ok:false,key:'springA',msg:'A spring has no fixed length. The top spring squashes it and pushes the driver pin down into the plug, across the shear line, so the plug won’t turn.'};
    }
  },
  why:'With the right key in, every stack has to split exactly at the shear line, with the key pin below it and the driver pin above. The key’s cut under stack 3 sits 5 mm below the line, so a 5 mm key pin puts the split right on it. Nothing bridges the plug and the housing, and the plug turns. A wrong key leaves at least one pin across the line.',
  /* returns stack-3 layout: elements [{kind,top,bot}] and whether something crosses the shear line */
  stack3(pl){const kt=190,els=[];let y=kt;
    if(pl&&pl.slot==='A'){const l=this.LEN[pl.part];els.push({kind:pl.part,top:y-l,bot:y});y-=l;}
    els.push({kind:'driver',top:y-48,bot:y});y-=48;
    if(pl&&pl.slot==='B'){const l=this.LEN[pl.part];els.push({kind:pl.part,top:y-l,bot:y,placed:true});y-=l;}
    if(pl&&pl.slot==='A') els[0].placed=true;
    const cross=els.find(e=>e.top<149.5&&e.bot>150.5);return {els,springTop:y,cross};},
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let ang=0,cap='';
    const X=[95,135,175,215,255],KL=[32,48,40,24,56];
    if(out){
      if(key==='ok'){ang=90*ease(seg(t,.3,1.3));cap=t<.3?'Turning the key…':'Every stack splits at the shear line. The plug turns. ✓';}
      else{ang=(t>.3&&t<1.6)?4*Math.abs(Math.sin((t-.3)*18)):0;cap=t<.3?'Turning the key…':'It won’t turn. A pin is stuck across the shear line.';}
    }
    let s='';
    /* housing + plug */
    s+=`<rect x="60" y="56" width="240" height="196" fill="url(#hatch)" stroke="${C.ink}" stroke-width="1.8"/>`;
    s+=`<rect x="60" y="150" width="240" height="94" fill="${C.ghost}" stroke="${C.ink}" stroke-width="1.6"/>`;
    s+=`<rect x="60" y="166" width="236" height="72" fill="${C.card}"/>`;
    X.forEach(x=>{s+=`<rect x="${x-8}" y="62" width="16" height="88" fill="${C.card}" stroke="${C.ink}" stroke-width="1.2"/><rect x="${x-8}" y="150" width="16" height="16" fill="${C.card}" stroke="${C.ink}" stroke-width="1.2"/>`;});
    /* key */
    const cut=[[60,170]];X.forEach((x,i)=>{cut.push([x-5,150+KL[i]],[x+5,150+KL[i]]);});cut.push([272,206],[294,224],[294,236]);
    const prof=x=>{for(let i=1;i<cut.length;i++)if(x<=cut[i][0]){const a=cut[i-1],b=cut[i];return lerp(a[1],b[1],(x-a[0])/((b[0]-a[0])||1));}return 236;};
    s+=`<path d="M8 168 H56 V164 H60 ${cut.map(p=>'L'+p[0]+' '+p[1]).join(' ')} L294 238 H60 V242 H56 V246 H8 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="26" cy="207" r="8" fill="${C.card}" stroke="${C.ink}" stroke-width="1.8"/>`;
    /* pin stacks */
    const brass='#d8b45a';
    const pin=(x,top,bot,fill,stroke,tip)=>`<path d="M${x-6} ${f(top)} H${x+6} V${f(bot-(tip?5:0))} ${tip?`Q${x} ${f(bot+1)} ${x-6} ${f(bot-5)}`:`H${x-6}`} Z" fill="${fill}" stroke="${stroke}" stroke-width="${stroke===C.acc?2:1.5}" stroke-linejoin="round"/>`;
    const spr=(x,top,bot,col=C.ink)=>zig(x,top,x,bot,Math.max(2,Math.round((bot-top)/9)),10,col,1.5);
    X.forEach((x,i)=>{if(i===2)return;const kt=prof(x),kp=kt-KL[i];s+=pin(x,kp,kt,brass,C.ink,true)+pin(x,kp-48,kp,C.steel,C.ink,false)+spr(x,62,kp-48);});
    const L3=this.stack3(pl);
    L3.els.forEach(e=>{if(e.kind==='driver')s+=pin(175,e.top,e.bot,C.steel,C.ink,false);
      else if(e.kind==='spring')s+=zig(175,e.top,175,e.bot,3,11,C.acc,2);
      else s+=pin(175,e.top,e.bot,C.part,C.acc,true);});
    s+=spr(175,62,L3.springTop);
    /* shear line */
    const good=key==='ok'&&t>.3,bad=out&&key!=='ok'&&t>.35;
    s+=L(60,150,300,150,good?C.blue:C.acc,good?2:1.2,good?'':'5 3');
    if(bad&&L3.cross) s+=`<rect x="163" y="142" width="24" height="16" rx="3" fill="none" stroke="${C.acc}" stroke-width="2.4" opacity="${f(.5+.5*Math.abs(Math.sin(t*7)))}"/>`;
    /* dimension: key cut to shear line at stack 3 */

/* ============ A4. DESKTOP STAPLER ============ */
/* Batch A. Front cross-section through the stapler's nose. The driver pushes one staple through the paper; the anvil
   in the base recess has two curved cups under the legs that fold them inward (clinch). Real anvils are often
   reversible: the other face bends the legs outward (the "pinning" setting). Here the anvil is two-sided, so
   rotating it 180° turns the other face up. As it comes out of the bin the pinning face is up,
   so the answer needs one 180° turn. */
const STAPLER={
  id:'stapler',title:'Desktop stapler',fig:'Stapler · cross-section at the nose',rotStep:180,dur:2.6,
  prompt:'Press the head down. The staple should go through the paper and its legs should fold inward underneath, clamping the pages. The base is missing a part.',
  answer:{part:'anvil',slot:'A',rot:180},
  slots:[{id:'A',label:'A',x:156,y:228,w:88,h:24,name:'in the base, under the paper'},{id:'B',label:'B',x:156,y:200,w:88,h:24,name:'on top of the paper'}],
  parts:[
    {id:'anvil',name:'Anvil plate',desc:'Two curved cups on each face. Each cup is deep at one end and ramps up at the other, and the two faces ramp opposite ways.',icon:()=>`<g transform="translate(40,28) scale(.92) translate(-200,-240)">${STAPLER.anvil(0,0)}</g>`},
    {id:'plate',name:'Flat steel plate',desc:'Hard, smooth, polished steel, perfectly flat on both faces. Nothing can sink into it, however hard you press.',icon:()=>`<rect x="8" y="20" width="64" height="16" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><line x1="12" y1="24" x2="30" y2="24" stroke="#fff" stroke-width="2"/>`},
    {id:'rubber',name:'Rubber pad',desc:'A thick block of soft, grippy rubber. It cushions anything that presses down on it, hard.',icon:()=>`<rect x="8" y="20" width="64" height="16" rx="3" fill="${C.rub}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'cork',name:'Cork tile',desc:'A slab of cork, like a noticeboard. Pins push into it easily.',icon:()=>`<rect x="8" y="20" width="64" height="16" rx="1" fill="#c9a06a" stroke="${C.ink}" stroke-width="2"/>${[[16,25],[30,31],[44,24],[58,30],[24,29],[50,28],[66,25]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#8f6a3a"/>`).join('')}`}
  ],
  /* anvil plate at x 160..240, y 232..248; clinch=1 shows the inward-folding cups on top */
  /* v3: both faces are drawn. Each cup is deep under a staple leg and ramps up on one side; the clinching face ramps
     toward the middle (legs fold inward), the pinning face ramps outward. Rotating 180° swaps the faces, exactly as
     the tray icon shows. clinch=true: clinching face on top. */
  anvil(dy,clinch,stroke=C.ink,fill=C.steel){const y=232+dy,yb=y+16;
    /* one cup under the leg at xl: a steep wall on one side, deepest under the leg, then a long ramp toward d */
    const cups=inward=>(inward?[[172,1],[228,-1]]:[[172,-1],[228,1]]).map(([xl,d])=>({xl,d,S:xl-d*3,R:xl+d*11}));
    const edge=(yy,sg,list,ltr)=>{let p='';list.sort((a,b)=>ltr?Math.min(a.S,a.R)-Math.min(b.S,b.R):Math.max(b.S,b.R)-Math.max(a.S,a.R)).forEach(c=>{const yd=yy+sg*6,cx=c.xl+c.d*8;
        const fromS=ltr?c.S<c.R:c.S>c.R;
        p+=fromS?` L${c.S} ${yy} Q${c.S} ${yd} ${c.xl} ${yd} Q${cx} ${yd} ${c.R} ${yy}`:` L${c.R} ${yy} Q${cx} ${yd} ${c.xl} ${yd} Q${c.S} ${yd} ${c.S} ${yy}`;});return p;};
    const d=`M160 ${y}`+edge(y,1,cups(clinch),true)+` L240 ${y} V${yb}`+edge(yb,-1,cups(!clinch),false)+` L160 ${yb} Z`;
    return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;},
  evaluate(pl){
    const up=pl.rot%360===180; /* clinch face up */
    if(pl.slot==='B'){
      if(pl.part==='anvil') return {ok:false,key:'blocked',msg:'On top of the paper, the anvil sits between the staple and the pages. The legs hit steel and crumple before they ever reach the paper.'};

      return {ok:false,key:'straightB',msg:'The legs have to go through the cork first, so they only just poke out under the paper, still straight. Your pages are now loosely stapled to a cork tile.'};
    }
    switch(pl.part){
      case 'anvil':return up?{ok:true,key:'ok'}:{ok:false,key:'outward',msg:'This face of the anvil has cups that bend the legs <i>outward</i>. That’s the pinning setting, for staples you want to pull out easily, and it doesn’t clamp the pages.'};
      case 'plate':return {ok:false,key:'crumple',msg:'Flat steel gives the legs nothing to follow. They hit it square, buckle, and fold whichever way they like, so the staple doesn’t grip.'};

  why:'Turned over, the anvil’s clinching face has two curved cups right under the staple’s legs. As the driver pushes the legs through the paper, each cup steers its leg round and inward so it folds flat under the pages. That’s the clinch that holds them together.',
  render(st){

    if(out){hd=ease(seg(t,.2,.55))*(floor-186)*(t<1.25?1:1-ease(seg(t,1.25,1.7)));u=ease(seg(t,.6,1.05));
      const msg={ok:'The cups fold both legs inward under the pages. Clinched. ✓',outward:'The legs splay outward. Pinned, not clamped.',crumple:'The legs buckle on the flat steel.',straight:'The legs go straight in and never bend.',blocked:'The legs hit steel and crumple on top of the paper.',straightB:'The legs barely get through, and stay straight.'};
      cap=t<.55?'Pressing the head down…':t<1.05?'The driver pushes the staple…':msg[key];}
    const nose=186+hd;
    /* staple crown y */
    const cy0=nose-31;let cyEnd;

    const cy=out?lerp(floor-31,cyEnd,u):cy0;const settled=out&&t>=.6;

    let s='';

    /* placed part */
    if(pl){const fillP={plate:C.part,rubber:C.rub,cork:'#c9a06a'}[pl.part];

      else{const y=onB?206:232;s+=`<rect x="160" y="${y}" width="80" height="${onB?14:16}" rx="${pl.part==='rubber'?3:1}" fill="${fillP}" stroke="${C.acc}" stroke-width="2"/>`;}
    }
    /* staple legs */
    const leg=(xl,din)=>{const top=cyv,tip=cyv+30;let p=`M${xl} ${f(top)}`;
      if(!settled||tip<=232||key==='straight'||key==='straightB'){
        if(key==='blocked'&&settled&&tip>floor){return `M${xl} ${f(top)} L${f(xl-din*3)} ${f(top+3)} L${f(xl+din*2)} ${f(floor-2)} L${f(xl-din*10)} ${f(floor-1)}`;}
        return p+` L${xl} ${f(tip)}`;}
      if(key==='blocked'){return `M${xl} ${f(top)} L${f(xl-din*3)} ${f(top+3)} L${f(xl+din*2)} ${f(floor-2)} L${f(xl-din*10)} ${f(floor-1)}`;}

      if(key==='outward') return p+` Q${xl} ${f(232+Math.min(e,9))} ${f(xl-din*e*.95)} ${f(232+Math.min(e,9)*.25)}`;
      /* crumple on flat steel: left leg folds flat outward, right leg buckles above the paper */
      if(din>0) return p+` L${f(xl-e*.95)} 233`;
      return `M${xl} ${f(top)} L${f(xl+5)} ${f(top+6)} L${xl} ${f(top+10)} L${xl} 232 L${f(xl-e*.5)} 233`;};
    s+=`<g fill="none" stroke="${C.ink}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="${leg(172,1)}"/><path d="${leg(228,-1)}"/><path d="M172 ${f(cyv)} H228"/></g>`;

    s+=T(140,172+hy,'STAPLE',{a:'end'})+L(142,169+hy,170,cyv+12>186+hy?186+hy:cyv+12);

/* ============ batch A: umbrella ============ */
/* ============ A5. UMBRELLA RUNNER CATCH ============ */
/* Batch A. Manual stick umbrella, side view. Pushing the runner up the shaft spreads the ribs via the stretchers.
   The stretched canopy constantly pulls the runner back down, so a spring catch in the shaft must pop out under the
   runner once it reaches the top. The catch tooth has a sloped underside (the runner pushes it in on the way up)
   and a flat top (the runner sits on it). Rotating 180° turns the tooth over. It comes out of the bin flat side down, so the answer needs
   one 180° turn. */
const UMBRELLA={
  id:'umbrella',title:'Umbrella catch',fig:'Stick umbrella · side view',rotStep:180,dur:3,
  prompt:'Push the runner up the shaft to open the umbrella, then let go. It should stay open. The catch that holds the runner up is missing.',
  answer:{part:'catch',slot:'A',rot:180},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:204,y:166,w:40,h:26,name:'halfway down the shaft'},{id:'A',label:'B',x:204,y:110,w:40,h:26,name:'just under the open runner'}],
  CY:{A:121.3,B:177},
  parts:[
    {id:'catch',name:'Spring catch',desc:'A sprung tooth that pops out of the shaft. Sloped on one side, flat on the other.',icon:()=>`<path d="M14 40 V14 M14 14 L40 30" fill="none" stroke="${C.ink}" stroke-width="2" stroke-dasharray="3 2"/><polygon points="40,40 62,40 40,18" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>${T(51,50,'FLAT',{size:6.5,a:'middle',halo:false})}${T(58,22,'SLOPE',{size:6.5,a:'middle',halo:false})}`},
    {id:'double',name:'Rounded catch',desc:'A sprung tooth that pops out of the shaft. Sloped on both sides, like a speed bump.',icon:()=>`<path d="M14 40 V14 M14 14 L40 30" fill="none" stroke="${C.ink}" stroke-width="2" stroke-dasharray="3 2"/><path d="M40 14 Q66 28 40 42 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`},
    {id:'pin',name:'Fixed pin',desc:'A steel pin pressed through the shaft. It can’t move.',icon:()=>`<rect x="14" y="22" width="52" height="12" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="66" cy="28" r="8" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'leaf',name:'Leaf spring',desc:'A thin bowed strip of spring steel. Press it flat and it bows back out.',icon:()=>`<path d="M12 36 Q40 10 68 36" fill="none" stroke="${C.ink}" stroke-width="3.2" stroke-linecap="round"/><path d="M12 36 Q40 10 68 36" fill="none" stroke="${C.steel}" stroke-width="1.4" stroke-linecap="round"/>`}
  ],
  evaluate(pl){

        if(up) return {ok:false,key:'half',msg:'Halfway down the shaft, the catch works, just at the wrong height. The runner clicks past it on the way up, but when you let go the canopy pulls the runner down until it lands on the catch. The umbrella sits half-open and sagging.'};
        return {ok:false,key:'block',msg:'With its flat face pointing down and low on the shaft, the catch stops the runner almost at once. The umbrella barely opens.'};
      case 'double':return {ok:false,key:'slide',msg:'With a slope on both sides, the catch is a speed bump. The canopy’s pull pushes the runner back down over it just as easily as you pushed it up, and the umbrella folds shut.'};
      case 'pin':return A?{ok:false,key:'block',msg:'A fixed pin can’t duck into the shaft, so the runner can’t get past it. It stops just short of open and slides back down when you let go.'}
                         :{ok:false,key:'block',msg:'A fixed pin halfway down the shaft blocks the runner almost at once. The umbrella barely opens.'};

  why:'The stretched canopy is always trying to pull the runner down. The spring catch’s sloped underside lets the runner push it into the shaft on the way up. Once the runner clears it, the catch pops out, and its flat top holds the runner against the canopy’s pull. To close, you press the catch in with your thumb.',
  /* runner top y for a rib angle; and the reverse */
  yr(th){return 56+140*Math.cos(rad(th));},
  th(y){return Math.acos(clamp((y-56)/140,-1,1))*180/Math.PI;},
  plan(pl){const OPEN=this.yr(72),CLOSED=this.yr(8);if(!pl)return {top:OPEN,rest:CLOSED};

/* ============ batch A: doorcloser ============ */
/* ============ A6. HYDRAULIC DOOR CLOSER ============ */
/* Batch A. Simplified rack-and-pinion overhead closer. Opening the door turns the pinion, which slides the piston
   right and squeezes the spring. To move back, the piston must push oil from the left chamber through the passage
   into the right chamber. The needle valve's small hole limits that flow, so the door closes slowly.
   Oil is incompressible: block the passage and nothing can move (hydraulic lock). A check valve passes oil one way only;
   rotating it 180° reverses that direction. */
const DOORCLOSER={
  id:'doorcloser',title:'Door closer',fig:'Overhead door closer · plan + cutaway',rotStep:180,dur:3.8,
  prompt:'Push the door open and let go. The spring should swing it shut, slowly, without a slam. The spring is in place; the oil passage between the two chambers is missing a part.',
  answer:{part:'needle',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:180,y:238,w:40,h:26,name:'in the oil passage'},{id:'B',label:'B',x:296,y:182,w:34,h:38,name:'in the spring chamber'}],
  parts:[
    {id:'needle',name:'Needle valve',desc:'A fitting with a tiny hole, set by a screw. Oil can squeeze through slowly, either way.',icon:()=>`<g transform="translate(40,28) scale(1.6)">${DOORCLOSER.shape('needle',0,C.ink,C.steel)}</g>`},
    {id:'plug',name:'Solid plug',desc:'A brass plug. Nothing gets past it.',icon:()=>`<g transform="translate(40,28) scale(1.6)">${DOORCLOSER.shape('plug',0,C.ink,'#d8b45a')}</g>`},
    {id:'wide',name:'Open-bore fitting',desc:'A fitting with a wide, smooth bore, like a short pipe. Oil flows through it freely either way.',icon:()=>`<g transform="translate(40,28) scale(1.6)">${DOORCLOSER.shape('wide',0,C.ink,C.steel)}</g>`},
    {id:'check',name:'Check valve',desc:'A ball on a seat. Oil flows freely in the arrow’s direction and not at all the other way.',icon:()=>`<g transform="translate(40,28) scale(1.6)">${DOORCLOSER.shape('check',0,C.ink,C.steel)}</g>`}
  ],

  shape(id,rot,st,fill){

    if(id==='wide') return `<rect x="-12" y="-8" width="24" height="4" fill="${fill}" stroke="${st}" stroke-width="1.6"/><rect x="-12" y="4" width="24" height="4" fill="${fill}" stroke="${st}" stroke-width="1.6"/>`;

      `<polygon points="${-11*d},-12 ${-6*d},-15 ${-6*d},-9" fill="${C.blue}"/>`+L(-6*d,-12,9*d,-12,C.blue,1.4);
  },
  evaluate(pl){
    if(pl.slot==='B'){const nm={needle:'needle valve',plug:'plug',wide:'fitting',check:'check valve'}[pl.part];
      return {ok:false,key:'slam',msg:`In the spring chamber the ${nm} just sits loose in the oil. The passage between the chambers is left wide open, so the oil rushes through and the spring slams the door.`};}
    const fwd=pl.rot%360===0;
    switch(pl.part){
      case 'needle':return {ok:true,key:'ok'};
      case 'plug':return {ok:false,key:'lock',msg:'Oil can’t be squashed. With the passage sealed, the piston has nowhere to push the oil, so the door won’t open at all. This is called hydraulic lock.'};
      case 'wide':return {ok:false,key:'slam',msg:'A wide-open fitting doesn’t hold the oil back at all. Nothing slows the piston, so the spring slams the door.'};
      default:return fwd?{ok:false,key:'stuck',msg:'The check valve lets oil through freely while you open the door, then shuts when the oil tries to flow back. The spring can’t push the trapped oil anywhere, so the door stays open.'}
                        :{ok:false,key:'lock',msg:'This way round, the check valve only lets oil flow when the door is closing. Push the door open and the valve shuts, the oil is trapped, and the door won’t budge.'};
    }
  },
  why:'Opening the door turns the pinion, which slides the piston along and squeezes the spring. Let go and the spring pushes the piston back, but to move it has to force oil through the needle valve’s tiny hole into the other chamber. That slow trickle makes the door close gently. Turning the needle screw sets the speed.',
  render(st){

      else if(t<1.3){const u=seg(t,.2,1);a=80*ease(u);v=u>0&&u<1?1:0;cap='Pushing the door open…';}
      else if(key==='ok'){const u=seg(t,1.3,3.5);a=80*(1-ease(u));v=u<1?-.5:0;cap=u<1?'Let go. The spring pushes, and the oil seeps through the needle valve…':'Closed gently. Click. ✓';}
      else if(key==='slam'){const u=seg(t,1.3,1.55);a=80*(1-u*u);if(u>=1)a=3*Math.abs(Math.sin((t-1.55)*14))*Math.max(0,1-(t-1.55)*2);v=u<1?-2:0;cap=t<1.6?'Let go…':'BANG. Nothing slowed the oil, so the door slammed.';}

    s+=`<path d="M160 120 A110 110 0 0 0 69.1 11.7" fill="none" stroke="${C.muted}" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>`;

    s+=`<line x1="50" y1="120" x2="${f(ex)}" y2="${f(ey)}" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/><line x1="50" y1="120" x2="${f(ex)}" y2="${f(ey)}" stroke="#c9a06a" stroke-width="4.5" stroke-linecap="round"/><circle cx="50" cy="120" r="4" fill="${C.card}" stroke="${C.ink}" stroke-width="1.6"/>`;
    if(out&&key!=='lock'&&t>.1&&t<1.1){const nx=-Math.sin(rad(a)),ny=-Math.cos(rad(a));const hx=50+90*Math.cos(rad(a)),hy=120-90*Math.sin(rad(a));
      s+=`<line x1="${f(hx-nx*28)}" y1="${f(hy-ny*28)}" x2="${f(hx-nx*10)}" y2="${f(hy-ny*10)}" stroke="${C.blue}" stroke-width="2"/><circle cx="${f(hx-nx*8)}" cy="${f(hy-ny*8)}" r="3" fill="${C.blue}"/>`+T(hx-nx*30+4,hy-ny*30,'PUSH',{fill:C.blue,w:600});}
    if(key==='lock'&&out&&t>.2&&t<1.6) s+=T(120,108,'PUSH →',{fill:C.blue,w:600});
    s+=T(52,142,'HINGE')+T(170,112,'DOOR (FROM ABOVE)')+T(384,114,'WALL',{a:'end'});
    if(key==='slam'&&t>1.5&&t<2.4) s+=T(176,98,'BANG!',{fill:C.acc,w:600,size:13});
    if(key==='ok'&&t>3.45) s+=T(176,98,'click',{fill:C.blue,w:600,size:10});
    /* closer cutaway */
    const px=120+100*(a/80);

    s+=`<rect x="180" y="168" width="40" height="11" fill="${C.card}"/>`;

    s+=rk+`<rect x="${f(px)}" y="179" width="60" height="42" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/>`+L(px+8,200,px+52,200,C.ink,.8,'3 3');
    /* pinion */

    s+=L(200,140,200,128,C.muted,1,'2 2')+T(206,138,'PINION · TURNS WITH THE DOOR');
    /* passage */
    s+=`<path d="M86 230 V250 H314 V230" fill="none" stroke="${C.ink}" stroke-width="10" stroke-linejoin="round"/><path d="M86 230 V250 H314 V230" fill="none" stroke="${C.water}" stroke-width="6" stroke-linejoin="round"/>`;
    const blocked=pl&&pl.slot==='A'&&(pl.part==='plug'||pl.part==='check');
    if(out&&Math.abs(v)>0&&!(key==='lock')){const ph=frac(t*Math.abs(v)*1.6)*14*(v>0?-1:1);for(let x=96;x<306;x+=14){const xx=x+((ph%14)+14)%14;if(xx>176&&xx<224)continue;s+=L(xx,250,xx+5,250,'#3f7ea3',2);}}
    if(pl){const A=pl.slot==='A',cx=A?200:315,cy=A?250:200;s+=`<g transform="translate(${cx},${cy}) rotate(${A?0:90})">${this.shape(pl.part,pl.rot,C.acc,C.part)}</g>`;}
    s+=T(60,164,'CLOSER BODY')+T(78,214,'OIL')+T(px+66,192,'SPRING')+T(104,268,'OIL PASSAGE BETWEEN THE CHAMBERS')+T(px+30,216,'PISTON',{a:'middle',size:7,fill:C.ink});
