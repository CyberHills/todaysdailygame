/* ============ batch A: derailleur ============ */
/* ============ A7. BICYCLE REAR DERAILLEUR ============ */
/* Batch A. Simplified rear view. The derailleur body is a parallelogram: a fixed knuckle on the frame, two parallel
   links, and a moving knuckle carrying the chain cage. When the cable pulls, the moving knuckle swings inward toward
   the big cogs. Geometry: the "shallow" diagonal (fixed-top to moving-bottom) gets LONGER as it moves in, the
   "steep" diagonal gets SHORTER. A return spring across the shallow diagonal is stretched by the cable and pulls the
   derailleur back out. Rotation picks the diagonal: parts come out of the bin upright, 0°/180° = steep diagonal,
   90°/270° = shallow diagonal (the answer). */
const DERAILLEUR={
  id:'derailleur',title:'Bike derailleur',fig:'Rear derailleur · seen from behind',rotStep:90,dur:3,
  prompt:'Pull the cable and the derailleur should move the chain in to the biggest cog. Let go and it should spring back out to the smallest. The return spring is missing. (Rotate a part to choose which diagonal it spans.)',
  answer:{part:'ext',slot:'A',rot:90},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:196,y:224,w:40,h:30,name:'spliced into the cable'},{id:'A',label:'B',x:220,y:140,w:46,h:46,name:'across the parallelogram'}],
  parts:[
    {id:'ext',name:'Extension spring',desc:'Coils pressed tight, hooks on the ends. Pull it apart and it pulls back.',icon:()=>`<g transform="translate(40,28) rotate(90) scale(.66) translate(-40,-28)">${((()=>{let s=`<path d="M8 28 a5 5 0 1 1 5 5" fill="none" stroke="${C.ink}" stroke-width="2.2"/><path d="M72 28 a5 5 0 1 0 -5 5" fill="none" stroke="${C.ink}" stroke-width="2.2"/>`;for(let x=16;x<=62;x+=4)s+=`<line x1="${x}" y1="20" x2="${x+2}" y2="36" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/>`;return s;})())}</g>`},
    {id:'wire',name:'Steel wire',desc:'A thin, strong wire with an eye at each end. It can pull, but goes floppy if pushed.',icon:()=>`<g transform="translate(40,28) rotate(90) scale(.66) translate(-40,-28)">${(`<circle cx="10" cy="28" r="4" fill="none" stroke="${C.ink}" stroke-width="2"/><circle cx="70" cy="28" r="4" fill="none" stroke="${C.ink}" stroke-width="2"/>`+L(14,28,66,28,C.ink,1.6))}</g>`},
    {id:'rod',name:'Rigid rod',desc:'A solid steel rod with an eye at each end. It won’t stretch or shrink.',icon:()=>`<g transform="translate(40,28) rotate(90) scale(.66) translate(-40,-28)">${(`<rect x="12" y="24" width="56" height="8" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="10" cy="28" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/><circle cx="70" cy="28" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`)}</g>`},
    {id:'strut',name:'Push strut',desc:'A tube with cup ends that just rest on pins. It can push, but not pull.',icon:()=>`<g transform="translate(40,28) rotate(90) scale(.66) translate(-40,-28)"><rect x="16" y="23" width="48" height="10" rx="2" fill="#dccfb4" stroke="${C.ink}" stroke-width="2"/><path d="M10 21 a7 7 0 0 0 0 14" fill="none" stroke="${C.ink}" stroke-width="2.4"/><path d="M70 21 a7 7 0 0 1 0 14" fill="none" stroke="${C.ink}" stroke-width="2.4"/></g>`}
  ],
  evaluate(pl){
    if(pl.slot==='B') switch(pl.part){
      case 'ext':return {ok:false,key:'noreturn',msg:'Spliced into the cable, the spring is just a stretchy bit of cable. Nothing resists the pull, so the derailleur still moves in. But let go, and nothing pushes it back out.'};
      case 'wire':return {ok:false,key:'noreturn',msg:'Spliced into the cable, a wire is just more cable. The derailleur shifts in, and with no return spring it never comes back out.'};
      case 'rod':return {ok:false,key:'noreturn',msg:'Spliced into the cable, the rod just carries the pull. The derailleur shifts in, and with no return spring it never comes back out.'};
      default:return {ok:false,key:'nopull',msg:'A strut can only push. Spliced into the cable, its cup ends just pull apart, so the cable goes slack and the derailleur never moves.'};
    }
    const shallow=pl.rot%180===90;
    switch(pl.part){
      case 'ext':return shallow?{ok:true,key:'ok'}:{ok:false,key:'wrong',msg:'The steep diagonal gets <i>shorter</i> as the derailleur moves in, so a spring pulling it short drags the derailleur in to the biggest cog all by itself and holds it there. Letting the cable go changes nothing.'};
      case 'wire':return shallow?{ok:false,key:'jam',msg:'The shallow diagonal has to get longer for the derailleur to move in, and a taut wire won’t let it. The parallelogram is locked and the shifter won’t budge.'}
                               :{ok:false,key:'noreturn',msg:'The steep diagonal gets shorter as the derailleur moves in, so the wire just goes slack. It shifts in, and nothing brings it back out.'};
      case 'rod':return {ok:false,key:'jam',msg:'A rigid rod across either diagonal turns the parallelogram into two rigid triangles. It can’t move at all, so the shifter won’t budge.'};
      default:return shallow?{ok:false,key:'noreturn',msg:'The strut can push but not pull, and the shallow diagonal gets longer as the derailleur moves in. The strut just falls loose. The derailleur shifts in and never comes back.'}
                            :{ok:false,key:'jam',msg:'The steep diagonal has to get shorter for the derailleur to move in, and the strut won’t let it. It pushes back as hard as you pull, so the shifter won’t budge.'};
    }
  },
  why:'As the cable pulls the derailleur toward the big cogs, the parallelogram leans over and its shallow diagonal gets longer, stretching the spring across it. Let the cable go and the spring pulls that diagonal short again, sweeping the chain back out to the smallest cog. Real derailleurs tuck this spring inside the body, but it does the same job.',
  geo(u){const ph=rad(60-50*u),F1=[300,190],F2=[300,230];const M1=[F1[0]-110*Math.cos(ph),F1[1]-110*Math.sin(ph)],M2=[M1[0],M1[1]+40];
    const Q=[F2[0]+.4*(M2[0]-F2[0]),F2[1]+.4*(M2[1]-F2[1])];return {F1,F2,M1,M2,Q};},
  render(st){
    const {pl,out,t}=st;const key=out?out.key:null;let u=0,pull=0,cap='';const SH=Math.hypot(55,55),ST=Math.hypot(55,135);

      pull=t<1.5?ease(seg(t,.3,1.1)):1-ease(seg(t,1.5,1.9));

      else if(key==='jam'){u=(t>.3&&t<1.5)?.015*Math.abs(Math.sin(t*40)):0;pull=u;cap=t<.3?'Pulling the cable…':'The shifter won’t budge. The parallelogram is locked.';}
      else if(key==='nopull'){u=0;cap=t<.3?'Pulling the cable…':'The cable pulls apart at the strut. Nothing moves.';}
      else{u=t<1.5?pull:1;cap=t<1.1?'Pulling the cable…':t<1.5?'On the biggest cog.':'Let go… and it stays on the biggest cog.';}
    }
    const G=this.geo(u);
    /* drawn shifted 30px left to centre it; slot boxes above are already shifted */
    let s='<g transform="translate(-30,0)">';
    /* frame dropout + axle + cassette */
    s+=`<path d="M282 26 H346 V110 L330 140 V184 H312 V176 L296 140 V86 Z" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/>`;
    s+=L(150,56,350,56,C.ink,1.2,'5 3');
    const cogs=[];for(let i=0;i<7;i++){const x=192+i*53/6,r=44-i*4.6;cogs.push([x,r]);s+=`<rect x="${f(x-2)}" y="${f(56-r)}" width="4" height="${f(2*r)}" rx="1.2" fill="${C.steel}" stroke="${C.ink}" stroke-width="1"/>`;}
    s+=T(60,40,'CASSETTE')+T(60,52,'(SEEN FROM BEHIND)')+L(132,46,186,50,C.muted,.8,'2 2')+T(192,8,'BIG',{a:'middle'})+T(245,8,'SMALL',{a:'middle'});
    /* chain + cage */

    s+=L(cog[0],56+cog[1],px,py+18,C.ink,3)+L(cog[0],56+cog[1],px,py+18,'#8a8174',1.2,'2 2');
    s+=`<rect x="${f(px-5)}" y="${f(py+4)}" width="10" height="66" rx="5" fill="${C.ghost}" stroke="${C.ink}" stroke-width="1.6"/><circle cx="${f(px)}" cy="${f(py+24)}" r="6" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.4"/><circle cx="${f(px)}" cy="${f(py+60)}" r="6" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.4"/>`;
    /* parallelogram */
    s+=`<rect x="294" y="180" width="14" height="60" rx="3" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.8"/>`;
    s+=`<rect x="${f(G.M1[0]-7)}" y="${f(G.M1[1]-8)}" width="14" height="56" rx="3" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.8"/>`;
    [[G.F1,G.M1],[G.F2,G.M2]].forEach(([a,b])=>{s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.ink}" stroke-width="9" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.steel}" stroke-width="5" stroke-linecap="round"/>`;});
    [G.F1,G.F2,G.M1,G.M2].forEach(p=>{s+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="3.4" fill="${C.card}" stroke="${C.ink}" stroke-width="1.4"/>`;});
    /* cable */
    const stop=[215,284];let Q=G.Q;
    s+=`<line x1="96" y1="284" x2="211" y2="284" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/><rect x="207" y="279" width="10" height="10" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.2"/>`;
    const lerp2=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
    if(pl&&pl.slot==='B'){const P1=lerp2(stop,Q,.3),P2=lerp2(stop,Q,.72);const dir=[(Q[0]-stop[0]),(Q[1]-stop[1])],dl=Math.hypot(...dir),ux=dir[0]/dl,uy=dir[1]/dl;
      if(key==='nopull'||(!out&&pl.part==='strut')){const g=out?14*ease(seg(t,.3,1.1))*(t<1.5?1:1-seg(t,1.5,1.9)):0;const P1b=[P1[0]-ux*g,P1[1]-uy*g];

  /* draw a part between points a and b; len0 = its own length (for wire/strut when the gap changes) */
  span(id,a,b,onDiag,len0){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;let s='';
    if(id==='ext'){s+=zig(a[0]+ux*6,a[1]+uy*6,b[0]-ux*6,b[1]-uy*6,Math.max(5,Math.round((len0||30)/7)),8,C.acc,2.2);s+=L(a[0],a[1],a[0]+ux*6,a[1]+uy*6,C.acc,2.2)+L(b[0]-ux*6,b[1]-uy*6,b[0],b[1],C.acc,2.2);}

      else s+=L(a[0],a[1],b[0],b[1],C.acc,1.8);}
    else if(id==='rod') s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.acc}" stroke-width="7" stroke-linecap="round"/><line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${C.part}" stroke-width="3.5" stroke-linecap="round"/>`;
    else{let L0=onDiag&&len0?Math.min(len0,d):d;let e=[a[0]+ux*L0,a[1]+uy*L0];
      if(onDiag&&len0&&d>len0+1){const drop=Math.min(14,(d-len0));e=[a[0]+ux*L0,a[1]+uy*L0+drop];}

    return s;}
};

/* ============ batch B: zipper ============ */
/* MP-MECH id=zipper const=ZIPPER */
/* ============ B1. ZIPPER SLIDER ============
   Physics (simplified): closing works because the slider's Y-channel converges.
   The wedge ("diamond") at the wide end splits the track into two angled
   channels; the side walls taper toward the narrow end and press the rows
   together so each tooth's head drops into the gap opposite. A slider whose
   jaws have spread is the classic "zipper splits behind the slider" fault. */
const ZIPPER={
  id:'zipper',title:'Zipper slider',fig:'Zipper · top view, slider see-through',rotStep:180,dur:3,
  prompt:'Pull the tab toward the open end and the two rows of teeth should lock together behind it. The slider is missing.',
  answer:{part:'yslider',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:104,y:110,w:84,h:80,name:'over both rows, where they meet'},{id:'B',label:'B',x:226,y:62,w:66,h:54,name:'on the top row only'}],
  parts:[
    {id:'yslider',name:'Y-slider',desc:'A wedge splits its wide end into two channels. The walls taper to a narrow back end.',icon:()=>`<g transform="translate(44,28) scale(.78)">${ZIPPER.shape('yslider',C.ink,C.steel)}</g>`},
    {id:'worn',name:'Worn slider',desc:'The same Y shape as a new slider, but its jaws have been bent slightly apart.',icon:()=>`<g transform="translate(44,28) scale(.78)">${ZIPPER.shape('worn',C.ink,C.steel)}</g>`},
    {id:'sleeve',name:'Straight sleeve',desc:'A box with two parallel channels. Its walls stay the same width.',icon:()=>`<g transform="translate(44,28) scale(.78)">${ZIPPER.shape('sleeve',C.ink,C.steel)}</g>`},
    {id:'wedge',name:'Plain wedge',desc:'Just the pointed divider from a slider, nothing around it.',icon:()=>`<g transform="translate(36,28) scale(.9)">${ZIPPER.shape('wedge',C.ink,C.steel)}</g>`}
  ],
  /* shapes are drawn with the slider's throat at 0,0; rot 0 = wide end facing +x (the open teeth) */
  shape(id,st,fill,op=1){
    const tab=`<rect x="-28" y="-5" width="30" height="10" rx="5" fill="${C.card}" stroke="${st}" stroke-width="1.6"/><circle cx="-21" cy="0" r="2.2" fill="none" stroke="${st}" stroke-width="1.2"/>`;
    const dia=`<polygon points="30,-13 7,0 30,13" fill="${C.steelD}" stroke="${st}" stroke-width="1.8" stroke-linejoin="round"/>`;
    if(id==='yslider') return `<polygon points="-38,-11 -8,-14 30,-26 30,26 -8,14 -38,11" fill="${fill}" fill-opacity="${op}" stroke="${st}" stroke-width="2.2" stroke-linejoin="round"/>${dia}${tab}`;
    if(id==='worn') return `<polygon points="-38,-18 -8,-19 30,-27 30,27 -8,19 -38,18" fill="${fill}" fill-opacity="${op}" stroke="${st}" stroke-width="2.2" stroke-linejoin="round"/>${dia}${tab}<path d="M-42,-18 l-5,-4 M-42,18 l-5,4" stroke="${st}" stroke-width="1.4"/>`;
    if(id==='sleeve') return `<rect x="-38" y="-22" width="68" height="44" rx="2" fill="${fill}" fill-opacity="${op}" stroke="${st}" stroke-width="2.2"/><line x1="-38" y1="-2" x2="30" y2="-2" stroke="${st}" stroke-width="1" stroke-dasharray="3 2"/><line x1="-38" y1="2" x2="30" y2="2" stroke="${st}" stroke-width="1" stroke-dasharray="3 2"/>${tab}`;
    return `<polygon points="34,-14 2,0 34,14" fill="${fill}" stroke="${st}" stroke-width="2.2" stroke-linejoin="round"/>`;
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'onerow',msg:'Threaded onto one row only, the slider never catches the other row’s teeth. It slides along one side and nothing zips together.'};
    const back=pl.rot%360!==0;
    if(pl.part==='sleeve') return {ok:false,key:'parallel',msg:'A straight sleeve has parallel walls, so it never pushes the rows toward each other. The teeth slide through side by side without hooking together.'};
    if(pl.part==='wedge') return {ok:false,key:'spread',msg:'A wedge on its own is only half a slider. It pushes teeth apart, which is the unzipping job. With no tapered walls to squeeze the rows together, nothing closes.'};
    if(back) return {ok:false,key:'jam',msg:'Backwards, the slider’s narrow end faces the open teeth. Both rows can’t squeeze into that small opening at once, so it jams. A slider only zips with its wedge end facing the open rows.'};
    if(pl.part==='worn') return {ok:false,key:'loose',msg:'This slider has been sprung open. Its walls stop a little too far apart to press the teeth fully into each other, so the rows meet and then pop apart behind it. (Squeezing a worn slider gently with pliers often fixes a splitting zipper.)'};
    return {ok:true,key:'ok'};
  },
  why:'The wedge at the slider’s wide end keeps the two rows apart as they come in. The side walls then taper toward the narrow end and press the rows together at an angle, so each tooth’s bump drops into the hollow of the tooth opposite and locks. Pull the other way and the wedge pries them apart again.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const S0=150,run=ease(seg(t,.3,2.3));
    const sp=d=>d<=0?0:60*(1-Math.exp(-d/110));
    let Sx=S0,mode='none',sh=0;
    if(k==='ok'||k==='loose'||k==='parallel'||k==='spread'){Sx=S0+170*run;mode=k==='ok'?'ok':k==='loose'?'loose':'par';}
    if(k==='jam'){sh=(t>.3&&t<2.5)?Math.abs(Math.sin(t*42))*2.2:0;Sx=S0+sh;}
    const gap=x=>{
      if(mode==='ok') return sp(x-Sx);
      if(mode==='loose'){if(x>=Sx)return sp(x-Sx);if(x<=S0)return 0;return Math.min(9*ease((Sx-30-x)/22),9*ease((x-S0)/16));}
      if(mode==='par'){const base=7*ease((x-S0)/14);return x>=Sx?base+sp(x-Sx):base;}
      return sp(x-S0);
    };
    if(out){cap=t<.3?'Pulling the tab…':({ok:t<2.3?'The tapered walls press the rows together…':'Zipped. The teeth are locked together. ✓',loose:'The teeth meet inside the slider, then pop apart behind it.',parallel:'The rows slide through side by side and never hook.',spread:'The wedge only pushes the rows apart. Nothing closes.',jam:'Jammed. Both rows can’t fit into the narrow end.',onerow:'It slides along one row. Nothing zips.'})[k];}
    let s='';
    /* tapes */
    const xs=[];for(let x=6;x<=398;x+=6)xs.push(x);
    const band=(sg)=>{const inn=xs.map(x=>[x,150+sg*(gap(x)+9)]),outr=xs.map(x=>[x,150+sg*(gap(x)+42)]).reverse();return `<polygon points="${inn.concat(outr).map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="#cfd9e3" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;};
    s+=band(-1)+band(1);
    /* stitching */
    s+=`<polyline points="${xs.map(x=>f(x)+','+f(150-gap(x)-34)).join(' ')}" fill="none" stroke="${C.blue}" stroke-width=".8" stroke-dasharray="3 3" opacity=".6"/><polyline points="${xs.map(x=>f(x)+','+f(150+gap(x)+34)).join(' ')}" fill="none" stroke="${C.blue}" stroke-width=".8" stroke-dasharray="3 3" opacity=".6"/>`;
    /* teeth */
    for(let i=0;i<32;i++){const xu=16+12*i,xl=22+12*i,gu=gap(xu),gl=gap(xl);
      s+=`<rect x="${f(xu-3)}" y="${f(150-gu-11)}" width="6" height="16" rx="1.6" fill="${C.steel}" stroke="${C.ink}" stroke-width="1"/>`;
      s+=`<rect x="${f(xl-3)}" y="${f(150+gl-5)}" width="6" height="16" rx="1.6" fill="${C.steel}" stroke="${C.ink}" stroke-width="1"/>`;}
    /* slider */
    if(pl){
      if(pl.slot==='A'){s+=`<g transform="translate(${f(Sx)},150) rotate(${pl.rot})">${this.shape(pl.part,C.acc,C.part,.9)}</g>`;
        s+=L(Sx-6,96,Sx+30,96,C.blue,1.6)+`<polygon points="${f(Sx+34)},96 ${f(Sx+27)},92 ${f(Sx+27)},100" fill="${C.blue}"/>`+T(Sx-8,91,'PULL',{fill:C.blue,w:600});}
      else{const xb=258+(k==='onerow'?75*run:0),d=xb-S0,yb=150-sp(d)-3,ang=-Math.atan(60/110*Math.exp(-d/110))*180/Math.PI;
        s+=`<g transform="translate(${f(xb)},${f(yb)}) rotate(${f(ang)}) scale(.6) rotate(${pl.rot})">${this.shape(pl.part,C.acc,C.part,.9)}</g>`;}
    }
    if(k==='jam'&&t>.4) s+=`<g transform="translate(${f(Sx+34)},150)"><polygon points="0,-12 3,-4 11,-6 5,1 10,9 1,5 -3,12 -4,4 -12,4 -5,-2 -9,-10 -1,-5" fill="${C.acc}" stroke="${C.ink}" stroke-width="1"/></g>`;
    s+=T(14,212,'CLOSED')+T(14,221,'(LOCKED TEETH)',{size:7})+T(386,276,'OPEN END →',{a:'end'})+T(14,98,'TAPE')+L(24,102,30,112);
    s+=L(64,144,64,124)+T(52,120,'TEETH');

/* ============ batch B: tape ============ */
/* MP-MECH id=tape const=TAPE */
/* ============ B2. TAPE MEASURE ============
   Physics (simplified): a flat spiral ("clock") spring has its inner end hooked
   to the fixed axle and its outer end to the spool. Pulling out the blade turns
   the spool many times and winds the spring tighter; the lock pinches the blade
   against the case. A torsion spring only tolerates a fraction of a turn. */
const TAPE={
  id:'tape',title:'Tape measure',fig:'Tape measure · cutaway',rotStep:0,dur:4.2,
  prompt:'Pull the blade out, slide the lock on, let go, then unlock. The blade should hold while locked and zip back in once unlocked. One spring is missing.',
  answer:{part:'spiral',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:114,y:108,w:64,h:64,name:'in the hub, around the fixed axle'},{id:'B',label:'B',x:208,y:180,w:48,h:40,name:'behind the brake'}],
  parts:[
    {id:'spiral',name:'Spiral spring',desc:'A long flat steel strip coiled like a watch spring, hooked at both ends.',icon:()=>TAPE.spiral(40,28,4,19,3.2,0,C.ink,1.8)},
    {id:'tors',name:'Torsion spring',desc:'A steel coil with two straight legs. Twist the legs around a pin and it twists back.',icon:()=>torsion(40,28,0,C.ink)},
    {id:'comp',name:'Compression spring',desc:'A steel coil spring. Squeeze its ends together and it pushes back, hard.',icon:()=>zig(10,28,70,28,6,22,C.ink,2.4)},
    {id:'washer',name:'Flat washer',desc:'A thin steel ring that fills a gap.',icon:()=>`<circle cx="40" cy="28" r="18" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`}
  ],
  spiral(cx,cy,r0,r1,turns,wind,col,sw){
    const n=90;let d='';
    for(let i=0;i<=n;i++){const u=i/n,r=r0+(r1-r0)*u,a=rad(-90+u*turns*360+u*wind);d+=(i?'L':'M')+f(cx+Math.cos(a)*r)+','+f(cy+Math.sin(a)*r);}
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  },
  evaluate(pl){
    const A=pl.slot==='A';
    switch(pl.part){
      case 'spiral':return A?{ok:true,key:'ok'}:{ok:false,key:'stayout',msg:'A spiral spring only stores energy when one end is hooked to the turning spool and the other to the fixed axle, so pulling the blade winds it up. Behind the brake it’s just squashed in a slot. Nothing winds it, so nothing pulls the blade back.'};
      case 'tors':return A?{ok:false,key:'bent',msg:'A torsion spring is made to twist less than one turn. Pulling out the blade turns the spool many times, so the spring is twisted far past its limit and bends for good. Nothing pulls the blade back.'}
                          :{ok:false,key:'stayout',msg:'Behind the brake the torsion spring has no pin to twist around, so it just sits there. And with no spring in the hub, nothing pulls the blade back in.'};
      case 'comp':return A?{ok:false,key:'stayout',msg:'A compression spring pushes along its length. It can’t be wound up, so in the hub it just rides round with the spool. Nothing pulls the blade back in.'}
                          :{ok:false,key:'stuck',msg:'Behind the brake, the spring presses the brake onto the blade all the time. The blade drags out against it, unlocking does nothing, and with no spring in the hub nothing would pull it back anyway.'};
      default:return A?{ok:false,key:'stayout',msg:'A washer stores no energy. With nothing in the hub to wind up, the blade stays out when you unlock.'}
                      :{ok:false,key:'stayout',msg:'Behind the brake the washer just fills space. The lock still works, but there’s no spring in the hub, so the blade stays out when you unlock.'};
    }
  },
  why:'The spiral spring’s inner end hooks onto the fixed axle and its outer end onto the spool. Pulling out the blade turns the spool many times and winds the spring tighter. The lock pinches the blade so it can’t move. Slide it off and the wound spring spins the spool back, reeling the blade in.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    let len=0,lk=0,hand=false,jit=0;
    if(out){
      hand=t>.05&&t<1.8;
      lk=ease(seg(t,1.35,1.6))-ease(seg(t,2.4,2.6));
      if(k==='stuck'){len=62*ease(seg(t,.2,1.6));jit=(t>.2&&t<1.6)?Math.sin(t*55)*1.5:0;}
      else{len=110*ease(seg(t,.2,1.2));if(k==='ok')len*=1-ease(seg(t,2.6,3.2));}
      const c={ok:'The spring reels the blade back in. ✓',stayout:'Unlocked. Nothing pulls it back, so the blade stays out.',stuck:'Unlocked, but the brake is still pressing. The blade stays out.',bent:'Unlocked. The bent spring can’t pull, so the blade stays out.'};
      cap=t<1.2?(k==='stuck'?'Pulling… it drags. The brake is pressing on the blade.':k==='bent'&&t>.6?'Pulling… the torsion spring is twisting far past its limit.':'Pulling the blade out…'):t<1.6?'Sliding the lock on…':t<2.4?'Let go. The lock holds the blade.':t<2.6?'Unlocking…':c[k];
    }
    const brakeOn=(pl&&pl.slot==='B'&&pl.part==='comp')?1:lk;
    const cx=146,cy=140,R=Math.sqrt(42*42+(86*86-42*42)*(1-len/130)),phi=-len*2.4+jit;
    let s='';
    /* case */
    s+=`<rect x="36" y="36" width="226" height="216" rx="44" fill="url(#hatch)" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="94" fill="#f8f4ea" stroke="${C.ink}" stroke-width="1.5"/><rect x="150" y="230" width="113" height="13" fill="#f8f4ea"/>`+L(150,243,262,243,C.ink,1.5)+L(205,230,262,230,C.ink,1.5);
    /* coil + drum */
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(R)}" fill="#e9c46a" stroke="${C.ink}" stroke-width="1.8"/>`;
    for(let r=46;r<R-2;r+=6)s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.ink}" stroke-opacity=".25" stroke-width=".8"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="41" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    for(let i=0;i<3;i++){const a=rad(phi+i*120);s+=`<circle cx="${f(cx+Math.cos(a)*36)}" cy="${f(cy+Math.sin(a)*36)}" r="2" fill="${C.ink}"/>`;}
    /* blade: from bottom of coil to mouth and out */
    const bx=262+len;
    s+=`<polyline points="${cx},${f(cy+R)} 205,236.5 ${f(bx)},236.5" fill="none" stroke="${C.ink}" stroke-width="5.5" stroke-linejoin="round"/><polyline points="${cx},${f(cy+R)} 205,236.5 ${f(bx)},236.5" fill="none" stroke="#e9c46a" stroke-width="3" stroke-linejoin="round"/>`;
    for(let x=bx-6;x>262;x-=8)s+=L(x,234.5,x,236.5,C.ink,1);
    s+=`<rect x="${f(bx)}" y="226" width="5" height="17" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(hand){s+=L(bx+8,234,bx+34,234,C.blue,1.6)+`<polygon points="${f(bx+38)},234 ${f(bx+31)},230 ${f(bx+31)},238" fill="${C.blue}"/>`+T(bx+8,226,'PULL',{fill:C.blue,w:600});}
    /* lock + brake */
    const sd=4*Math.max(brakeOn,0);
    s+=`<rect x="214" y="185" width="40" height="5" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s+=L(234,150+sd,234,222+sd,C.ink,3);
    s+=`<rect x="220" y="${f(222+sd)}" width="28" height="9" rx="1.5" fill="${C.rub}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="226" y="${f(143+sd)}" width="40" height="13" rx="3" fill="${lk>.5?C.blue:C.steel}" stroke="${C.ink}" stroke-width="1.8"/>`;
    s+=T(270,150,'LOCK')+T(270,159,lk>.5?'ON ↓':'off',{fill:lk>.5?C.blue:C.muted,w:lk>.5?600:400});
    s+=L(250,227,276,210)+T(278,210,'BRAKE');
    /* hub: fixed axle */
    s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="2"/><rect x="${cx-2}" y="${cy-11}" width="4" height="5" fill="${C.ink}"/>`;
    /* the placed part */
    if(pl){const A=pl.slot==='A';
      if(pl.part==='spiral') s+=A?this.spiral(cx,cy,11,38,3.5,phi,C.acc,2):this.spiral(234,203,3,13,2.2,0,C.acc,1.8);
      else if(pl.part==='tors'){if(A){const tw=Math.max(phi,-95);s+=torsion(cx,cy,-35+tw,C.acc);if(phi<-95)s+=`<g transform="translate(${cx+18},${cy-26})"><polygon points="0,-9 2,-3 8,-4 4,1 7,7 1,4 -2,9 -3,3 -9,3 -4,-1 -7,-7 -1,-4" fill="${C.acc}" stroke="${C.ink}" stroke-width=".8"/></g>`+T(cx,cy-46,'BENT',{fill:C.acc,w:600,a:'middle'});}
        else s+=`<g transform="translate(234,203) scale(.55)">${torsion(0,0,0,C.acc)}</g>`;}
      else if(pl.part==='comp'){if(A){const a=rad(-40+phi);s+=zig(cx+Math.cos(a)*11,cy+Math.sin(a)*11,cx+Math.cos(a)*39,cy+Math.sin(a)*39,4,12);}else s+=zig(234,191,234,221+sd,4,16);}
      else s+=A?`<circle cx="${cx}" cy="${cy}" r="17" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="9" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="2"/>`:`<rect x="221" y="191" width="26" height="5" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
    }
    s+=T(40,30,'CASE')+T(30,276,'BLADE COIL ON SPOOL')+L(80,268,104,212)+T(170,96,'SPOOL')+L(176,99,170,112)+T(60,96,'AXLE')+T(60,105,'(FIXED)',{size:7})+L(88,104,137,136);
    if(k==='ok'&&t>3.25) s+=T(300,262,'✓ REELED IN',{fill:C.blue,w:600,a:'middle',size:9});
    return [s,cap];
  }
};

/* ============ batch B: bell ============ */
/* MP-MECH id=bell const=BELL */
/* ============ B3. BICYCLE BELL ============
   Physics (simplified): the lever's catch bends a springy striker back, then
   slips off. The spring flings the hammer into the dome; it rebounds at once
   and settles clear, so the dome rings freely. Hard + heavy + brief contact =
   ring. Soft, light, or never released = no ring. */
const BELL={
  id:'bell',title:'Bicycle bell',fig:'Bell · top view, dome cut away',rotStep:180,dur:3,
  prompt:'Press the thumb lever and the bell should ring with a clear “ding”. The striker that hits the dome is missing.',
  answer:{part:'spring',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:158,y:102,w:58,h:32,name:'on the post near the centre'},{id:'A',label:'B',x:116,y:211,w:58,h:32,name:'on the post by the rim'}],
  C0:[165,150],
  parts:[
    {id:'spring',name:'Spring striker',desc:'A steel hammer on the end of a springy wire.',icon:()=>BELL.striker('spring',62,30,0,0,C.ink,1)},
    {id:'rigid',name:'Stiff striker',desc:'A steel hammer on a short, stiff steel arm that doesn’t bend.',icon:()=>BELL.striker('rigid',62,30,0,0,C.ink,1)},
    {id:'rubber',name:'Rubber striker',desc:'A rubber hammer head on the end of a springy wire.',icon:()=>BELL.striker('rubber',62,30,0,0,C.ink,1)},
    {id:'bare',name:'Bare spring wire',desc:'Just the springy wire, with nothing on the end.',icon:()=>BELL.striker('bare',62,30,0,0,C.ink,1)}
  ],
  /* post at (px,py); wire runs toward -x (rot 0) for 38 units; dy = sideways bend of the tip (+ = down) */
  striker(id,px,py,rot,dy,st,sc){
    const H=[-38,dy],M=[-19,dy*.35];let s='';
    if(id==='rigid') s+=`<line x1="0" y1="0" x2="-38" y2="0" stroke="${st}" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="0" x2="-38" y2="0" stroke="${C.steel}" stroke-width="2.5" stroke-linecap="round"/>`;
    else s+=`<path d="M0,0 Q${f(M[0])},${f(M[1])} ${f(H[0])},${f(H[1])}" fill="none" stroke="${st}" stroke-width="2"/>`;
    if(id==='spring'||id==='rigid') s+=`<circle cx="${f(H[0])}" cy="${f(H[1])}" r="7" fill="${C.steelD}" stroke="${st}" stroke-width="2"/><path d="M${f(H[0]-4)},${f(H[1]-3)} a5 5 0 0 1 4 -3" stroke="#fff" stroke-width="1.6" fill="none"/>`;
    else if(id==='rubber') s+=`<circle cx="${f(H[0])}" cy="${f(H[1])}" r="7" fill="${C.rub}" stroke="${st}" stroke-width="2"/>`;
    else s+=`<circle cx="${f(H[0])}" cy="${f(H[1])}" r="1.8" fill="${st}"/>`;
    s+=`<circle r="4.5" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.8"/>`;
    return `<g transform="translate(${f(px)},${f(py)}) rotate(${rot}) scale(${sc})">${s}</g>`;
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'reach',msg:'On the inner post the striker is out of the lever’s reach, and far from the dome anyway. Press the lever and nothing touches it, so the bell stays silent.'};
    if(pl.rot%360!==0) return {ok:false,key:'reach',msg:'Turned around, the striker points the other way, away from the lever’s catch. Press the lever and nothing touches it, so the bell stays silent.'};
    switch(pl.part){
      case 'spring':return {ok:true,key:'ok'};
      case 'rigid':return {ok:false,key:'blocked',msg:'A stiff striker can’t bend, so the lever’s catch can’t pull it back to cock it. The lever jams against it and nothing strikes the dome.'};
      case 'rubber':return {ok:false,key:'thud',msg:'Rubber squashes when it hits. The blow is soft and slow, and the hammer stays against the steel long enough to damp it. You get a dull thunk, not a ring.'};
      default:return {ok:false,key:'tick',msg:'With no weight on the end, the wire carries almost no energy into the dome. It taps a faint tick and the bell barely sounds.'};
    }
  },
  why:'The lever’s catch bends the springy striker back toward the middle, then slips off it. The spring flings the hammer into the dome, and the same springiness pulls it straight back off, so the steel is free to vibrate. A hard, heavy hammer that touches for only an instant makes the dome ring.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const [cx,cy]=this.C0;
    /* lever angle (deg, negative = pressed), striker tip bend, ring amplitude */
    let th=0,dy=0,amp=0,sound='';
    const press=ease(seg(t,.25,.6)),rel=ease(seg(t,1.05,1.25)),TH=-9.7;
    if(out){
      if(k==='blocked'){th=TH*.12*Math.abs(Math.sin(seg(t,.25,1.4)*Math.PI*6))*(t>.25&&t<1.4?1:0);}
      else th=TH*(press-rel*(t>1.05?1:0));
      const hits=k==='ok'||k==='thud'||k==='tick';
      if(hits){
        if(t<.6) dy=-22*press;
        else{const tau=t-.6,w=2*Math.PI*6,th0=Math.acos(-5.7/22)/w;
          if(tau<th0) dy=-22*Math.cos(w*tau);
          else{const u=tau-th0;const keep=k==='thud'?.35:1;dy=5.7*keep*Math.exp(-(k==='thud'?9:4)*u)*Math.cos(w*u);if(k==='thud'&&u<.08)dy=5.7-u*10;}
          const u=tau-th0;
          if(u>0){const a0=k==='ok'?3.2:k==='tick'?.5:.25;amp=a0*Math.exp(-(k==='ok'?1.1:6)*u);sound=k==='ok'?'DING!':k==='tick'?'tick':'thunk';if(k!=='ok'&&u>.6)sound='';}
        }
      }
      cap=({ok:t<.25?'Ready…':t<.6?'Pressing the lever. The catch bends the striker back…':t<1.1?'Released! The hammer flicks out, hits the dome and bounces clear.':'Ding! The dome rings freely. ✓',
        blocked:'The stiff striker won’t bend, so the lever won’t move.',thud:t<.6?'Pressing the lever…':'Thunk. The rubber hammer deadens the hit.',tick:t<.6?'Pressing the lever…':'Tick. The bare wire is too light to make the dome ring.',reach:'The lever moves, but its catch never touches the striker.'})[k];
    }
    let s='';
    /* handlebar behind */
    s+=`<rect x="0" y="252" width="400" height="34" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/>`+T(330,248,'HANDLEBAR');
    /* base plate */
    s+=`<circle cx="${cx}" cy="${cy}" r="96" fill="url(#hatch)" stroke="none"/>`;
    /* dome rim (vibrating) */
    const ring=(r)=>{let d='';for(let i=0;i<=72;i++){const a=i/72*2*Math.PI,rr=r+amp*Math.cos(2*a)*Math.cos(t*2*Math.PI*9);d+=(i?'L':'M')+f(cx+Math.cos(a)*rr)+','+f(cy+Math.sin(a)*rr);}return d+'Z';};
    s+=`<path d="${ring(104)}" fill="none" stroke="${C.steel}" stroke-width="12"/><path d="${ring(110)}" fill="none" stroke="${C.ink}" stroke-width="2"/><path d="${ring(98)}" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="10" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="${C.ink}"/>`;
    /* posts */
    s+=`<circle cx="165" cy="227" r="3" fill="${C.ink}"/><circle cx="205" cy="118" r="3" fill="${C.ink}"/>`;
    /* thumb lever: pivot P, catch tip Q, thumb tab */
    const P=[100,200],a=rad(th),rp=(x,y)=>{const dx=x-P[0],dy2=y-P[1];return [P[0]+dx*Math.cos(a)-dy2*Math.sin(a),P[1]+dx*Math.sin(a)+dy2*Math.cos(a)];};
    const Q=rp(150,233),Tb=rp(14,248),Qh=rp(150,226);
    s+=`<polyline points="${f(Tb[0])},${f(Tb[1])} ${P[0]},${P[1]} ${f(Q[0])},${f(Q[1])}" fill="none" stroke="${C.ink}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${f(Tb[0])},${f(Tb[1])} ${P[0]},${P[1]} ${f(Q[0])},${f(Q[1])}" fill="none" stroke="${C.steelD}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    s+=`<polygon points="${f(Q[0]-3)},${f(Q[1]+2)} ${f(Qh[0])},${f(Qh[1])} ${f(Q[0]+4)},${f(Q[1]+1)}" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
    s+=`<circle cx="${P[0]}" cy="${P[1]}" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<rect x="${f(Tb[0]-10)}" y="${f(Tb[1]-8)}" width="20" height="16" rx="4" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" transform="rotate(${f(th-29)} ${f(Tb[0])} ${f(Tb[1])})"/>`;
    if(out&&t>.15&&t<1.05&&k!=='blocked') s+=`<polygon points="${f(Tb[0]+4)},${f(Tb[1]+22)} ${f(Tb[0]-2)},${f(Tb[1]+13)} ${f(Tb[0]+8)},${f(Tb[1]+13)}" fill="${C.blue}"/>`+T(Tb[0]+12,Tb[1]+22,'PRESS',{fill:C.blue,w:600});
    /* striker */
    if(pl){const A=pl.slot==='A';s+=this.striker(pl.part,A?165:205,A?227:118,pl.rot,A&&pl.rot===0?dy:0,C.acc,1);}
    /* sound */
    if(sound){const big=k==='ok';s+=T(18,42,sound,{fill:big?C.blue:C.muted,w:600,size:big?16:10});
      if(big)for(let i=0;i<3;i++){const ph=frac(t*1.6+i/3);s+=`<path d="${'M'+f(cx-Math.cos(rad(40))*(114+ph*40))+','+f(cy-Math.sin(rad(40))*(114+ph*40))+' A'+f(114+ph*40)+','+f(114+ph*40)+' 0 0 1 '+f(cx-Math.cos(rad(80))*(114+ph*40))+','+f(cy-Math.sin(rad(80))*(114+ph*40))}" fill="none" stroke="${C.blue}" stroke-width="1.6" opacity="${f(1-ph)}"/>`;}}
    s+=T(286,62,'DOME RIM')+L(284,64,262,82)+T(186,154,'BOLT',{size:7})+T(52,186,'PIVOT')+T(4,232,'THUMB',{size:7})+T(4,241,'LEVER',{size:7})+T(124,262,'CATCH',{size:7})+L(140,256,149,238);
    return [s,cap];
  }
};

    {id:'washer',name:'Flat washer',desc:'A thin, flat steel ring that fills the gap between two parts.',icon:()=>`<circle cx="40" cy="28" r="18" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="7" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`}

  /* local coords: fulcrum at 0,0, handles toward -x, jaws toward +x, top half at y<0 */
  half(fill,st){
    return `<path d="M-110,-14 L-9,-2 A9,9 0 0 0 9,-2 L88,-1.5 A6.5,6.5 0 0 0 100,-1.5 L128,-1 L130,-6 L128,-10 L40,-17 L-110,-26 Z" fill="${fill}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><line x1="-100" y1="-20" x2="20" y2="-12" stroke="${st}" stroke-opacity=".18"/><line x1="-60" y1="-22" x2="80" y2="-9" stroke="${st}" stroke-opacity=".12"/>`;
  },
  /* one leg of the torsion spring (drawn per half), plus coil */
  leg(cx,rot,col){
    if(rot%360===0) return cx===0?`<polyline points="0,-6 9,-19 54,-17.6 56,-13" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`:`<polyline points="${cx},-6 ${cx+6},-27 ${cx+48},-24 ${cx+50},-20" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    return cx===0?`<polyline points="0,-6 -9,-24 -54,-25 -56,-21" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`:`<polyline points="${cx},-6 ${cx-12},-16 ${cx-46},-16" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  },
  spring(rot,col,cx){
    return this.leg(cx,rot,col)+`<g transform="scale(1,-1)">${this.leg(cx,rot,col)}</g><circle cx="${cx}" cy="0" r="6.5" fill="none" stroke="${col}" stroke-width="2.6"/><circle cx="${cx}" cy="0" r="3" fill="none" stroke="${col}" stroke-width="1.6"/>`;
  },
  evaluate(pl){
    const A=pl.slot==='A',flip=pl.rot%360!==0;
    switch(pl.part){
      case 'tors':
        if(A&&!flip) return {ok:true,key:'ok'};
        if(A) return {ok:false,key:'open',msg:'With its legs toward the handles, the spring squeezes the handles together, and that levers the jaws open. The peg sits there gaping and drops off the line at the first tug.'};
        if(!flip) return {ok:false,key:'pinch',msg:'With the coil at the far end, that’s where the halves hinge. Squeezing the handles only pinches them closer to the hinge. It can’t lever the jaws open, so you can’t get the peg onto the line.'};
        return {ok:false,key:'apart',msg:'At the handle end with its legs pointing off the end, the spring presses on nothing. Nothing holds the halves together at the notches, so they fall apart.'};
      case 'comp':return {ok:false,key:'apart',msg:A?'A compression spring pushes things apart. In the notches it shoves the halves away from each other, and nothing holds them together. The peg falls apart in your hand.':'Between the handles it would push them apart and close the jaws, but nothing holds the halves together at the notches, so the spring just pops them apart.'};
      case 'pin':return {ok:false,key:'floppy',msg:A?'A pin makes a hinge but stores no energy. The jaws open fine, but nothing closes them again, so the peg hangs loose and falls off at the first tug.':'Pinned at the handle end, the halves hinge there, and there’s no spring to squeeze the jaws shut. The peg hangs loose and falls off at the first tug.'};
      default:return {ok:false,key:'apart',msg:'A washer just takes up space. Nothing holds the halves together or squeezes the jaws, so the peg falls apart in your hand.'};
    }
  },
  why:'The torsion spring does two jobs. Its coil sits in the notches and is the hinge the two halves rock on, and its legs press on the outside of the jaws, squeezing them shut. Squeeze the handles and the halves pivot on the coil, opening the jaws against the spring. Let go and the spring snaps them closed on the line.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const amax=7,amin=.9;let a=0,off=0,sep=0,fall=0,fx=0,fr=0,sway=0;
    const sq=ease(seg(t,.2,.6)),down=ease(seg(t,.7,1.3)),rl=ease(seg(t,1.4,1.6));
    const gaping=pl&&pl.part==='tors'&&pl.slot==='A'&&pl.rot%360!==0;

    if(out){

      if(k==='ok'){a=t<1.4?amax*sq:lerp(amax,amin,rl);}
      else if(k==='open'){a=amax;}
      else if(k==='floppy'){a=t<1.4?amax*sq:lerp(amax,4.5,rl);}
      else if(k==='pinch'){a=0;off=Math.min(-52*(1-down),-36)-(t>1.1&&t<1.6?3*Math.abs(Math.sin((t-1.1)*22)):0);}
      else if(k==='apart'){off=-40;sep=ease(seg(t,.25,.9));fall=seg(t,.6,2.2);}
      if(k==='open'||k==='floppy'){const g=seg(t,2.1,3.2);fx=40*ease(g);fall=g;fr=40*ease(g);}
      cap=({ok:t<.7?'Squeezing the handles. The jaws open…':t<1.4?'Clipping it onto the line…':t<1.8?'Let go. The jaws snap shut on the towel.':'Gusty! It holds tight. ✓',
        open:t<1.4?'The jaws are already gaping open…':t<2.1?'Let go. The jaws stay open.':'One tug and the peg falls off.',
        floppy:t<1.4?'Squeezing the handles. The jaws open…':t<2.1?'Let go. Nothing closes the jaws.':'One tug and the peg falls off.',
        pinch:t<.7?'Squeezing… the jaws won’t open.':'The jaws are shut tight, so it won’t go onto the line.',
        apart:'Nothing holds the halves together. They fall apart.'})[k];
    }
    let s='';
    /* clothesline + towel */
    const ly=210;
    s+=`<line x1="0" y1="${ly-2}" x2="400" y2="${ly-6}" stroke="${C.rope}" stroke-width="1.2" stroke-dasharray="2 4" opacity=".6"/>`;
    const tb=292,sx=sway;
    s+=`<path d="M${f(195+sx)},${tb} Q195,${ly+40} 195,${ly} A5,5 0 0 1 205,${ly} Q205,${ly+40} ${f(205+sx)},${tb}" fill="none" stroke="#9fb7cf" stroke-width="4" stroke-linecap="round"/>`;
    s+=`<circle cx="200" cy="${ly}" r="4.5" fill="${C.rope}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=T(214,ly+4,'CLOTHESLINE (END-ON)')+T(214,262,'TOWEL')+L(212,259,205+sx*.6,252);
    if(t>1.8&&out&&t<3.6){for(let i=0;i<3;i++){const y=230+i*14,ph=frac(t*1.3+i*.3);s+=L(110+ph*50,y,130+ph*50,y,C.blue,1.4);}s+=T(96,224,'WIND',{fill:C.blue,size:7});}
    /* peg */
    const Y=130+off+fall*fall*170,X=200+fx;
    const part=pl?pl.part:null,A=pl&&pl.slot==='A',rot=pl?pl.rot:0;
    const legsUp=part==='tors'?this.leg(A?0:-88,rot,C.acc):'';
    const halfG=(sg)=>{const sd=sg*sep;return `<g transform="translate(${f(sd*46)},0) rotate(${f(sd*-14)} ${f(X)} ${f(Y)})"><g transform="translate(${f(X)},${f(Y)}) rotate(${f(90+fr)}) scale(.85)"><g transform="${sg<0?'scale(1,-1) ':''}rotate(${f(-a)})">${this.half(sg<0?'#ddc394':'#e4cc9f',C.ink)}${legsUp}</g></g></g>`;};
    s+=halfG(1)+halfG(-1);
    if(pl){const c=A?0:-88,g=`translate(${f(X)},${f(Y)}) rotate(${f(90+fr)}) scale(.85)`;
      let p='';
      if(part==='tors') p=`<circle cx="${c}" cy="0" r="6.5" fill="${C.part}" stroke="${C.acc}" stroke-width="2.6"/><circle cx="${c}" cy="0" r="3" fill="none" stroke="${C.acc}" stroke-width="1.6"/>`;
      else if(part==='comp') p=A?zig(0,-9,0,9,3,10):zig(-88,-11,-88,11,3,12);
      else if(part==='pin') p=A?`<circle cx="0" cy="0" r="4.5" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/><circle r="1.5" fill="${C.ink}"/>`:`<rect x="-94" y="-24" width="12" height="48" rx="3" fill="${C.part}" stroke="${C.acc}" stroke-width="2" opacity=".9"/><circle cx="-88" cy="-18" r="2" fill="${C.ink}"/><circle cx="-88" cy="18" r="2" fill="${C.ink}"/>`;
      else p=`<rect x="${c-2.5}" y="-9" width="5" height="18" fill="${C.part}" stroke="${C.acc}" stroke-width="2"/>`;
      s+=`<g transform="translate(0,${f(sep*fall*fall*60)})"><g transform="${g}">${p}</g></g>`;
    }
    if(out&&t>.15&&t<.7&&k!=='apart'){s+=`<polygon points="${f(X+34)},${f(Y-80)} ${f(X+44)},${f(Y-85)} ${f(X+44)},${f(Y-75)}" fill="${C.blue}"/><polygon points="${f(X-34)},${f(Y-80)} ${f(X-44)},${f(Y-85)} ${f(X-44)},${f(Y-75)}" fill="${C.blue}"/>`+T(X+48,Y-78,'SQUEEZE',{fill:C.blue,w:600});}
    if(!out||t<.25) s+=T(240,50,'HANDLES')+T(240,170,'JAWS')+L(238,167,220,182);
    if(k==='ok'&&t>2) s+=T(70,40,'✓ HOLDS',{fill:C.blue,w:600,size:10});
    return [s,cap];
  }
};

/* ============ batch B: spray ============ */
/* MP-MECH id=spray const=SPRAY */
/* ============ B5. SPRAY BOTTLE TRIGGER ============
   Physics (simplified): a piston pump needs two one-way valves. The outlet
   valve (spring-loaded, at the nozzle side) is present. The inlet check valve
   at the top of the dip tube is missing. Without it, the squeeze takes the
   easy path back down the tube instead of cracking open the spring-loaded
   outlet valve, so the pump never primes. */
const SPRAY={
  id:'spray',title:'Spray bottle trigger',fig:'Trigger sprayer · cutaway',rotStep:180,dur:5,
  prompt:'Pull the trigger a few times. It should suck liquid up the tube and then spray it out of the nozzle. One valve is missing.',
  answer:{part:'ball',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:116,y:40,w:42,h:36,name:'in the nozzle channel'},{id:'A',label:'B',x:222,y:116,w:36,h:36,name:'top of the dip tube'}],
  parts:[
    {id:'ball',name:'Ball check valve',desc:'A steel ball in a little cage, resting on a cone-shaped seat at one end.',icon:()=>`<g transform="translate(40,27) scale(1.55)">${SPRAY.valve('ball',0,0,0,C.ink)}</g>`},
    {id:'tube',name:'Open tube',desc:'A short, plain plastic tube, open at both ends.',icon:()=>`<rect x="14" y="20" width="52" height="16" rx="2" fill="#e6edf2" stroke="${C.ink}" stroke-width="2"/><line x1="14" y1="28" x2="66" y2="28" stroke="${C.ink}" stroke-opacity=".25"/>`},
    {id:'sponge',name:'Sponge foam filter',desc:'A plug of open-cell foam that lets liquid through but keeps grit out.',icon:()=>`<rect x="16" y="16" width="48" height="24" rx="4" fill="#e9d47c" stroke="${C.ink}" stroke-width="2"/>${[[24,24],[36,32],[50,22],[56,33],[30,35],[44,26]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#c7ad45"/>`).join('')}`},
    {id:'plug',name:'Rubber plug',desc:'A solid rubber stopper that fits the channel snugly.',icon:()=>`<path d="M18 18h44l-4 20h-36z" fill="${C.rub}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`}
  ],
  /* valve drawn in a vertical channel centred at x,y; rot 0 = seat at the bottom (lets flow UP only); lift 0..1 = ball off seat */
  valve(id,x,y,rot,st,lift=0,fill){
    let s='';
    if(id==='ball'){s+=`<path d="M-6,-14 V8 L-2,12 M6,-14 V8 L2,12" fill="none" stroke="${st}" stroke-width="1.8"/><line x1="-6" y1="-14" x2="6" y2="-14" stroke="${st}" stroke-width="1.2" stroke-dasharray="2 2"/>`;
      s+=`<circle cx="0" cy="${f(6-lift*12)}" r="5" fill="${C.steelD}" stroke="${st}" stroke-width="1.8"/><path d="M-2.5,${f(4-lift*12)} a3 3 0 0 1 3 -2" stroke="#fff" stroke-width="1.2" fill="none"/>`;}
    else if(id==='tube') s+=`<rect x="-6" y="-14" width="12" height="28" fill="#e6edf2" fill-opacity=".6" stroke="${st}" stroke-width="1.8"/>`;
    else if(id==='sponge') s+=`<rect x="-6" y="-12" width="12" height="24" rx="2" fill="#e9d47c" stroke="${st}" stroke-width="1.8"/><circle cx="-2" cy="-5" r="1.6" fill="#c7ad45"/><circle cx="2" cy="3" r="1.6" fill="#c7ad45"/><circle cx="-2" cy="8" r="1.4" fill="#c7ad45"/>`;
    else s+=`<rect x="-6" y="-10" width="12" height="20" rx="2" fill="${fill||C.rub}" stroke="${st}" stroke-width="1.8"/>`;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${rot})">${s}</g>`;
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'slosh',msg:'Whatever goes in the nozzle channel, the top of the dip tube still has no valve. Squeeze, and the liquid takes the easy way out, back down the tube, instead of pushing open the spring-loaded outlet valve. Nothing sprays.'};
    switch(pl.part){
      case 'ball':return pl.rot%360===0?{ok:true,key:'ok'}:{ok:false,key:'reversed',msg:'Upside down, the valve works backwards. Suction pulls the ball up into its seat and seals the tube, so nothing can be drawn up. Squeezing just blows air down into the bottle.'};
      case 'tube':return {ok:false,key:'slosh',msg:'An open tube lets liquid flow both ways. Each squeeze pushes it back down into the bottle instead of out of the nozzle, so it just sloshes up and down the tube.'};
      case 'sponge':return {ok:false,key:'slosh',msg:'Liquid soaks through foam in either direction, so it can’t stop backflow. Each squeeze pushes the liquid back down the tube instead of out of the nozzle.'};
      default:return {ok:false,key:'blocked',msg:'The plug seals the dip tube, so nothing can be drawn up. After one puff of air the cylinder holds a vacuum, the trigger creeps back slowly, and nothing sprays.'};
    }
  },
  why:'Each squeeze pushes the piston in. The pressure presses the ball onto its seat and seals the dip tube, so the only way out is through the nozzle valve. Let go, and the spring pulls the piston back: the nozzle valve shuts, the suction lifts the ball, and liquid flows up the tube to refill the cylinder. Two one-way valves turn back-and-forth pumping into one-way flow.',
  P(t,vac){
    const W=[[.3,.7,.9,1.5],[1.8,2.2,2.4,3],[3.3,3.7,3.9,4.5]];let p=0;
    for(const [a,b,c,d] of W){if(t<a)break;p=t<b?ease(seg(t,a,b)):t<c?1:1-ease(seg(t,c,d));}
    if(vac&&t>=.9) p=1-.4*(1-p);
    return p;
  },
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const vac=k==='blocked'||k==='reversed';
    const P=out?this.P(t,vac):0,dP=out?this.P(t+.03,vac)-P:0;
    const squeezing=dP>.002,releasing=dP<-.002;
    let tube=225,cf=0,oc=0,spray=0,puff=0,bub=0,inLift=0,outLift=0;
    if(out){
      if(k==='ok'){tube=lerp(225,100,ease(seg(t,.9,1.3)));cf=ease(seg(t,1.2,1.5));oc=ease(seg(t,1.8,2.1));
        spray=squeezing&&t>1.8?1:0;puff=squeezing&&t<.8?1:0;inLift=releasing?1:0;outLift=squeezing?1:0;}
      else if(k==='slosh'){tube=t<.9?225:225-45*(1-P);bub=squeezing?1:0;}
      else if(k==='reversed'){bub=squeezing?1:0;inLift=squeezing?1:0;}
      else{puff=squeezing&&t<.8?1:0;outLift=puff;}
      cap=({ok:t<.8?'Squeeze 1: just air puffs out…':t<1.6?'Release: the ball lifts and liquid is sucked up the tube…':t<3?'Squeeze: the ball seals the tube, so liquid sprays out. ✓':'Spraying with every squeeze. ✓',
        slosh:t<.9?'Squeezing…':'The liquid just sloshes up and down the tube.',
        reversed:t<.9?'Squeezing… bubbles blow down into the bottle.':'The ball seals the tube on the suck stroke. Nothing comes up.',
        blocked:t<.9?'Squeezing… one puff of air.':'Nothing can come up. The trigger creeps back slowly.'})[k];
    }
    let s='';
    /* bottle */
    s+=`<path d="M200,150 V175 H160 Q150,175 150,186 V288 H330 V186 Q330,175 320,175 H280 V150" fill="#eef3f6" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<rect x="152" y="225" width="176" height="62" fill="${C.water}" opacity=".75"/>`+L(152,225,328,225,'#5f9cbf',1.2);
    /* head body */
    s+=`<path d="M40,40 H270 Q292,40 292,62 V140 H188 V128 H140 V140 H60 Q40,90 40,40 Z" fill="url(#hatch)" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
    s+=`<rect x="186" y="138" width="108" height="14" rx="2" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/>`;
    /* channels */
    const ch='#f8f4ea';
    s+=`<rect x="128" y="92" width="88" height="30" fill="${ch}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="214" y="101" width="26" height="12" fill="${ch}"/><rect x="234" y="52" width="12" height="100" fill="${ch}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="36" y="52" width="210" height="12" fill="${ch}" stroke="${C.ink}" stroke-width="1.5"/><rect x="215" y="102" width="20" height="10" fill="${ch}"/><rect x="235" y="53" width="10" height="12" fill="${ch}"/>`;
    /* liquid */
    s+=`<rect x="237" y="${f(Math.min(tube,286))}" width="6" height="${f(Math.max(0,286-tube))}" fill="${C.water}"/>`;
    if(tube<150) s+=`<rect x="235" y="${f(Math.max(tube,64))}" width="10" height="${f(150-Math.max(tube,64))}" fill="${C.water}"/>`;
    const xp=140+42*P;
    if(cf>0) s+=`<rect x="${f(xp+6)}" y="93" width="${f(215-xp-6)}" height="28" fill="${C.water}" opacity="${f(cf)}"/><rect x="214" y="102" width="21" height="10" fill="${C.water}" opacity="${f(cf)}"/>`;
    if(oc>0) s+=`<rect x="${f(246-210*oc)}" y="53" width="${f(210*oc)}" height="10" fill="${C.water}"/><rect x="235" y="53" width="10" height="48" fill="${C.water}"/>`;
    /* dip tube */
    s+=`<rect x="236" y="150" width="8" height="137" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
    /* bubbles */
    if(bub){for(let i=0;i<5;i++){const ph=frac(t*2.2+i/5);s+=`<circle cx="${f(240+Math.sin(i*2+t*9)*5)}" cy="${f(284-ph*58)}" r="${f(2+i%2)}" fill="#fff" stroke="#5f9cbf" stroke-width="1"/>`;}}
    /* outlet valve (fixed part) */
    s+=zig(240,55,240,72-outLift*5,3,7,C.ink,1.4)+`<circle cx="240" cy="${f(78-outLift*5)}" r="4.5" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/><path d="M234,82 L238,86 M246,82 L242,86" stroke="${C.ink}" stroke-width="1.8"/>`;
    /* piston + spring + trigger */
    s+=zig(xp+6,107,214,107,5,16,C.steelD,1.8);
    s+=`<rect x="${f(xp)}" y="94" width="7" height="26" fill="${C.rub}" stroke="${C.ink}" stroke-width="1.5"/>`;
    const ta=rad(-16*P),piv=[100,80],rp=(x,y)=>[piv[0]+(x-piv[0])*Math.cos(ta)-(y-piv[1])*Math.sin(ta),piv[1]+(x-piv[0])*Math.sin(ta)+(y-piv[1])*Math.cos(ta)];
    const R=rp(116,107),t1=rp(108,92),t2=rp(118,130),t3=rp(106,175),t4=rp(84,196);
    s+=L(R[0],R[1],xp,107,C.ink,4);
    s+=`<path d="M${f(piv[0])},${piv[1]} L${f(t1[0])},${f(t1[1])} Q${f(R[0]+6)},${f(R[1])} ${f(t2[0])},${f(t2[1])} Q${f(t3[0]+6)},${f(t3[1])} ${f(t4[0])},${f(t4[1])}" fill="none" stroke="${C.ink}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M${f(piv[0])},${piv[1]} L${f(t1[0])},${f(t1[1])} Q${f(R[0]+6)},${f(R[1])} ${f(t2[0])},${f(t2[1])} Q${f(t3[0]+6)},${f(t3[1])} ${f(t4[0])},${f(t4[1])}" fill="none" stroke="${C.steel}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
    s+=`<circle cx="${piv[0]}" cy="${piv[1]}" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`;
    if(out&&squeezing) s+=`<polygon points="${f(t3[0]+10)},${f(t3[1]-4)} ${f(t3[0]+18)},${f(t3[1])} ${f(t3[0]+10)},${f(t3[1]+4)}" fill="${C.blue}"/>`+T(t3[0]+20,t3[1]+3,'SQUEEZE',{fill:C.blue,w:600,size:7});
    /* nozzle + spray */
    s+=`<rect x="28" y="50" width="12" height="16" rx="2" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(spray){for(let i=0;i<34;i++){const ph=frac(t*3+i*.137),a=rad(180+(i%7-3)*6);s+=`<circle cx="${f(28+Math.cos(a)*ph*44)}" cy="${f(58+Math.sin(a)*ph*44+(i%3-1)*ph*5)}" r="${f(1.2+ph*1.6)}" fill="#5f9cbf" opacity="${f(1-ph)}"/>`;}}
    if(puff){for(let i=0;i<3;i++){const ph=frac(t*2+i/3);s+=`<circle cx="${f(24-ph*14)}" cy="58" r="${f(2+ph*5)}" fill="none" stroke="${C.muted}" stroke-width="1" opacity="${f(1-ph)}"/>`;}}
    /* missing valve */
    if(pl){const lift=pl.slot==='A'?inLift:0;
      if(pl.slot==='A') s+=this.valve(pl.part,240,135,pl.rot,C.acc,lift,C.rub);

    }
    s+=T(6,34,'NOZZLE')+T(130,86,'CYLINDER')+T(46,214,'TRIGGER')+T(252,190,'DIP TUBE')+L(250,187,244,180)+T(250,80,'OUTLET')+T(250,89,'VALVE',{})+T(160,281,'BOTTLE');
    return [s,cap];
  }
};

/* ============ batch B: clipper ============ */
/* MP-MECH id=clipper const=CLIPPER */
/* ============ B6. NAIL CLIPPER ============
   Physics (simplified): the pin runs through both arms with its head under the
   bottom arm. The lever hooks onto the pin's top and rocks on a curved heel
   resting on the top arm: pressing it pushes the top arm down and pulls the pin
   (and so the bottom arm) up. The pin is in tension. Arms are treated as rigid
   levers hinged at the back joint: force at the tips = pin force x (pin
   distance from joint / tip distance from joint). */
const CLIPPER={
  id:'clipper',title:'Nail clipper',fig:'Nail clipper · side view',rotStep:180,dur:3,
  prompt:'Press the lever and the jaws should snap shut and cut the nail. The pin that links the lever to the arms is missing.',
  answer:{part:'headed',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:316,y:138,w:28,h:88,name:'through both arms, near the jaws'},{id:'B',label:'B',x:176,y:138,w:28,h:88,name:'through both arms, near the joint'}],
  parts:[
    {id:'headed',name:'Headed pin',desc:'A steel pin with a wide head on one end.',icon:()=>`<g transform="translate(40,28) scale(.7)">${CLIPPER.pin('headed',0,0,C.ink,0)}</g>`},
    {id:'rod',name:'Plain rod',desc:'A steel pin the same length, with no head.',icon:()=>`<g transform="translate(40,28) scale(.7)">${CLIPPER.pin('rod',0,0,C.ink,0)}</g>`},
    {id:'short',name:'Short pin',desc:'A headed pin, but less than half as long.',icon:()=>`<g transform="translate(40,28) scale(.7) translate(0,21)">${CLIPPER.pin('short',0,0,C.ink,0)}</g>`},
    {id:'spring',name:'Extension spring',desc:'A coil spring with a hook at each end. Pull its ends and it stretches.',icon:()=>`<g transform="translate(40,28) scale(.7)">${CLIPPER.pin('spring',0,0,C.ink,0)}</g>`}
  ],
  /* pin drawn centred on x=0 between y=-34 (lever end, top) and y=+34 (under the bottom arm); rot 0 = head at the bottom */
  pin(id,rot,stretch,st,flipFix){
    let s='';const fl=`fill="${C.part}" stroke="${st}" stroke-width="1.8"`;
    if(id==='headed') s=`<rect x="-2.5" y="-36" width="5" height="68" ${fl}/><rect x="-7" y="30" width="14" height="6" rx="1.5" ${fl}/>`;
    else if(id==='rod') s=`<rect x="-2.5" y="-36" width="5" height="72" ${fl}/>`;
    else if(id==='short') s=`<rect x="-2.5" y="-36" width="5" height="26" ${fl}/><rect x="-7" y="-12" width="14" height="6" rx="1.5" ${fl}/>`;
    else s=zig(0,-30+(-stretch),0,30,7,9,st,1.8)+`<path d="M0,${f(-30-stretch)} v-4 a3 3 0 0 1 -5 0" fill="none" stroke="${st}" stroke-width="1.8"/><path d="M0,30 v4 a3 3 0 0 0 5 0" fill="none" stroke="${st}" stroke-width="1.8"/>`;
    return `<g transform="rotate(${rot})">${s}</g>`;
  },
  evaluate(pl){
    const A=pl.slot==='A',fl=pl.rot%360!==0;
    switch(pl.part){
      case 'headed':
        if(fl) return {ok:false,key:'pullout',msg:'Upside down, the head is on top and the bottom end is bare. The lever pulls the pin straight up through the bottom arm, so nothing pulls the jaws together.'};
        return A?{ok:true,key:'ok'}:{ok:false,key:'weak',msg:'Near the joint, the pin squeezes the arms right next to their hinge, while the nail sits far out at the tips. Like squeezing tongs beside the hinge, the jaws close on the nail with only a fraction of the force. It dents, but it doesn’t cut.'};
      case 'rod':return {ok:false,key:'pullout',msg:'With no head, the rod has nothing to catch the bottom arm. Pressing the lever just pulls the rod up through the hole, and the jaws stay open.'};
      case 'short':return fl?{ok:false,key:'nolink',msg:'Upside down, the short pin sits in the bottom arm and doesn’t reach the lever. Pressing the lever just pushes the whole clipper down in your hand. The jaws don’t close.'}
                            :{ok:false,key:'cancel',msg:'The short pin only reaches the top arm. The lever’s heel pushes that arm down while the pin pulls the same arm up, so the forces cancel and the jaws don’t move.'};
      default:return {ok:false,key:'stretch',msg:'A spring in place of the pin stretches instead of pulling. The lever lifts its top end, the spring just gets longer, and the jaws barely move.'};
    }
  },
  why:'The pin runs through both arms, with its head under the bottom one. The lever hooks onto its top and rocks on a curved heel that rests on the top arm. Press the lever and the heel pushes the top arm down while the pin hauls the bottom arm up. With the pin close to the jaws, nearly all of that squeeze lands right where the cutting edges meet.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const press=out?ease(seg(t,.3,1.1)):0;
    let c=0,lift=0,lam=0,drop=0,cut=false,stretch=0,dent=false;
    if(out){
      switch(k){
        case 'ok':c=Math.min(1,press*1.15);lam=-3.4*press;cut=t>1.05;break;
        case 'weak':c=.6*Math.min(1,press*1.6);lam=-3.4*press;dent=t>.9;break;
        case 'pullout':c=.04*press;lift=14*press;lam=-7*press;break;
        case 'cancel':lam=-1.2*press;break;
        case 'nolink':drop=7*press;break;
        default:c=.28*press;lift=9*press;stretch=9*press;lam=-6*press;
      }
      cap=({ok:t<1.05?'Pressing the lever…':'Snip! The jaws close and cut the nail. ✓',weak:t<.9?'Pressing the lever…':'The jaws close on the nail but can’t squeeze hard enough. It only dents.',pullout:t<.3?'Pressing the lever…':'The pin slides up through the bottom arm. The jaws stay open.',
        cancel:t<.3?'Pressing the lever…':'The push and the pull on the top arm cancel. Nothing closes.',nolink:t<.3?'Pressing the lever…':'The whole clipper just moves down. The jaws stay open.',stretch:t<.3?'Pressing the lever…':'The spring stretches. The jaws barely move.'})[k];
    }
    const Xp=pl?(pl.slot==='A'?330:190):330;
    const uA=c*1.29,lA=-c*1.29;
    let s='';
    /* finger + nail */
    s+=`<path d="M402,168 Q378,168 374,184 Q378,204 402,204 Z" fill="#f1cdb4" stroke="${C.ink}" stroke-width="1.6"/>`;
    s+=`<rect x="${cut?366:356}" y="181.5" width="${cut?36:46}" height="5" rx="2" fill="#fbeee4" stroke="${C.ink}" stroke-width="1.2"/>`;
    if(cut){const g=seg(t,1.05,2);s+=`<g transform="translate(${f(-8*g)},${f(120*g*g)}) rotate(${f(-70*g)} 361 184)"><rect x="355" y="181.5" width="11" height="5" rx="2" fill="#fbeee4" stroke="${C.ink}" stroke-width="1.2"/></g>`;}
    if(dent) s+=`<path d="M366,181.5 l2,2.5 l2,-2.5 M366,186.5 l2,-2.5 l2,2.5" fill="none" stroke="${C.acc}" stroke-width="1.2"/>`;
    /* clipper body (moves down for nolink) */
    let b='';
    b+=`<g transform="rotate(${f(uA)} 150 170)"><path d="M150,164 L362,168 L374,172 L372,180 L362,177 L150,176 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/><line x1="160" y1="167" x2="350" y2="170" stroke="#fff" stroke-width="1.5"/></g>`;
    b+=`<g transform="rotate(${f(lA)} 150 206)"><path d="M150,200 L362,196 L374,188 L372,198 L362,210 L150,212 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/></g>`;
    b+=`<rect x="134" y="162" width="22" height="52" rx="8" fill="${C.steelD}" stroke="${C.ink}" stroke-width="2"/><circle cx="145" cy="188" r="3.5" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/>`;
    /* pin */
    const pinY=185-lift;
    if(pl){const py=pinY;
      b+=`<g transform="translate(${Xp},${f(py)})">${this.pin(pl.part,pl.rot,stretch,C.acc)}</g>`;}
    s+=`<g transform="translate(0,${f(drop)})">${b}</g>`;
    /* lever: pivots on the pin top, heel on the top arm */
    const ly=152-lift;
    s+=`<g transform="translate(${Xp},${f(ly)}) rotate(${f(lam)})"><path d="M8,-4 L-180,-1 Q-188,2 -180,5 L-24,5 Q-16,17 -8,5 L8,5 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="1" r="3" fill="${C.card}" stroke="${C.ink}" stroke-width="1.5"/></g>`;
    /* v3: an upside-down headed pin has its head on top, which the lever used to hide; draw it above the lever */
    if(pl&&pl.part==='headed'&&pl.rot%360) s+=`<g transform="translate(${Xp},${f(ly)})"><rect x="-2.5" y="-10" width="5" height="9" fill="${C.part}" stroke="${C.acc}" stroke-width="1.8"/><rect x="-7" y="-15" width="14" height="6" rx="1.5" fill="${C.part}" stroke="${C.acc}" stroke-width="1.8"/></g>`;
    s+=`<defs><clipPath id="mpClipClipper"><circle cx="320" cy="68" r="54"/></clipPath></defs><line x1="352" y1="170" x2="340" y2="119" stroke="${C.muted}" stroke-width=".8" stroke-dasharray="3 2"/><circle cx="366" cy="184" r="14" fill="none" stroke="${C.muted}" stroke-width=".8" stroke-dasharray="3 2"/><g clip-path="url(#mpClipClipper)"><rect x="260" y="10" width="120" height="120" fill="#f8f4ea"/><g transform="translate(320,68) scale(2.6) translate(-370,-184)">${s}</g></g><circle cx="320" cy="68" r="54" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`+T(262,18,'JAWS ×3');
    if(cut&&t<1.6) s+=T(320,140,'SNIP!',{fill:C.blue,w:600,size:11,a:'middle'});
    if(out&&t>.15&&t<1.4){const ex=Xp-176;s+=`<polygon points="${ex-5},126 ${ex+5},126 ${ex},136" fill="${C.blue}"/>`+T(ex+8,130,'PRESS',{fill:C.blue,w:600});}
    s+=T(Xp-120,138,'LEVER')+T(130,232,'JOINT')+T(300,234,'BOTTOM ARM')+T(392,224,'NAIL',{a:'end'})+L(380,218,376,188);
    return [s,cap];
  }
};

/* ============ batch B: canopener ============ */
/* MP-MECH id=canopener const=CANOPENER */
/* ============ B7. MANUAL CAN OPENER ============
   Physics (simplified): a classic top-cutting opener. A sharp wheel presses
   down through the single-thickness lid just inside the rim; a toothed drive
   wheel grips under the rim's lip from outside. Turning the key spins the drive
   wheel, which walks the can round, and the cutter rolls along slicing.
   Both wheels are drawn edge-on in the section (their axles point at the can's
   centre). */
const CANOPENER={
  id:'canopener',title:'Manual can opener',fig:'Can opener · section through the rim + top view',rotStep:0,dur:4,
  prompt:'Squeeze the handles, then turn the key. The opener should cut all the way round and free the lid. The top wheel is missing.',
  answer:{part:'sharp',slot:'A',rot:0},
  slots:[{id:'A',label:'A',x:98,y:92,w:32,h:72,name:'on the lid, just inside the rim'},{id:'B',label:'B',x:132,y:92,w:34,h:38,name:'on top of the rim'}],
  parts:[
    {id:'sharp',name:'Sharp wheel',desc:'A hardened steel disc ground to a thin, sharp edge. It spins on its axle.',icon:()=>`<circle cx="40" cy="28" r="22" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.2"/><circle cx="40" cy="28" r="17" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="40" cy="28" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'blunt',name:'Round-edged wheel',desc:'A steel disc the same size, with a smooth, rounded edge.',icon:()=>`<circle cx="40" cy="28" r="21" fill="${C.steel}" stroke="${C.ink}" stroke-width="3.5"/><circle cx="40" cy="28" r="5" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`},
    {id:'gear',name:'Small steel gear',desc:'A small hardened steel gear, like the drive wheel underneath.',icon:()=>gear(40,28,18,14,6,0,C.steel)},
    {id:'rubber',name:'Rubber wheel',desc:'A tough rubber wheel on a steel hub.',icon:()=>`<circle cx="40" cy="28" r="22" fill="${C.rub}" stroke="${C.ink}" stroke-width="2"/><circle cx="40" cy="28" r="12" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="40" cy="28" r="4" fill="${C.card}" stroke="${C.ink}" stroke-width="2"/>`}
  ],
  /* edge-on wheel: centred on x, bottom edge at y; spin = phase for the moving stripes */
  wheel(id,x,y,spin,st,squash){
    const top=y-62;let s='';
    const body=id==='sharp'?`M${x-7},${top} H${x+7} V${y-14} L${x},${y} L${x-7},${y-14} Z`
      :id==='blunt'?`M${x-7},${top} H${x+7} V${y-7} Q${x+7},${y} ${x},${y} Q${x-7},${y} ${x-7},${y-7} Z`
      :id==='gear'?`M${x-7},${top} H${x+7} V${y} H${x-7} Z`
      :`M${x-8},${top} H${x+8} V${y-4+squash} Q${x},${y+squash*.3} ${x-8},${y-4+squash} Z`;
    s+=`<path d="${body}" fill="${id==='rubber'?C.rub:C.steel}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/>`;
    const n=id==='gear'?9:6;
    for(let i=0;i<n;i++){const yy=top+3+frac(i/n+spin)*(y-top-(id==='sharp'?16:8));s+=L(x-6,yy,x+6,yy,id==='rubber'?'#6b6660':C.ink,id==='gear'?1.6:.8);}
    s+=`<rect x="${x-10}" y="${top-6}" width="20" height="8" rx="2" fill="${C.steelD}" stroke="${C.ink}" stroke-width="1.5"/>`;
    return s;
  },
  evaluate(pl){
    if(pl.slot==='B') return {ok:false,key:'seam',msg:'On top of the rim the wheel presses on the seam, where the lid and the can wall are rolled together in several layers of steel. That’s far too thick to cut, so the can turns round and round and the lid stays sealed.'};
    switch(pl.part){
      case 'sharp':return {ok:true,key:'ok'};
      case 'blunt':return {ok:false,key:'groove',msg:'A rounded edge spreads the force over too wide an area to pierce the steel. It presses a groove all the way round, but the lid stays sealed.'};
      case 'gear':return {ok:false,key:'dents',msg:'Gear teeth are blunt bumps made to grip, which is exactly why the drive wheel underneath doesn’t cut the rim. Pressed on the lid they dent a bumpy track as the can turns, but nothing slices the metal. The lid stays on.'};
      default:return {ok:false,key:'roll',msg:'Rubber is far softer than the steel lid. It squashes flat and rolls round on top without even marking it.'};
    }
  },
  why:'The sharp wheel sits just inside the rim, where there’s only one thin layer of lid. Squeezing the handles drives its edge through the lid and clamps the rim between it and the toothed drive wheel underneath. Turning the key spins the drive wheel, which walks the can round, and the cutting wheel rolls along slicing a clean circle.',
  render(st){
    const {pl,out,t}=st;const k=out?out.key:null;let cap='';
    const sq=out?ease(seg(t,.2,.6)):0,p=out?seg(t,.7,3.4):0,spin=p*9,lift=k==='ok'?ease(seg(t,3.4,3.9)):0;
    if(out) cap=t<.7?'Squeezing the handles…':t<3.4?({ok:'Turning the key. The cutter slices round inside the rim…',groove:'Turning… it presses a groove, but doesn’t cut.',dents:'Turning… the teeth dent a bumpy track. Nothing is cut.',roll:'Turning… the rubber wheel just rolls over the lid.',seam:'Turning… the wheel rides round on top of the thick rim.'})[k]
      :({ok:'The lid comes free. ✓',groove:'Round and round, but the lid stays sealed.',dents:'All the way round, but the lid stays sealed.',roll:'All the way round, and not even a mark.',seam:'Round and round, but the lid stays sealed.'})[k];
    let s='';
    /* ---- section ---- */
    s+=T(10,22,'SECTION THROUGH THE RIM');
    s+=`<rect x="14" y="173" width="138" height="118" fill="#e6d3ad" opacity=".7"/>`+T(40,240,'CONTENTS',{size:7});
    const dentA=pl&&pl.slot==='A'&&(k==='groove'||k==='dents')?3*sq:0;
    const pierce=k==='ok'&&sq>.6;
    s+=`<path d="M14,168 L${pierce?108:106},${f(168+dentA*.4)} L114,${f(168+dentA)} L${pierce?120:122},${f(168+dentA*.4)} L128,168 Q134,168 134,152" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round"/>`;
    if(pierce) s+=`<line x1="111" y1="166" x2="117" y2="171" stroke="#f8f4ea" stroke-width="3"/>`;
    s+=`<rect x="152" y="166" width="5" height="126" fill="${C.steel}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s+=`<rect x="132" y="132" width="31" height="38" rx="9" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="2"/><path d="M137,166 V142 Q137,137 142,137 H150 Q155,137 155,142 V160" fill="none" stroke="${C.ink}" stroke-width="1" opacity=".5"/>`;
    s+=T(166,128,'RIM SEAM')+T(166,137,'(many layers)',{size:7})+T(18,160,'LID')+T(166,286,'CAN WALL');
    /* opener body */
    s+=`<path d="M100,76 H236 V242 H222 V90 H100 Z" fill="${C.ghost}" fill-opacity=".85" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`+T(150,70,'OPENER BODY');
    /* drive wheel + key */
    s+=this.wheel('gear',169,236,-spin,C.ink,0).replace(/<rect[^>]*\/>$/,'');
    s+=`<rect x="162" y="172" width="14" height="4" fill="${C.steelD}"/>`;
    const ka=spin*2*Math.PI;s+=L(176,205,250,205,C.ink,4)+`<line x1="250" y1="205" x2="250" y2="${f(205+26*Math.sin(ka))}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="${f(205+26*Math.sin(ka))}" r="6" fill="${C.acc}" stroke="${C.ink}" stroke-width="1.5"/>`+T(242,276,'KEY')+T(166,250,'DRIVE',{size:7})+T(166,258,'WHEEL',{size:7});
    if(out&&t>.7&&t<3.4) s+=T(244,176,'TURN',{fill:C.blue,w:600,size:7});
    /* the placed wheel */
    if(pl){const A=pl.slot==='A',x=A?114:146;let yb;
      if(A) yb=k==='ok'?160+12*sq:(k==='groove'||k==='dents')?160+(8+dentA)*sq:k==='roll'?160+8*sq:160;
      else yb=124+8*sq;
      const sp=(k==='ok'||k==='groove'||k==='dents'||k==='roll'||k==='seam')?spin:0;
      s+=this.wheel(pl.part,x,yb,sp,C.acc,k==='roll'?-4*sq:0);}
    if(out&&t>.2&&t<.7) s+=`<polygon points="114,64 108,54 120,54" fill="${C.blue}"/>`+T(124,60,'SQUEEZE',{fill:C.blue,w:600,size:7});
    /* ---- top view ---- */
    const cx=332,cy=196,R=60;
    s+=T(272,22,'TOP VIEW');
    s+=`<circle cx="${cx}" cy="${cy}" r="${R+4}" fill="${C.steel}" stroke="${C.ink}" stroke-width="2"/>`;
    const lx=-12*lift,ly=-30*lift;
    s+=`<circle cx="${f(cx+lx)}" cy="${f(cy+ly)}" r="${R-4}" fill="#e9e4d8" stroke="${C.ink}" stroke-width="1.5"/>`;
    for(let i=1;i<4;i++)s+=`<circle cx="${f(cx+lx)}" cy="${f(cy+ly)}" r="${R-4-i*12}" fill="none" stroke="${C.ink}" stroke-opacity=".15"/>`;
    const ma=rad(-90-p*360*(k?1:0));s+=`<circle cx="${f(cx+lx+Math.cos(ma)*30)}" cy="${f(cy+ly+Math.sin(ma)*30)}" r="3" fill="${C.acc}"/>`;
    if(pl&&pl.slot==='A'&&p>0&&k!=='roll'){const a0=-90,a1=-90-p*359.9,r=R-6,P1=[cx+Math.cos(rad(a0))*r,cy+Math.sin(rad(a0))*r],P2=[cx+Math.cos(rad(a1))*r,cy+Math.sin(rad(a1))*r];
      const dash=k==='ok'?'':k==='groove'?'5 3':'1.5 3';
      s+=`<path d="M${f(P1[0])},${f(P1[1])} A${r},${r} 0 ${p>.5?1:0} 0 ${f(P2[0])},${f(P2[1])}" fill="none" stroke="${k==='ok'?C.ink:C.acc}" stroke-width="${k==='ok'?2:2.4}" stroke-dasharray="${dash}" stroke-linecap="round"/>`;}
    s+=`<rect x="${cx-9}" y="${cy-R-12}" width="18" height="16" rx="3" fill="${C.ghost}" stroke="${C.ink}" stroke-width="1.5"/>`+T(cx+14,cy-R-2,'OPENER',{size:7});
    if(out&&t>.7&&t<3.4) s+=arcArrowCCW(cx,cy,R+14,-60,-120,C.blue);
    if(lift>.5) s+=T(cx,cy+R+20,'✓ LID OFF',{fill:C.blue,w:600,a:'middle',size:9});
    return [s,cap];
  }
};

/* ============ batch B: sharpener ============ */
/* MP-MECH id=sharpener const=SHARPENER */
/* ============ B8. PENCIL SHARPENER ============
   Physics (simplified): the blade lies almost flat on the side of the cone,
   like a tiny plane iron, with its edge facing the wood as the wood turns
   toward it. The end view looks down the cone (pencil turned clockwise, the
   usual direction for a right-hand sharpener); the blade is seen end-on, so its
   cutting edge is the pointed end of the strip. */
const SHARPENER={
  id:'sharpener',title:'Pencil sharpener',fig:'Sharpener · looking down the cone + side view',rotStep:90,dur:3.6,
  prompt:'Turn the pencil clockwise in the cone. A blade should shave off thin curls until the pencil has a point. The blade is missing.',
  answer:{part:'sharp',slot:'A',rot:0},
  /* spot letters deliberately swapped: the spot whose id is 'A' is shown to players as B */
  slots:[{id:'B',label:'A',x:180,y:110,w:40,h:40,name:'deep in the tip of the cone'},{id:'A',label:'B',x:194,y:50,w:76,h:26,name:'on the flat beside the slot'}],
  E:[200,130],
  parts:[
    {id:'sharp',name:'Sharp blade',desc:'A steel strip with one end ground to a keen, angled edge.',icon:()=>`<g transform="translate(12,32) scale(.9)">${SHARPENER.shape('sharp',C.ink)}</g>`},
    {id:'dull',name:'Dull blade',desc:'The same steel strip, but its edge has worn smooth and round.',icon:()=>`<g transform="translate(12,32) scale(.9)">${SHARPENER.shape('dull',C.ink)}</g>`},
    {id:'rubber',name:'Rubber strip',desc:'A strip of hard rubber the same size as the blade.',icon:()=>`<g transform="translate(12,32) scale(.9)">${SHARPENER.shape('rubber',C.ink)}</g>`},
    {id:'block',name:'Steel block',desc:'A flat steel bar with square ends, the same size as the blade.',icon:()=>`<g transform="translate(12,32) scale(.9)">${SHARPENER.shape('block',C.ink)}</g>`}
  ],
  /* edge point at 0,0 (rot 0 = strip lying along +x with its underside on the cone surface) */
  shape(id,st){
    const hole=`<circle cx="50" cy="-3" r="1.8" fill="${C.card}" stroke="${st}" stroke-width="1"/>`;
    if(id==='sharp') return `<polygon points="0,0 9,-6 62,-6 62,0" fill="${C.steel}" stroke="${st}" stroke-width="1.6" stroke-linejoin="round"/><line x1="2" y1="-.6" x2="9" y2="-5" stroke="#fff" stroke-width="1"/>${hole}`;
    if(id==='dull') return `<path d="M3,0 Q-1,-1 2,-4 Q4,-6 7,-6 L62,-6 L62,0 Z" fill="${C.steel}" stroke="${st}" stroke-width="1.6" stroke-linejoin="round"/>${hole}`;
    if(id==='rubber') return `<rect x="0" y="-6" width="62" height="6" rx="2" fill="${C.rub}" stroke="${st}" stroke-width="1.6"/>`;

      case 'ball':return {ok:true,key:'ok'};
      case 'foam':return {ok:false,key:'foam',msg:'The foam ball does roll forward, but it weighs next to nothing. It can’t shove the pawl up against the pawl’s own weight, so the pawl never reaches the teeth and the belt keeps unreeling.'};
      case 'bead':return {ok:false,key:'bead',msg:'The bead is too small. It sits so low in the cup that even when it rolls forward it never reaches the pawl’s foot. The pawl stays down and the belt keeps unreeling.'};
      default:return {ok:false,key:'jam',msg:'The peg props the pawl up into the teeth all the time. The belt is locked before you even start: you can’t pull it out to buckle up, or lean forward to reach the radio.'};

  },
  why:'In normal driving the steel ball sits at the bottom of its cup, the pawl rests clear of the teeth, and the belt reels in and out freely. In a sudden stop the ball keeps moving forward, rolls up the front of the cup and tips the pawl up into the ratchet teeth. The spool can’t unreel, so the belt holds you. It reacts to the car slowing hard, not to how hard you pull.',

      else{dx=t<1?24*ease(seg(t,.2,1)):t<stop?24*(1-ease(seg(t,1,1.6))):0;
        if(t>=stop){if(key==='ok')dx=6.5*ease(seg(t,stop,1.95))-1.2*Math.sin(seg(t,1.95,2.4)*Math.PI);else dx=Math.min(50,150*(t-stop)**2);}}
      if(t>=stop) u=ease(seg(t,stop,1.9));
    }
    const part=pl?pl.part:null,inA=pl&&pl.slot==='A';
    // ball travel up the front (right) wall of the 45-degree cone; lift on the pawl foot
    if(inA){if(part==='ball')lift=6*u;else if(part==='foam')lift=1*u;else if(part==='peg')lift=6;}
    const psi=-Math.atan2(lift,32)*180/Math.PI;

    s+=`<path d="${d}Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;

    // passenger pitches forward about the hips (forward is to the right); lap belt holds the hips
    const hp=[306,222],ang=dx*.8,ca=Math.cos(rad(ang)),sa=Math.sin(rad(ang));
    const rotP=(x,y)=>[hp[0]+(x-hp[0])*ca-(y-hp[1])*sa,hp[1]+(x-hp[0])*sa+(y-hp[1])*ca];
    const sh=rotP(300,114),hip=[322,206];
    s+=`<polygon points="270,250 286,98 298,98 290,250" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/><rect x="270" y="236" width="110" height="14" fill="url(#hatch2)" stroke="${C.ink}" stroke-width="1.5"/>`;

    s+=`<g transform="rotate(${f(ang)} ${hp[0]} ${hp[1]})"><rect x="294" y="108" width="34" height="104" rx="12" fill="#e7d9bf" stroke="${C.ink}" stroke-width="2"/><circle cx="312" cy="90" r="14" fill="#e7d9bf" stroke="${C.ink}" stroke-width="2"/></g>`;
    s+=`<polyline points="${S[0]},76 262,76 ${f(sh[0])},${f(sh[1])} ${f(hip[0])},${f(hip[1])}" fill="none" stroke="#5d6b7a" stroke-width="6" stroke-linejoin="round"/>`;
    s+=`<rect x="256" y="70" width="12" height="12" rx="3" fill="none" stroke="${C.ink}" stroke-width="2"/>`;

    s+=T(196,30,'REWIND SPRING')+L(216,32,178,104)+T(266,64,'D-RING')+T(388,40,'FORWARD →',{a:'end',fill:C.ink});
    if(out&&t>=stop&&t<stop+.9) s+=T(388,280,'◀◀ SUDDEN STOP',{a:'end',fill:C.acc,w:600,size:9});
    if(out&&key==='ok'&&t>1.9&&t<2.5) s+=T(196,186,'CLUNK',{fill:C.blue,w:600,size:9});
    if(out){

      else cap=t<.2?'Driving along…':t<1?'Leaning forward slowly: the belt unreels freely.':t<stop?'Sitting back. The rewind spring takes up the slack.':t<1.95?'Sudden stop!':key==='ok'?'The ball rolls forward, the pawl catches the teeth and the belt locks. ✓':'Nothing locks. The belt keeps unreeling and the passenger lurches forward.';
