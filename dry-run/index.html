<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dry Run — daily sprinkler puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e2;--card:#fffdf6;--ink:#2e3a2b;--mute:#6f7a66;--water:#2f8fdc;--water2:#7cc4f5;--grass:#5fae4b;--warn:#d9573b;--line:#e3dcc8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{width:42px;height:42px;flex:none}
h1{font-family:Fredoka,Nunito,sans-serif;font-size:28px;margin:0;line-height:1;letter-spacing:.3px}
.tag{font-size:13px;color:var(--mute);margin-top:3px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:800;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:800 16px Fredoka,sans-serif;color:var(--ink);cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:0 2px 6px}
.bar b{color:var(--ink)}
.mode{font-weight:800;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#dceefb;color:#1d6aa8}
.mode.practice{background:#f6e2c9;color:#9a5a1c}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 2px 0 #d9d1bb,0 10px 30px rgba(60,70,40,.12);background:#9cb98a}
canvas{display:block;width:100%;touch-action:none;cursor:default}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(34,48,32,.88);color:#fff;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:8px 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:#fff;display:flex;gap:9px;align-items:center;user-select:none;transition:transform .1s,border-color .15s}
.card:hover{transform:translateY(-1px)}
.card.armed{border-color:var(--water);box-shadow:0 0 0 3px rgba(47,143,220,.18)}
.card.sel{border-color:var(--water)}
.card.placed{background:#f3faf0}
.card .ic{width:30px;height:30px;flex:none}
.card .t{font-weight:800;font-size:14px}
.card .s{font-size:11.5px;color:var(--mute)}
.card .st{font-size:11px;font-weight:800;color:var(--water)}
.card.placed .st{color:#3e8c35}
.ctrls{display:none;margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line)}
.ctrls.on{display:block}
.ctrlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800;font-size:14px}
.row{display:grid;grid-template-columns:78px 1fr 58px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.row.off{opacity:.4}
input[type=range]{width:100%;accent-color:var(--water)}
.btn{font:700 15px Fredoka,Nunito,sans-serif;border:none;border-radius:12px;padding:11px 16px;cursor:pointer;background:#e9e3d2;color:var(--ink)}
.btn.small{font-size:13px;padding:6px 10px;border-radius:9px}
.btn.primary{background:var(--water);color:#fff;box-shadow:0 3px 0 #1f6fb0}
.btn.primary:disabled{background:#a9c7df;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.actions .hint{font-size:12.5px;color:var(--mute);flex:1;min-width:160px}
.result{display:none}
.result.on{display:block}
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font:700 52px Fredoka,sans-serif;line-height:1;color:var(--ink)}
.score .of{font:600 20px Fredoka,sans-serif;color:var(--mute)}
.score .verdict{margin-left:auto;font:600 16px Fredoka,sans-serif;color:var(--water)}
.lines{margin:10px 0 4px;font-size:14px}
.lines div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.lines .neg{color:var(--warn);font-weight:800}
.lines .pos{color:#3e8c35;font-weight:800}
.small{font-size:12.5px;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(40,50,35,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.mbox{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.mbox h2{font-family:Fredoka,sans-serif;margin:0 0 8px;font-size:22px}
.mbox p,.mbox li{font-size:14px;line-height:1.45}
.mbox ul{padding-left:18px;margin:6px 0}
.mbox .tip{background:#eaf5fd;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:8px}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#5fae4b"/><path d="M24 9c6 8 10 13 10 19a10 10 0 0 1-20 0c0-6 4-11 10-19z" fill="#7cc4f5" stroke="#fff" stroke-width="2.5"/><path d="M19 29a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <div><h1>Dry Run</h1><div class="tag">Water the lawn. Spare everything else.</div></div>
    <div class="hright"><span class="pill" id="streak">🔥 0</span><button class="iconbtn" id="helpBtn" aria-label="How to play">?</button></div>
  </header>
  <div class="bar"><span id="dayLabel"></span><span class="mode" id="modeTag">Daily</span></div>
  <div id="stage"><canvas id="c"></canvas><div id="toast"></div></div>
  <div class="legend">
    <span><i class="sw" style="background:#a57a4f"></i>Fences, house &amp; shrubs block water</span>
    <span><i class="sw" style="background:#8a6a4a"></i>Beds &amp; patio: fine to wet, not scored</span>
    <span><i class="sw" style="border:2px dashed #d9573b"></i>Keep dry: laundry, dog, windows, grill, lounger</span>
  </div>
  <div class="panel" id="planPanel">
    <div class="tray" id="tray"></div>
    <div class="ctrls" id="ctrls">
      <div class="ctrlhead"><span id="ctrlTitle"></span><button class="btn small ghost" id="removeBtn">Back to tray</button></div>
      <div class="row" id="rowDir"><span>Direction</span><input type="range" id="inDir" min="0" max="359" step="1"><span class="v" id="vDir"></span></div>
      <div class="row" id="rowArc"><span>Spray arc</span><input type="range" id="inArc" step="1"><span class="v" id="vArc"></span></div>
      <div class="row" id="rowR"><span>Throw</span><input type="range" id="inR" step="1"><span class="v" id="vR"></span></div>
    </div>
    <div class="actions">
      <div class="hint" id="hint"></div>
      <span id="pActs" style="display:none;gap:6px"><button class="btn ghost small" id="pYard">Another yard</button><button class="btn ghost small" id="pBot">Bot layout</button><button class="btn ghost small" id="pToday">Today's result</button></span>
      <button class="btn primary" id="runBtn" disabled>Run sprinklers 💧</button>
    </div>
  </div>
  <div class="panel result" id="resultPanel">
    <div class="score"><span class="big" id="rScore">0</span><span class="of">/100</span><span class="verdict" id="rVerdict"></span></div>
    <div class="lines" id="rLines"></div>
    <div class="small" id="rNote"></div>
    <div class="actions" id="rActs"></div>
  </div>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
// ===== Dry Run core: yards, geometry, coverage, scoring =====
var DR = (function () {
  var W = 640, H = 440, CELL = 4, GW = W / CELL, GH = H / CELL;
  var T = { OUT: 0, GROUND: 1, LAWN: 2, PATIO: 3, BED: 4, HOUSE: 5, SHRUB: 6 };
  var D2R = Math.PI / 180, TAU = Math.PI * 2;
  // 1 unit = 0.1 ft
  var KIT = {
    fan:    { name: 'Fan spray',   short: 'Fan',    rMin: 80,  rMax: 190, r0: 150, arcMin: 45, arcMax: 360, arc0: 180 },
    circle: { name: 'Full circle', short: 'Circle', rMin: 140, rMax: 140, r0: 140, arcMin: 360, arcMax: 360, arc0: 360 },
    rotor:  { name: 'Rotor',       short: 'Rotor',  rMin: 180, rMax: 290, r0: 240, arcMin: 60, arcMax: 360, arc0: 90 }
  };
  var SENS = {
    laundry: { label: 'the laundry', max: 12, icon: '🧺' },
    dog:     { label: 'the dog',     max: 10, icon: '🐕' },
    window:  { label: 'a window',    max: 10, icon: '🪟' },
    grill:   { label: 'the grill',   max: 8,  icon: '🔥' },
    chair:   { label: 'the lounger', max: 8,  icon: '🪑' }
  };
  var GRACE = 0.05; // a splash under 5% of an object is free

  // ---------- yards (rect = [x,y,w,h], circle = [x,y,r]) ----------
  var YARDS = [
    { name: 'The L',
      bounds: [10, 10, 620, 420],
      house: [[10, 10, 350, 110]],
      patio: [[10, 120, 350, 140]],
      lawn: [[360, 10, 270, 420], [10, 260, 350, 145]],
      beds: [[470, 10, 160, 45]],
      shrubs: [[383, 36, 18]],
      fences: [],
      sens: [{ kind: 'window', rect: [140, 120, 70, 7] },
             { kind: 'laundry', rect: [80, 410, 140, 15] },
             { kind: 'dog', circle: [588, 250, 20] }],
      kit: ['fan', 'fan', 'circle'] },
    { name: 'Back Deck',
      bounds: [10, 10, 620, 420],
      house: [[10, 330, 620, 100]],
      patio: [[200, 255, 240, 75]],
      lawn: [[10, 10, 620, 245], [10, 255, 190, 75], [440, 255, 190, 75]],
      beds: [[320, 120, 38]],
      shrubs: [[60, 55, 18], [580, 55, 18]],
      fences: [],
      sens: [{ kind: 'grill', rect: [398, 268, 30, 26] },
             { kind: 'chair', rect: [216, 268, 44, 30] },
             { kind: 'window', rect: [90, 323, 70, 7] },
             { kind: 'window', rect: [480, 323, 70, 7] }],
      kit: ['rotor', 'fan', 'fan', 'fan'] },
    { name: 'Dog Run',
      bounds: [10, 10, 620, 420],
      house: [[10, 10, 620, 100]],
      patio: [[250, 110, 140, 60]],
      lawn: [[10, 110, 620, 290], [200, 400, 430, 30]],
      beds: [],
      shrubs: [[40, 140, 16], [600, 140, 16]],
      fences: [[320, 210, 320, 430]],
      sens: [{ kind: 'laundry', rect: [30, 410, 150, 15] },
             { kind: 'dog', circle: [500, 360, 22] }],
      kit: ['fan', 'fan', 'fan'] },
    { name: 'Courtyard',
      bounds: [10, 10, 620, 420],
      house: [[10, 10, 620, 90], [10, 100, 120, 140], [510, 100, 120, 140]],
      patio: [[250, 100, 140, 50]],
      lawn: [[130, 100, 380, 330], [10, 240, 120, 190], [510, 240, 120, 190]],
      beds: [[320, 345, 30]],
      shrubs: [[150, 120, 14], [490, 120, 14]],
      fences: [],
      sens: [{ kind: 'window', rect: [130, 150, 7, 60] },
             { kind: 'window', rect: [503, 150, 7, 60] },
             { kind: 'grill', rect: [300, 108, 30, 26] }],
      kit: ['circle', 'fan', 'fan'] },
    { name: 'Garden Path',
      bounds: [10, 10, 620, 420],
      house: [[480, 10, 150, 420]],
      patio: [[10, 200, 470, 40], [370, 40, 80, 76]],
      lawn: [[10, 10, 470, 190], [10, 240, 470, 190]],
      beds: [],
      shrubs: [[32, 32, 15], [32, 408, 15]],
      fences: [],
      sens: [{ kind: 'laundry', rect: [60, 206, 150, 15] },
             { kind: 'chair', rect: [388, 60, 44, 36] },
             { kind: 'window', rect: [473, 290, 7, 70] }],
      kit: ['fan', 'fan', 'fan', 'circle'] }
  ];

  function mirrorRect(r) { return [W - r[0] - r[2], r[1], r[2], r[3]]; }
  function mirrorShape(s) { return s.length === 3 ? [W - s[0], s[1], s[2]] : mirrorRect(s); }
  function variant(i, mirror) {
    var y = JSON.parse(JSON.stringify(YARDS[i]));
    y.sens = y.sens.filter(function (s) { return !s.skip; });
    if (mirror) {
      ['house', 'patio', 'lawn', 'beds'].forEach(function (k) { y[k] = y[k].map(mirrorShape); });
      y.shrubs = y.shrubs.map(mirrorShape);
      y.fences = y.fences.map(function (f) { return [W - f[0], f[1], W - f[2], f[3]]; });
      y.sens.forEach(function (s) { if (s.rect) s.rect = mirrorRect(s.rect); if (s.circle) s.circle = mirrorShape(s.circle); });
      y.bounds = mirrorRect(y.bounds);
    }
    y.id = i + (mirror ? 'm' : '');
    return build(y);
  }

  function inRect(r, x, y) { return x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]; }
  function inShape(s, x, y) {
    if (s.length === 3) { var dx = x - s[0], dy = y - s[1]; return dx * dx + dy * dy <= s[2] * s[2]; }
    return inRect(s, x, y);
  }
  function rectSegs(r) {
    var x0 = r[0], y0 = r[1], x1 = r[0] + r[2], y1 = r[1] + r[3];
    return [[x0, y0, x1, y0], [x1, y0, x1, y1], [x1, y1, x0, y1], [x0, y1, x0, y0]];
  }

  function build(y) {
    y.segs = rectSegs(y.bounds);
    y.fenceSegs = y.segs.slice().concat(y.fences);
    y.house.forEach(function (h) { y.segs = y.segs.concat(rectSegs(h)); });
    y.segs = y.segs.concat(y.fences);
    y.circles = y.shrubs.slice();
    y.sens.forEach(function (s, i) { s.id = i; s.shape = s.rect || s.circle; });
    var type = new Uint8Array(GW * GH), sens = new Int8Array(GW * GH).fill(-1);
    var target = new Uint8Array(GW * GH), total = 0, sensCount = y.sens.map(function () { return 0; });
    for (var gy = 0; gy < GH; gy++) for (var gx = 0; gx < GW; gx++) {
      var i = gy * GW + gx, x = gx * CELL + CELL / 2, yy = gy * CELL + CELL / 2;
      type[i] = classify(y, x, yy);
      for (var k = 0; k < y.sens.length; k++) if (inShape(y.sens[k].shape, x, yy)) { sens[i] = k; sensCount[k]++; break; }
      if (type[i] === T.LAWN && sens[i] < 0) { target[i] = 1; total++; }
    }
    y.type = type; y.sensGrid = sens; y.target = target; y.total = total; y.sensCount = sensCount;
    return y;
  }

  function classify(y, x, yy) {
    if (!inRect(y.bounds, x, yy)) return T.OUT;
    for (var i = 0; i < y.house.length; i++) if (inRect(y.house[i], x, yy)) return T.HOUSE;
    for (i = 0; i < y.shrubs.length; i++) if (inShape(y.shrubs[i], x, yy)) return T.SHRUB;
    for (i = 0; i < y.beds.length; i++) if (inShape(y.beds[i], x, yy)) return T.BED;
    for (i = 0; i < y.patio.length; i++) if (inRect(y.patio[i], x, yy)) return T.PATIO;
    for (i = 0; i < y.lawn.length; i++) if (inRect(y.lawn[i], x, yy)) return T.LAWN;
    return T.GROUND;
  }

  function segDist(px, py, s) {
    var dx = s[2] - s[0], dy = s[3] - s[1], L = dx * dx + dy * dy;
    var t = L ? ((px - s[0]) * dx + (py - s[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
    var ex = s[0] + t * dx - px, ey = s[1] + t * dy - py; return Math.sqrt(ex * ex + ey * ey);
  }

  function canPlace(y, x, yy, others) {
    var c = classify(y, x, yy);
    if (c === T.OUT || c === T.HOUSE || c === T.SHRUB) return false;
    for (var i = 0; i < y.sens.length; i++) {
      var s = y.sens[i].shape;
      if (s.length === 3) { if (Math.hypot(x - s[0], yy - s[1]) < s[2] + 5) return false; }
      else if (x > s[0] - 5 && x < s[0] + s[2] + 5 && yy > s[1] - 5 && yy < s[1] + s[3] + 5) return false;
    }
    for (i = 0; i < y.segs.length; i++) if (segDist(x, yy, y.segs[i]) < 4) return false;
    for (i = 0; i < y.circles.length; i++) if (Math.hypot(x - y.circles[i][0], yy - y.circles[i][1]) < y.circles[i][2] + 4) return false;
    if (others) for (i = 0; i < others.length; i++) if (Math.hypot(x - others[i].x, yy - others[i].y) < 14) return false;
    return true;
  }

  // segment p->q crosses segment s?
  function crosses(px, py, qx, qy, s) {
    var rx = qx - px, ry = qy - py, sx = s[2] - s[0], sy = s[3] - s[1];
    var den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return false;
    var ax = s[0] - px, ay = s[1] - py;
    var t = (ax * sy - ay * sx) / den, u = (ax * ry - ay * rx) / den;
    return t > 1e-6 && t < 1 - 1e-6 && u >= 0 && u <= 1;
  }
  function los(y, px, py, qx, qy) {
    for (var i = 0; i < y.segs.length; i++) if (crosses(px, py, qx, qy, y.segs[i])) return false;
    for (i = 0; i < y.circles.length; i++) {
      var c = y.circles[i];
      if (segDist(c[0], c[1], [px, py, qx, qy]) < c[2]) return false;
    }
    return true;
  }
  // distance along ray from (px,py) at angle a until blocked, capped at r
  function rayHit(y, px, py, a, r) {
    var dx = Math.cos(a), dy = Math.sin(a), best = r;
    for (var i = 0; i < y.segs.length; i++) {
      var s = y.segs[i], sx = s[2] - s[0], sy = s[3] - s[1];
      var den = dx * sy - dy * sx; if (Math.abs(den) < 1e-9) continue;
      var ax = s[0] - px, ay = s[1] - py;
      var t = (ax * sy - ay * sx) / den, u = (ax * dy - ay * dx) / den;
      if (t > 1e-6 && u >= 0 && u <= 1 && t < best) best = t;
    }
    for (i = 0; i < y.circles.length; i++) {
      var c = y.circles[i], fx = px - c[0], fy = py - c[1];
      var b = fx * dx + fy * dy, cc = fx * fx + fy * fy - c[2] * c[2], disc = b * b - cc;
      if (disc < 0) continue; var tt = -b - Math.sqrt(disc);
      if (tt > 0 && tt < best) best = tt;
    }
    return best;
  }
  function norm(a) { a %= TAU; return a < 0 ? a + TAU : a; }
  function arcStart(sp) { return sp.arc >= TAU - 1e-6 ? sp.dir - Math.PI : sp.dir - sp.arc / 2; }
  // fraction along the sweep [0..1] or -1 if outside arc
  function arcFrac(sp, a) {
    var w = sp.arc; var d = norm(a - arcStart(sp));
    if (w >= TAU - 1e-6) return d / TAU;
    if (d <= w + 1e-6) return Math.min(1, d / w);
    return -1;
  }

  // coverage of one sprinkler: {cells:[idx], frac:[0..1]}
  function cover(y, sp) {
    var cells = [], frac = [], r = sp.r, r2 = r * r;
    var gx0 = Math.max(0, Math.floor((sp.x - r) / CELL)), gx1 = Math.min(GW - 1, Math.floor((sp.x + r) / CELL));
    var gy0 = Math.max(0, Math.floor((sp.y - r) / CELL)), gy1 = Math.min(GH - 1, Math.floor((sp.y + r) / CELL));
    for (var gy = gy0; gy <= gy1; gy++) for (var gx = gx0; gx <= gx1; gx++) {
      var i = gy * GW + gx, x = gx * CELL + CELL / 2, yy = gy * CELL + CELL / 2;
      var t = y.type[i]; if (t === T.OUT || t === T.HOUSE || t === T.SHRUB) continue;
      var dx = x - sp.x, dy = yy - sp.y; if (dx * dx + dy * dy > r2) continue;
      var f = arcFrac(sp, Math.atan2(dy, dx)); if (f < 0) continue;
      if (!los(y, sp.x, sp.y, x, yy)) continue;
      cells.push(i); frac.push(f);
    }
    return { cells: cells, frac: frac };
  }

  function reachPoly(y, sp, step) {
    step = step || 0.5 * D2R;
    var pts = [], full = sp.arc >= TAU - 1e-6, a0 = arcStart(sp), n = Math.max(2, Math.ceil(sp.arc / step));
    if (!full) pts.push([sp.x, sp.y]);
    for (var k = 0; k <= n; k++) {
      var a = a0 + sp.arc * k / n, d = rayHit(y, sp.x, sp.y, a, sp.r);

  $('goRun').onclick=function(){closeModal();startRun(true)}}else startRun(true)};
function startRun(animate){S.sel=-1;S.armed=-1;var res=DR.evaluate(S.yard,S.sps);S.res=res;S.react={};S.parts=[];S.splash=[];
  // when should each penalised object react?
  res.pens.forEach(function(p){if(!p.pts)return;var c=res.covers[p.by],f=1;for(var k=0;k<c.cells.length;k++)if(S.yard.sensGrid[c.cells[k]]===p.id&&c.frac[k]<f)f=c.frac[k];p.at=f});
  S.wet=new Float32Array(GW*GH);
  if(!animate){S.wet.fill(0);res.covers.forEach(function(c){c.cells.forEach(function(i){S.wet[i]=1})});res.pens.forEach(function(p){if(p.pts)S.react[p.id]={t0:-99}});
    paintGrass(S.wet);finish(false);return}

var RUN=3.4;
function stepRun(now){var r=S.run,t=(now-r.t0)/1000,p=Math.min(1,Math.max(0,(t-0.25)/RUN)),res=S.res,wet=S.wet;
  wet.fill(0);res.covers.forEach(function(c){for(var k=0;k<c.cells.length;k++){var v=(p-c.frac[k])*9;if(p>=1)v=1;if(v>0){v=v>1?1:v;if(v>wet[c.cells[k]])wet[c.cells[k]]=v}}});
  paintGrass(wet);
  if(p>0&&p<1)S.sps.forEach(function(s){var a=DR.arcStart(s)+s.arc*p;for(var n=0;n<5;n++){var aa=a+(Math.random()-.5)*0.12,L=DR.rayHit(S.yard,s.x,s.y,aa,s.r)*Math.pow(Math.random(),0.45);
      S.parts.push({x0:s.x,y0:s.y,x1:s.x+Math.cos(aa)*L,y1:s.y+Math.sin(aa)*L,t0:now,d:280+L*1.4,h:8+L*.12})}});
  res.pens.forEach(function(pn){if(pn.pts&&!S.react[pn.id]&&p>=pn.at)S.react[pn.id]={t0:now}});
  if(t>RUN+1.1)finish(true)}

  if(S.mode==='daily'&&fresh){var st=store.get();st.days[TODAY]={score:res.score,cov:Math.round(res.covPct*10)/10,pens:res.pens.filter(function(p){return p.pts}).map(function(p){return [p.kind,p.pts,p.by]}),
    sps:S.sps.map(function(s){return {kind:s.kind,x:s.x,y:s.y,dir:s.dir,arc:s.arc,r:s.r}})};store.set(st)}
  showResult();updateUI()}

  if(s.arc<TAU-1e-6){ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(s.x+Math.cos(s.dir)*3.5,s.y+Math.sin(s.dir)*3.5,2,0,TAU);ctx.fill()}else{ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(s.x,s.y,2,0,TAU);ctx.fill()}
  ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2.5;ctx.font='700 11px Fredoka,sans-serif';ctx.textAlign='center';ctx.strokeText(s.label,s.x,s.y-11);ctx.fillText(s.label,s.x,s.y-11);ctx.textAlign='left'}
function drawHandles(s){var K=DR.KIT[s.kind],a0=DR.arcStart(s);
  ctx.save();ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.stroke();ctx.restore();
  if(K.arcMin<K.arcMax){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.3;[a0,a0+s.arc].forEach(function(a){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+Math.cos(a)*s.r*.72,s.y+Math.sin(a)*s.r*.72);ctx.stroke()})}
  handles(s).forEach(function(h){if(h.t==='dir'){ctx.strokeStyle='#2f8fdc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x+Math.cos(s.dir)*9,s.y+Math.sin(s.dir)*9);ctx.lineTo(h.x,h.y);ctx.stroke();
      ctx.fillStyle='#2f8fdc';ctx.save();ctx.translate(h.x,h.y);ctx.rotate(s.dir);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-7);ctx.lineTo(-4,7);ctx.closePath();ctx.fill();ctx.restore()}
    else if(h.t==='r'){ctx.fillStyle='#fff';ctx.strokeStyle='#2f8fdc';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(h.x,h.y,7,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#2f8fdc';ctx.font='700 9px Nunito';ctx.textAlign='center';ctx.fillText('↔',h.x,h.y+3);ctx.textAlign='left'}
    else{ctx.fillStyle='#fff';ctx.strokeStyle='#2b6';ctx.strokeStyle='#1d6aa8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,6,0,TAU);ctx.fill();ctx.stroke()}})}

function frame(now){S.t=now;if(S.phase==='run')stepRun(now);
  ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!under){requestAnimationFrame(frame);return}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(under,0,0);ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);
  ctx.save();lawnPath(ctx,S.yard);ctx.clip();ctx.imageSmoothingEnabled=true;ctx.drawImage(gcan,0,0,W,H);ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(blades,0,0);ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);
  if(S.phase==='done'){ctx.globalAlpha=0.45+0.25*Math.sin(now/260);ctx.imageSmoothingEnabled=false;ctx.drawImage(miss,0,0,W,H);ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1}
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(over,0,0);ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);
  if(S.wet){ctx.save();ctx.beginPath();ctx.rect(S.yard.bounds[0],S.yard.bounds[1],S.yard.bounds[2],S.yard.bounds[3]);ctx.clip();ctx.drawImage(hard,0,0,W,H);ctx.restore()}
  drawSens(now);
  var badBy={};if(S.phase==='done')S.res.pens.forEach(function(p){if(p.pts)badBy[p.by]=1});
  // reach outlines
  if(S.phase==='plan'||S.phase==='done')S.sps.forEach(function(s,i){var P=S.polys[i];if(!P)return;var sel=i===S.sel;
    drawPoly(P);if(S.phase==='plan'){ctx.fillStyle=sel?'rgba(70,160,235,.16)':'rgba(70,160,235,.07)';ctx.fill()}
    ctx.save();ctx.setLineDash(S.phase==='done'?[6,4]:[]);ctx.strokeStyle=badBy[i]?'rgba(217,87,59,.95)':(sel?'rgba(30,110,200,.95)':'rgba(40,120,210,.5)');ctx.lineWidth=badBy[i]?2.2:(sel?2:1.3);ctx.stroke();ctx.restore()});
  if(S.phase==='plan'&&S.sel>=0)drawHandles(S.sps[S.sel]);
  // streams
  if(S.phase==='run'){var p=Math.min(1,Math.max(0,((now-S.run.t0)/1000-0.25)/RUN));if(p>0&&p<1)S.sps.forEach(function(s){var a=DR.arcStart(s)+s.arc*p,L=DR.rayHit(S.yard,s.x,s.y,a,s.r);
    var g=ctx.createLinearGradient(s.x,s.y,s.x+Math.cos(a)*L,s.y+Math.sin(a)*L);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(180,225,255,0)');ctx.strokeStyle=g;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+Math.cos(a)*L,s.y+Math.sin(a)*L);ctx.stroke()})}
  // particles
  var keep=[];for(var k=0;k<S.parts.length;k++){var q=S.parts[k],u=(now-q.t0)/q.d;if(u>=1){if(!q.drip&&S.splash.length<300)S.splash.push({x:q.x1,y:q.y1,t0:now});continue}
    var x=q.x0+(q.x1-q.x0)*u,yy=q.y0+(q.y1-q.y0)*u,z=4*q.h*u*(1-u);
    if(q.h){ctx.fillStyle='rgba(0,40,80,.12)';ctx.beginPath();ctx.arc(x,yy,1.4,0,TAU);ctx.fill()}
    ctx.fillStyle='rgba(60,150,230,.9)';ctx.beginPath();ctx.arc(x,yy-z,1.7,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x-.5,yy-z-.5,.6,0,TAU);ctx.fill();keep.push(q)}
  S.parts=keep.length>900?keep.slice(-900):keep;
  S.splash=S.splash.filter(function(sp){var u=(now-sp.t0)/320;if(u>=1)return false;ctx.strokeStyle='rgba(255,255,255,'+(0.7*(1-u))+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sp.x,sp.y,1+u*4,0,TAU);ctx.stroke();return true});
  S.sps.forEach(function(s,i){if(s.placed)drawHead(s,i===S.sel&&S.phase==='plan',!!badBy[i])});
  // penalty tags
  if(S.phase==='done')S.res.pens.forEach(function(p){if(!p.pts)return;var sh=S.yard.sens[p.id].shape,tx=sh.length===3?sh[0]:sh[0]+sh[2]/2,ty=sh.length===3?sh[1]-sh[2]-12:sh[1]-10;
    tx=Math.max(26,Math.min(W-26,tx));ty=Math.max(14,Math.min(H-8,ty));var txt='−'+p.pts+' '+S.sps[p.by].label;ctx.font='700 12px Fredoka,sans-serif';var w=ctx.measureText(txt).width+14;
    ctx.fillStyle='#d9573b';rr(ctx,tx-w/2,ty-10,w,19,9);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(txt,tx,ty+4);ctx.textAlign='left';sensOutline(S.yard.sens[p.id],'#d9573b')});
  requestAnimationFrame(frame)}

// ---------- boot ----------
resize();
var st=store.get();
if(st.days[TODAY])loadDaily();else{setVariant(variantFor(TODAY),false);if(!st.seen){help();st.seen=1;store.set(st)}}
tick();requestAnimationFrame(frame);
})();
</script>
