<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyewitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
/* Case-file look: paper ground, ink type, one evidence-red accent; a single centered column built around the illustrated exhibit. */
:root{--paper:#F3EEE4;--ink:#1E2430;--muted:#6B6F78;--accent:#D64933;--card:#FFFDF8;--line:#E2DACB;--good:#2E9E5B;--mid:#E39B26;--bad:#D64933}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px;gap:12px}
.logo{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:28px;letter-spacing:.07em;line-height:1}
.logo b{color:var(--accent);font-weight:800}
.date{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.date strong{color:var(--ink);font-weight:600}
.stagewrap{background:var(--card);padding:10px 10px 12px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 28px rgba(30,36,48,.09)}
.exhibit{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;font-weight:700}
.exhibit .tag{background:var(--ink);color:#fff;padding:3px 7px;border-radius:3px;letter-spacing:.12em}
.stagebox{position:relative;border-radius:3px;overflow:hidden;line-height:0}
svg.stage{display:block;width:100%;height:auto;background:#ddd;user-select:none;-webkit-user-select:none}
svg.stage.placing{touch-action:none;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;line-height:1.2}
.ov.dim{background:rgba(30,36,48,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.count{font-family:'Fraunces',serif;font-weight:800;font-size:92px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.35)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
.panel{margin-top:18px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}.dots i.done{background:#A9A39A}
.prompt{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;line-height:1.25;margin:0 0 14px}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.btn{appearance:none;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:16px;padding:14px 24px;border-radius:999px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.small{font-size:14px;padding:10px 16px}
.btn:disabled{opacity:.3;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.tray{display:flex;gap:12px;padding:10px;border:1.5px dashed #C8BEAE;border-radius:12px;background:#FBF8F2;min-height:92px;align-items:center}
.titem{width:76px;height:76px;border-radius:12px;background:#fff;border:2px solid var(--line);touch-action:none;cursor:grab;flex:none;padding:4px}
.titem svg{width:100%;height:100%;pointer-events:none}
.titem.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(214,73,51,.16)}
.titem.used{opacity:.35}
.traytext{font-size:13.5px;color:var(--muted);line-height:1.4}
.compass{display:grid;grid-template-columns:repeat(3,62px);gap:8px;justify-content:start}
.compass button{height:62px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.compass button.sel{border-color:var(--ink);background:var(--ink)}
.compass button.sel svg path{stroke:#fff}
.compass .mid{border:0;background:transparent;cursor:default;font-size:11px;color:var(--muted);text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.sel{box-shadow:0 0 0 3px var(--ink)}
.actions{margin-top:18px}
.results{list-style:none;margin:0 0 6px;padding:0}
.results li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.results .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.results .t{flex:1;font-size:15px;line-height:1.35}
.results .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.results .pts{font-weight:700;font-variant-numeric:tabular-nums}
.sceneTotal{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 2px;font-weight:600}
.sceneTotal .big{font-family:'Fraunces',serif;font-size:28px;font-weight:700}
.assist{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8a5a00;background:#FCE9C2;border-radius:4px;padding:2px 6px;vertical-align:middle}
h1.intro{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:30px;line-height:1.15;margin:22px 0 8px}
.lede{font-size:16px;line-height:1.5;color:#3c4250;margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 20px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.facts b{display:block;font-family:'Fraunces',serif;font-size:24px}
.facts span{font-size:12px;color:var(--muted)}
details{margin-top:22px;font-size:14.5px;line-height:1.5;color:#3c4250}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
.final{text-align:center}
.final .score{font-family:'Fraunces',serif;font-weight:800;font-size:72px;line-height:1;margin:10px 0 0}
.final .of{color:var(--muted);font-size:15px}
.final .rank{font-family:'Fraunces',serif;font-size:22px;margin:10px 0 18px}
.srows{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;text-align:left;margin-bottom:18px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{flex:1;font-weight:600}
.srow .em{letter-spacing:2px}
.srow .pt{font-variant-numeric:tabular-nums;width:44px;text-align:right;font-weight:700}
.stats{display:flex;justify-content:center;gap:28px;margin:4px 0 18px}
.stats b{display:block;font-family:'Fraunces',serif;font-size:26px}
.stats span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.dragghost{position:fixed;width:66px;height:66px;pointer-events:none;transform:translate(-50%,-50%);z-index:50;display:none}
.dragghost svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
textarea.sharebox{width:100%;height:120px;margin-top:10px;font:13px ui-monospace,monospace;border-radius:8px;border:1px solid var(--line);padding:8px;display:none}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-width:420px){.prompt{font-size:20px}.logo{font-size:24px}h1.intro{font-size:26px}}
/* ---------- polish layer ---------- */
html{color-scheme:light}
h1.intro,.prompt,.final .rank{text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .08s,opacity .2s,background-color .15s,box-shadow .15s}
.btn:not(:disabled):hover{background:#2c3444}
.btn.accent:not(:disabled):hover{background:#C23F2B}
.btn.ghost:not(:disabled):hover{background:rgba(30,36,48,.06)}
.btn.accent{box-shadow:0 3px 0 #A8321F}
.btn.accent:not(:disabled):active{box-shadow:0 1px 0 #A8321F;transform:translateY(2px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.titem:focus-visible,.sw:focus-visible,.compass button:focus-visible{outline-offset:2px}
.btn:focus:not(:focus-visible){outline:none}
.logo{position:relative}
.stagewrap{position:relative;border:1px solid var(--line)}
.stagewrap::before{content:"";position:absolute;top:-7px;left:50%;width:64px;height:14px;margin-left:-32px;background:rgba(214,73,51,.18);border-radius:2px;transform:rotate(-1.5deg);pointer-events:none}
.exhibit .tag{background:var(--accent)}
.exhibit>span:nth-child(2){text-align:center;flex:1;padding:0 6px}
.exhibit>span:last-child{font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.stagebox{box-shadow:inset 0 0 0 1px rgba(30,36,48,.08)}
.stagebox::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(30,36,48,.10)}
.count{display:flex;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(30,36,48,.35);font-size:76px;line-height:1}
.count.tick{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.eye{width:72px;height:72px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.ov .btn{box-shadow:0 6px 20px rgba(0,0,0,.25),0 3px 0 #A8321F}
.screen{animation:rise .32s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.titem{transition:border-color .15s,box-shadow .15s,opacity .2s,transform .12s}
.titem:hover{border-color:#C8BEAE}
.titem.sel{transform:scale(1.04)}
.compass button,.sw{transition:transform .1s,box-shadow .15s,background-color .15s,border-color .15s}
.compass button:not(.mid):hover{border-color:#C8BEAE}
.compass button:active,.sw:active{transform:scale(.94)}
.sw.sel{transform:scale(1.08)}
.results li{animation:rise .35s ease-out both}
.results li:nth-child(2){animation-delay:.12s}.results li:nth-child(3){animation-delay:.24s}
.results .ic svg{width:17px;height:17px}
.results .pts{min-width:34px;text-align:right}
.cdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin:0 3px 0 1px;box-shadow:0 0 0 1.5px rgba(30,36,48,.2)}
.sceneTotal .big{font-variant-numeric:tabular-nums}
.stamp{display:inline-block;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px;color:var(--accent);border:2.5px solid var(--accent);border-radius:6px;padding:5px 14px 6px;transform:rotate(-2.5deg);letter-spacing:.02em;margin:12px 0 20px;background:rgba(214,73,51,.05)}
.final .score{font-variant-numeric:tabular-nums}
.srows .em{white-space:nowrap}
.stats b{font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:10px 6px;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.recap{font-size:13px;color:var(--muted);margin:6px 0 0}
@media (max-width:420px){.swatches{gap:6px;flex-wrap:nowrap}.sw{width:44px;height:44px}.exhibit{font-size:10px;letter-spacing:.1em}.count{width:108px;height:108px;font-size:62px}.stats{gap:20px}}
@media (prefers-reduced-motion:reduce){
  .screen,.results li,.count.tick{animation:none}
  .pulse{animation:none;opacity:.8}
  .btn,.titem,.compass button,.sw,.toast{transition:none}
  .titem.sel,.sw.sel{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">EYE<b>WITNESS</b></div>
    <div class="date" id="hdrDate"></div>
  </header>
  <main id="main"></main>
</div>
<div class="dragghost" id="ghost"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const W=480,H=320;
const VIEW_MS=5000;
const PAL={red:'#E5484D',orange:'#F28C28',yellow:'#F2C230',green:'#3DA35D',blue:'#2F7FE0',purple:'#8E5BD9',pink:'#EE6FA8'};
const PNAMES=Object.keys(PAL);
const GRAY='#C4C0B8';
const DIRN={0:'right',45:'down-right',90:'down',135:'down-left',180:'left',225:'up-left',270:'up',315:'up-right'};

/* ---------- rng ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(a,r)=>a[Math.floor(r()*a.length)];
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return '#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- drawing primitives ---------- */
const sh=(rx,ry,dy=0,dx=0)=>`<ellipse cx="${dx}" cy="${dy}" rx="${rx}" ry="${ry}" fill="rgba(40,30,20,.18)"/>`;
function person(shirt,o={}){
  const skin=o.skin||'#E6B48C',hair=o.hair||'#3B2A20',pants=o.pants||'#3E4756';
  let s=o.noShadow?'':sh(10,3.5);
  if(o.pack) s+=`<rect x="-12.5" y="-27" width="6" height="14" rx="2.5" fill="${o.pack}"/>`;
  s+=`<rect x="-5.5" y="-12" width="4.6" height="12" rx="2" fill="${pants}"/><rect x=".9" y="-12" width="4.6" height="12" rx="2" fill="${pants}"/>`;
  s+=`<rect x="-11" y="-26" width="4.2" height="12" rx="2" fill="${shirt}"/><rect x="6.8" y="-26" width="4.2" height="12" rx="2" fill="${shirt}"/>`;
  s+=`<rect x="-8" y="-28" width="16" height="17" rx="5" fill="${shirt}"/>`;
  s+=`<circle cx="0" cy="-34" r="6.6" fill="${skin}"/><path d="M-6.8 -34.5a6.8 6.8 0 0 1 13.6 0q-6.8-3.4-13.6 0z" fill="${hair}"/>`;
  if(o.cup) s+=`<g transform="translate(10.5,-15)"><rect x="-3.4" y="-6" width="6.8" height="9" rx="1.4" fill="${o.cup}"/><rect x="-3.8" y="-7.4" width="7.6" height="2.4" rx="1.2" fill="#FBF8F2"/></g>`;
  return s;
}
const D={
  bicycle:c=>sh(19,3.2,9)+`<g fill="none" stroke="#2a2a2a" stroke-width="2.4"><circle cx="-11" cy="1" r="7.5"/><circle cx="11" cy="1" r="7.5"/></g><g fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 1L-3-10H8L11 1M-3-10L0 1H-11M0 1L8-10M8-10L6.5-15"/></g><rect x="-7" y="-13.5" width="8" height="2.8" rx="1.4" fill="#2a2a2a"/><path d="M3.5-15.5h6" stroke="#2a2a2a" stroke-width="2.6" stroke-linecap="round"/>`,
  car:c=>sh(25,13,3,-1)+`<rect x="-16" y="-14.5" width="9" height="5" rx="1.6" fill="#222"/><rect x="8" y="-14.5" width="9" height="5" rx="1.6" fill="#222"/><rect x="-16" y="9.5" width="9" height="5" rx="1.6" fill="#222"/><rect x="8" y="9.5" width="9" height="5" rx="1.6" fill="#222"/><rect x="-23" y="-12" width="46" height="24" rx="7" fill="${c}"/><rect x="5" y="-9" width="7" height="18" rx="2.5" fill="#26313f" opacity=".85"/><rect x="-15.5" y="-8" width="5" height="16" rx="2" fill="#26313f" opacity=".7"/><rect x="-9" y="-9" width="13" height="18" rx="3" fill="#fff" opacity=".2"/><rect x="20" y="-10" width="3" height="5" rx="1" fill="#FFF6C8"/><rect x="20" y="5" width="3" height="5" rx="1" fill="#FFF6C8"/>`,
  customer:c=>person('#8D8A84',{cup:c,hair:'#6A4528',pants:'#4A4F5A'}),
  walker:c=>person(c,{hair:'#2C2420'}),
  hiker:c=>person(c,{pack:'#7A5C3E',hair:'#8B5A2B',pants:'#5B5547'}),
  jogger:c=>person(c,{hair:'#C49A5A',pants:'#2E3440',skin:'#C58C62'}),
  aboard:c=>sh(14,3.5)+`<path d="M-11 0L-7-30H7L11 0" fill="none" stroke="#6B4A33" stroke-width="2.5"/><rect x="-9" y="-28" width="18" height="24" rx="1.5" fill="${c}"/><path d="M-5-22h10M-5-17h7M-5-12h9" stroke="#F4EFE6" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>`,
  dog:c=>{const d=shade(c,-.3);return sh(15,3.5)+`<rect x="-10" y="-8" width="3.6" height="8" rx="1.6" fill="${d}"/><rect x="-5" y="-8" width="3.6" height="8" rx="1.6" fill="${d}"/><rect x="4" y="-8" width="3.6" height="8" rx="1.6" fill="${d}"/><rect x="8.5" y="-8" width="3.6" height="8" rx="1.6" fill="${d}"/><path d="M-11-12q-7-5-5-11" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="-11" rx="12.5" ry="6.2" fill="${c}"/><circle cx="12" cy="-16" r="5.8" fill="${c}"/><ellipse cx="17.3" cy="-15" rx="3.4" ry="2.5" fill="${c}"/><circle cx="20.2" cy="-15.6" r="1.3" fill="#222"/><circle cx="13.2" cy="-17.5" r="1" fill="#222"/><ellipse cx="9.5" cy="-18" rx="2.4" ry="4.4" fill="${d}" transform="rotate(-22 9.5 -18)"/>`},
  ball:c=>`<circle cx="2" cy="3" r="9.5" fill="rgba(40,30,20,.16)"/><circle r="8.5" fill="${c}"/><path d="M-8.4 0Q0-5.5 8.4 0" stroke="#fff" stroke-width="2.6" fill="none"/><path d="M0-8.4Q4.5 0 0 8.4" stroke="#fff" stroke-width="2.6" fill="none"/>`,
  umbrella:c=>{let s=`<ellipse cx="7" cy="9" rx="26" ry="24" fill="rgba(40,30,20,.15)"/>`;for(let i=0;i<8;i++){const a0=i*Math.PI/4,a1=(i+1)*Math.PI/4;s+=`<path d="M0 0L${(25*Math.cos(a0)).toFixed(2)} ${(25*Math.sin(a0)).toFixed(2)}A25 25 0 0 1 ${(25*Math.cos(a1)).toFixed(2)} ${(25*Math.sin(a1)).toFixed(2)}Z" fill="${i%2?'#FBF8F2':c}"/>`}return s+`<circle r="25" fill="none" stroke="${shade(c,-.25)}" stroke-width="1.4"/><circle r="2.8" fill="#555"/>`},

/* ---------- scene generation ---------- */
// obstacles: {c:[x,y,r]} circles or {r:[x0,y0,x1,y1]} rects; f:'so' blocks statics only, 'mo' blocks movers only
const OB=o=>Array.isArray(o)?{c:[o[0],o[1],o[2]],f:o[3]||''}:o;
TEMPLATES.forEach(t=>{t.obst=t.obst.map(OB)});
const rGap=(a,b)=>Math.max(b[0]-a[2],a[0]-b[2],b[1]-a[3],a[1]-b[3]);
function obGap(o,rc){
  if(o.r) return rGap(o.r,rc);
  const [cx,cy,r]=o.c;
  if(cx>rc[0]&&cx<rc[2]&&cy>rc[1]&&cy<rc[3]) return -r;
  return Math.hypot(cx-clamp(cx,rc[0],rc[2]),cy-clamp(cy,rc[1],rc[3]))-r;
}
const frameGap=rc=>Math.min(rc[0],rc[1],W-rc[2],H-rc[3]);
// axis-aligned hit box of a kind drawn at (x,y), moving/facing dir
function kRect(k,x,y,dir){
  const kk=K[k],b=kk.hb||kk.box;
  if(kk.orient==='rotate'&&dir!=null){
    const r=dir*Math.PI/180,co=Math.cos(r),si=Math.sin(r);
    const ox=b[0]+b[2]/2,oy=b[1]+b[3]/2,hw=b[2]/2*Math.abs(co)+b[3]/2*Math.abs(si),hh=b[2]/2*Math.abs(si)+b[3]/2*Math.abs(co);
    const cx=x+ox*co-oy*si,cy=y+ox*si+oy*co;return [cx-hw,cy-hh,cx+hw,cy+hh];
  }
  if(kk.orient==='flip'&&dir!=null&&Math.cos(dir*Math.PI/180)<-.1) return [x-b[0]-b[2],y+b[1],x-b[0],y+b[1]+b[3]];
  if(kk.orient==='bob') return [x+b[0],y+b[1]-2,x+b[0]+b[2],y+b[1]+b[3]];
  return [x+b[0],y+b[1],x+b[0]+b[2],y+b[1]+b[3]];
}
const STEPS=20;
function moverRectAt(it,P,p){return kRect(it.k,P.x0+(P.x1-P.x0)*p,P.y0+(P.y1-P.y0)*p,P.dir)}
// smallest clearance of a mover path against frame, landmarks, still objects and other movers (same moment)
function moverClear(it,P,tpl,statics,movers){
  let m=1e9;
  for(let i=0;i<=STEPS;i++){
    const p=i/STEPS,rc=moverRectAt(it,P,p);
    m=Math.min(m,frameGap(rc)-1);
    if(!it.fly&&!it.ignoreObst) for(const o of tpl.obst) if(o.f!=='so') m=Math.min(m,obGap(o,rc)-2);
    for(const q of statics) m=Math.min(m,rGap(kRect(q.k,q.x,q.y),rc)-4);
    for(const q of movers) m=Math.min(m,rGap(moverRectAt(q,q.path,p),rc)-4);
  }
  return m;
}
function staticClear(it,x,y,tpl,placed,movers){
  const rc=kRect(it.k,x,y);let m=frameGap(rc)-2;
  for(const o of tpl.obst) if(o.f!=='mo') m=Math.min(m,obGap(o,rc)-4);
  for(const q of placed) m=Math.min(m,rGap(kRect(q.k,q.x,q.y),rc)-8);
  for(const q of movers) for(let i=0;i<=STEPS;i++) m=Math.min(m,rGap(moverRectAt(q,q.path,i/STEPS),rc)-5);
  return m;
}
function samplePt(zones,rng){const z=pick(zones,rng);return {x:z[0]+rng()*z[2],y:z[1]+rng()*z[3]}}
function genScene(tpl,rng,busy){
  const P=tpl.props,movers=P.filter(p=>p.lanes),statics=P.filter(p=>!p.lanes);
  const pl=pick(statics.filter(p=>p.roles.includes('place')),rng);
  const co=pick(statics.filter(p=>p.roles.includes('color')&&p!==pl),rng);
  const restS=statics.filter(p=>p!==pl&&p!==co);
  const dS=restS.length?pick(restS,rng):null;
  // movers that can go more ways are asked about more often (a 2-way mover is a coin flip for a guesser)
  const nd=p=>{const n=new Set(p.lanes.flatMap(l=>l.dirs)).size;return n*n};
  let wsum=movers.reduce((s,p)=>s+nd(p),0),wr=rng()*wsum,mv=movers[movers.length-1];
  for(const p of movers){wr-=nd(p);if(wr<0){mv=p;break}}
  const restM=movers.filter(p=>p!==mv);
  const dM=restM.length?pick(restM,rng):null;
  // every colour is drawn independently, so colours you can still see on the question screen tell you nothing
  const mk=(p,task)=>{const it=Object.assign({},p,{task});const f=K[p.k].fixed;it.color=f?null:pick(PNAMES,rng);it.hex=f||PAL[it.color];return it};
  const items=[mk(pl,'place'),mk(co,'color')];
  if(dS) items.push(mk(dS,null));
  if(busy){const more=restS.filter(p=>p!==dS);if(more.length) items.push(mk(pick(more,rng),null))}
  items.push(mk(mv,'move'));
  if(dM) items.push(mk(dM,null));
  // lay out moving things first, then still objects around them; retry the layout if anything still overlaps
  let bestLay=null,bestW=-1e9;
  for(let att=0;att<8;att++){
    let worst=1e9;
    const moved=[];
    for(const it of items.filter(i=>i.lanes)){
      const a=it.area||[12,12,456,296];
      let best=null,bs=-1e9,last=null;
      for(let t=0;t<300;t++){
        const L=pick(it.lanes,rng),dir=pick(L.dirs,rng);
        let cx,cy;
        if(L.seg){const u=rng();cx=L.seg[0]+(L.seg[2]-L.seg[0])*u;cy=L.seg[1]+(L.seg[3]-L.seg[1])*u}
        else{cx=L.x[0]+rng()*(L.x[1]-L.x[0]);cy=L.y[0]+rng()*(L.y[1]-L.y[0])}
        const dx=Math.cos(dir*Math.PI/180)*L.dist/2,dy=Math.sin(dir*Math.PI/180)*L.dist/2;
        const Pth={x0:cx-dx,y0:cy-dy,x1:cx+dx,y1:cy+dy,dir,dist:L.dist,mx:cx,my:cy};last=Pth;
        if(![[Pth.x0,Pth.y0],[Pth.x1,Pth.y1]].every(([x,y])=>x>=a[0]-.01&&x<=a[0]+a[2]+.01&&y>=a[1]-.01&&y<=a[1]+a[3]+.01)) continue;
        const m=moverClear(it,Pth,tpl,[],moved);
        if(m>bs){bs=m;best=Pth}
        if(m>=6) break;
      }
      it.path=best||last;it.x=it.path.mx;it.y=it.path.my;moved.push(it);worst=Math.min(worst,bs);
    }
    const placed=[];
    for(const it of items.filter(i=>!i.lanes)){
      let best=null,bs=-1e9;
      for(let t=0;t<200;t++){
        const p=samplePt(it.zone,rng),m=staticClear(it,p.x,p.y,tpl,placed,moved);
        if(m>bs){bs=m;best=p}
        if(m>=8) break;
      }
      it.x=best.x;it.y=best.y;placed.push(it);worst=Math.min(worst,bs);
    }
    if(worst>bestW){bestW=worst;bestLay=items.map(i=>({x:i.x,y:i.y,path:i.path}))}
    if(worst>=0) break;
  }
  items.forEach((it,i)=>Object.assign(it,bestLay[i]));
  return {tpl,items,place:items[0],color:items[1],move:items.find(i=>i.task==='move')};
}
const lab=it=>it.lab?it.lab(it.color):(it.color?`${it.color} ${it.name}`:it.name);

/* ---------- daily schedule ---------- */
// Walks forward one day at a time from launch: the same 3-scene set never repeats within 30 days,
// no scene type plays on more than 2 days in a row, and scenes seen in the last few days are avoided.
const SCHED_EPOCH=new Date(2026,10,5,12);
const SCHED=[];
let COMBOS=null;
function scheduleDay(n){
  if(!COMBOS){COMBOS=[];const N=TEMPLATES.length;for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++)COMBOS.push([a,b,c])}
  while(SCHED.length<=n){
    const d=SCHED.length,rng=mulberry(hashStr('eyewitness-day|'+d));
    const recent=new Set(SCHED.slice(Math.max(0,d-29)).map(t=>t.slice().sort((x,y)=>x-y).join(',')));
    const y1=SCHED[d-1]||[],y2=SCHED[d-2]||[],banned=y1.filter(i=>y2.includes(i));
    const last=TEMPLATES.map(()=>-99),cnt=TEMPLATES.map(()=>0);
    for(let j=Math.max(0,d-14);j<d;j++) for(const i of SCHED[j]){last[i]=j;cnt[i]++}
    let best=null,bs=1e9;
    for(const cb of COMBOS){
      const jit=rng();
      if(recent.has(cb.join(','))||cb.some(i=>banned.includes(i))) continue;
      let sc=jit*1.2;
      for(const i of cb){const gap=d-last[i];sc+=(gap===1?2.2:gap===2?1:gap===3?.4:0)+cnt[i]*.25}
      if(sc<bs){bs=sc;best=cb}
    }
    SCHED.push(shuffle(best.slice(),rng));
  }
  return SCHED[n];
}
function dayTemplates(key){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(key)) return null;
  const n=Math.round((new Date(key+'T12:00:00')-SCHED_EPOCH)/864e5);
  return n>=0?scheduleDay(n).map(i=>TEMPLATES[i]):null;
}
function buildScenes(key){
  const rng=mulberry(hashStr('eyewitness|'+key));
  const tpls=dayTemplates(key)||shuffle(TEMPLATES.slice(),rng).slice(0,3);
  return tpls.map((t,i)=>{const sc=genScene(t,rng,i===2);sc.busy=i===2;return sc});
}

/* ---------- rendering ---------- */
function moverT(it,p){
  const P=it.path,x=P.x0+(P.x1-P.x0)*p,y=P.y0+(P.y1-P.y0)*p,o=K[it.k].orient;
  if(o==='rotate') return `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${P.dir})`;
  if(o==='flip') return `translate(${x.toFixed(1)},${y.toFixed(1)})${Math.cos(P.dir*Math.PI/180)<-.1?' scale(-1,1)':''}`;
  if(o==='bob') return `translate(${x.toFixed(1)},${(y-Math.abs(Math.sin(p*Math.PI*14))*2).toFixed(1)})`;
  if(o==='spin') return `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(p*P.dist*3*(Math.cos(P.dir*Math.PI/180)<0?-1:1)).toFixed(1)})`;
  return `translate(${x.toFixed(1)},${y.toFixed(1)})`;
}
const staticG=(it,col,extra='')=>`<g transform="translate(${it.x.toFixed(1)},${it.y.toFixed(1)})"${extra}>${kindSVG(it.k,col)}</g>`;
function arrow(x,y,dir,len,color,dashed){
  const r=dir*Math.PI/180,x2=x+Math.cos(r)*len,y2=y+Math.sin(r)*len;
  const ah=9,a1=r+2.6,a2=r-2.6;
  return `<g><line x1="${x}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="4" stroke-linecap="round"${dashed?' stroke-dasharray="2 7"':''}/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${(x2+Math.cos(a1)*ah).toFixed(1)} ${(y2+Math.sin(a1)*ah).toFixed(1)}L${(x2+Math.cos(a2)*ah).toFixed(1)} ${(y2+Math.sin(a2)*ah).toFixed(1)}Z" fill="${color}"/></g>`;
}
function sceneSVG(sc,mode,o={}){
  let s=`<svg class="stage" id="stage" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ewVig" cx="50%" cy="50%" r="70%"><stop offset="65%" stop-color="#1E2430" stop-opacity="0"/><stop offset="100%" stop-color="#1E2430" stop-opacity=".16"/></radialGradient></defs>${sc.tpl.bg()}<rect width="${W}" height="${H}" fill="url(#ewVig)" pointer-events="none"/>`;
  if(mode==='bg') return s+'</svg>';
  const statics=sc.items.filter(i=>!i.path).sort((a,b)=>a.y-b.y);
  const movers=sc.items.filter(i=>i.path);
  if(mode==='view'){
    for(const it of statics) s+=staticG(it,it.hex);
    s+=`<g id="mv">`+movers.map((it,i)=>`<g data-m="${i}" transform="${moverT(it,0)}">${kindSVG(it.k,it.hex)}</g>`).join('')+`</g>`;
    return s+'</svg>';
  }
  if(mode==='recall'){
    const a=o.ans,step=o.step;
    for(const it of statics){
      if(it===sc.place) continue;
      if(it===sc.color){
        const col=a.color?PAL[a.color]:GRAY;
        s+=staticG(it,col);
        if(step===2&&!a.color) s+=`<g class="pulse"><circle cx="${it.x}" cy="${it.y+K[it.k].cy}" r="27" fill="none" stroke="#1E2430" stroke-width="2.5" stroke-dasharray="5 5"/></g><g transform="translate(${clamp(it.x+20,10,W-10)},${clamp(it.y+K[it.k].cy-22,10,H-10)})"><circle r="9" fill="#1E2430"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="DM Sans,sans-serif">?</text></g>`;
        continue;
      }
      s+=staticG(it,it.hex);
    }
    const m=sc.move;
    const mcol=step===1?'#1E2430':'rgba(30,36,48,.35)';
    const amx=m.askAt?m.askAt[0]:m.path.mx,amy=m.askAt?m.askAt[1]:m.path.my+K[m.k].cy;
    s+=`<g${step===1?' class="pulse"':''}><circle cx="${amx}" cy="${amy}" r="22" fill="rgba(255,255,255,.35)" stroke="${mcol}" stroke-width="2.5" stroke-dasharray="5 5"/></g>`;
    if(a.dir!=null) s+=arrow(amx,amy,a.dir,42,'#1E2430');
    const pa=a.place;
    s+=`<g id="ansPlace" ${pa?`transform="translate(${pa.x.toFixed(1)},${pa.y.toFixed(1)})"`:'style="display:none"'}>${kindSVG(sc.place.k,sc.place.hex)}</g>`;
    return s+'</svg>';
  }
  if(mode==='reveal'){
    const a=o.ans,r=o.res;
    // movement trails
    for(const it of movers){
      const P=it.path,cy=K[it.k].cy;
      if(it===sc.move) s+=`<line x1="${P.x0}" y1="${P.y0+cy}" x2="${P.x1}" y2="${P.y1+cy}" stroke="#fff" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" opacity=".9"/>`;
    }
    for(const it of statics){
      if(it===sc.color&&a.color!==it.color) s+=staticG(it,it.hex);
      else s+=staticG(it,it.hex);
    }
    // placement overlay
    const pl=sc.place,cy=K[pl.k].cy;
    if(a.place){
      s+=`<line x1="${a.place.x.toFixed(1)}" y1="${(a.place.y+cy).toFixed(1)}" x2="${pl.x.toFixed(1)}" y2="${(pl.y+cy).toFixed(1)}" stroke="#1E2430" stroke-width="2" stroke-dasharray="4 4"/>`;
      s+=`<g opacity=".5" transform="translate(${a.place.x.toFixed(1)},${a.place.y.toFixed(1)})">${kindSVG(pl.k,pl.hex)}</g>`;
    }
    s+=`<circle cx="${pl.x}" cy="${pl.y+cy}" r="28" fill="none" stroke="${scoreCol(r[0])}" stroke-width="3"/>`;
    s+=tagSVG(pl.x,pl.y+cy-36<14?pl.y+cy+36:pl.y+cy-36,r[0]+'%',scoreCol(r[0]));
    // colour overlay
    const co=sc.color,ccy=K[co.k].cy;
    s+=`<circle cx="${co.x}" cy="${co.y+ccy}" r="28" fill="none" stroke="${scoreCol(r[2])}" stroke-width="3"/>`;
    const pillY=co.y+ccy+40>H-14?co.y+ccy-40:co.y+ccy+40;
    s+=`<g transform="translate(${clamp(co.x,48,W-48)},${clamp(pillY,13,H-13)})"><rect x="-46" y="-11" width="92" height="22" rx="11" fill="#1E2430"/><text x="8" y="4.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff" font-family="DM Sans,sans-serif">you: ${a.color||'—'}</text><circle cx="-33" cy="0" r="5.5" fill="${a.color?PAL[a.color]:'#888'}" stroke="#fff" stroke-width="1.5"/></g>`;
    // direction overlay
    const m=sc.move,mx=m.path.mx,my=m.path.my+K[m.k].cy;
    if(a.dir!=null&&a.dir!==m.path.dir) s+=arrow(mx,my,a.dir,46,scoreCol(r[1]));
    s+=arrow(mx,my,m.path.dir,58,'#2E9E5B');
    s+=`<g id="mv">`+movers.map((it,i)=>`<g data-m="${i}" transform="${moverT(it,0)}">${kindSVG(it.k,it.hex)}</g>`).join('')+`</g>`;
    return s+'</svg>';
  }
}
function tagSVG(x,y,t,col){return `<g transform="translate(${clamp(x,24,W-24)},${clamp(y,14,H-14)})"><rect x="-22" y="-11" width="44" height="22" rx="11" fill="${col}"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="DM Sans,sans-serif">${t}</text></g>`}

/* ---------- scoring ---------- */
function scorePlace(sc,a){if(!a)return 0;const d=Math.hypot(a.x-sc.place.x,a.y-sc.place.y);return d<=15?100:Math.max(0,Math.round(100*(1-(d-15)/105)))}
function scoreDir(sc,d){if(d==null)return 0;let diff=Math.abs(d-sc.move.path.dir)%360;if(diff>180)diff=360-diff;return diff===0?100:diff===45?50:0}

function save(d){try{localStorage.setItem(SKEY,JSON.stringify(d))}catch(e){}}
let store=load();
function dkey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
const TODAY=dkey(new Date());
const EPOCH=new Date(2026,10,5,12);
const dayNo=Math.round((new Date(TODAY+'T12:00:00')-EPOCH)/864e5)+1;
function streak(){let n=0;const d=new Date();if(!(store.days[dkey(d)]||{}).done)d.setDate(d.getDate()-1);while((store.days[dkey(d)]||{}).done){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- game state ---------- */
const $=s=>document.querySelector(s);
const main=$('#main');
let G=null,animTok=0;
function newGame(key,practice){
  G={key,practice,scenes:buildScenes(key),idx:0,results:[]};
  if(!practice){
    const d=store.days[key];
    if(d){G.results=d.results||[];G.idx=G.results.length;G.viewed=d.viewed||[]}
    else G.viewed=[];
  } else G.viewed=[];
}
function persist(){if(G.practice)return;store.days[G.key]={results:G.results,viewed:G.viewed,done:G.results.length>=3,total:G.results.reduce((s,r)=>s+r.scores.reduce((a,b)=>a+b,0),0)};save(store)}
const LETTERS=['A','B','C'];

function hdr(){const d=new Date();$('#hdrDate').innerHTML=`<strong>No. ${dayNo}</strong><br>${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}`}

function stageWrap(sc,inner,label,right){return `<div class="stagewrap screen"><div class="exhibit"><span class="tag">Exhibit ${LETTERS[G.idx]}</span><span>${label}</span><span>${right||''}</span></div><div class="stagebox" id="sbox">${inner}</div>${'<div class="bar" id="bar"><i id="bari"></i></div>'}</div>`}

/* ---------- screens ---------- */
function intro(){
  animTok++;
  const sc=G.scenes[0];
  const st=streak();
  const goLabel=G.idx>0&&G.idx<3?`Continue · scene ${G.idx+1} of 3`:'Watch today’s scene';
  main.innerHTML=`<div class="screen">
   <div class="stagewrap"><div class="exhibit"><span class="tag">Today’s case</span><span>${G.scenes.map(s=>s.tpl.icon+' '+s.tpl.short).join(' · ')}</span></div>
   <div class="stagebox">${sceneSVG(sc,'bg')}<div class="ov dim">${ICO.eye}</div></div></div>
   <h1 class="intro">You saw it for five seconds. What do you remember?</h1>
   <p class="lede">Watch three short scenes. After each one disappears, put it back together. You’ll be asked about <b>where things were</b>, <b>what they looked like</b> and <b>which way they moved</b> — but not which ones. The last scene is the busiest.</p>
   <div class="facts"><div><b>3</b><span>scenes</span></div><div><b>5s</b><span>to watch each</span></div><div><b>3</b><span>questions each</span></div></div>
   <div class="row"><button class="btn accent" id="go">${goLabel}</button><button class="btn ghost small" id="prac">Practice round</button></div>
   ${st?`<p class="hint">🔥 ${st}-day streak</p>`:''}
   <details><summary>How scoring works</summary><p>Each question is worth 100 points, 900 a day. Placement gets partial credit the closer you are. Direction gets full credit if exact and half if you’re one notch (45°) off. Colors are right or wrong.</p><p>You get one scored viewing per scene. You can replay a scene before answering, but that scene is marked <span class="assist">assisted</span> on your result.</p><p>On a phone, drag the object into the scene, or tap it and then tap the spot. With a keyboard, focus the object, press Enter to drop it in the middle, then use the arrow keys.</p></details></div>`;
  $('#go').onclick=()=>{if(G.idx>=3)return final();ready()};
  $('#prac').onclick=()=>{newGame('practice-'+Date.now(),true);ready()};
}
function ready(){
  animTok++;
  const sc=G.scenes[G.idx];
  G.cur={step:0,ans:{place:null,dir:null,color:null},assisted:!!G.viewed[G.idx]};
  main.innerHTML=stageWrap(sc,sceneSVG(sc,'bg')+`<div class="ov dim"><button class="btn accent" id="watch"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M1 1.5v13L13 8z" fill="#fff"/></svg>Watch · 5 seconds</button></div>`,sc.tpl.icon+' '+sc.tpl.name,`${G.idx+1} / 3`)+
   `<div class="panel"><div class="kicker">${G.practice?'Practice · ':''}Scene ${G.idx+1} of 3${sc.busy?' · busy scene':''}</div><p class="prompt">${sc.busy?'One more thing to keep track of this time. Positions, colors and movement are all fair game.':'Watch closely. Positions, colors and movement are all fair game.'}</p>${G.cur.assisted?'<p class="hint"><span class="assist">assisted</span> You already opened this scene, so it will count as assisted.</p>':''}</div>`;
  $('#watch').onclick=()=>view(false);
}
function view(isReplay){
  const tok=++animTok;
  const sc=G.scenes[G.idx];
  const sbox=$('#sbox');
  sbox.innerHTML=sceneSVG(sc,'bg')+`<div class="ov"><div class="count tick" id="cnt">3</div></div>`;
  $('#bari').style.transform='scaleX(1)';
  const panel=main.querySelector('.panel');
  if(panel) panel.innerHTML=`<div class="kicker">Scene ${G.idx+1} of 3${isReplay?' · replay':''}</div><p class="prompt">Get ready…</p>`;
  let n=3;
  const tick=()=>{if(tok!==animTok)return;n--;if(n>0){const c=$('#cnt');c.textContent=n;c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');setTimeout(tick,650)}else start()};
  setTimeout(tick,650);
  function start(){
    if(!isReplay&&!G.practice){G.viewed[G.idx]=true;persist()}
    sbox.innerHTML=sceneSVG(sc,'view');
    if(panel) panel.innerHTML=`<div class="kicker">Scene ${G.idx+1} of 3${isReplay?' · replay':''}</div><p class="prompt pulse">Watching…</p>`;
    const movers=sc.items.filter(i=>i.path);
    const els=[...sbox.querySelectorAll('#mv > g')];
    const t0=performance.now();const bar=$('#bari');
    const frame=now=>{
      if(tok!==animTok)return;
      const p=Math.min(1,(now-t0)/VIEW_MS);
      els.forEach((e,i)=>e.setAttribute('transform',moverT(movers[i],p)));
      bar.style.transform=`scaleX(${1-p})`;
      if(p<1) requestAnimationFrame(frame); else setTimeout(()=>{if(tok===animTok)recall()},120);
    };
    requestAnimationFrame(frame);
  }
}
function recall(){
  animTok++;
  const sc=G.scenes[G.idx],cur=G.cur;
  main.innerHTML=stageWrap(sc,'',sc.tpl.icon+' '+sc.tpl.name,`${G.idx+1} / 3`)+`<div class="panel" id="panel"></div>`;
  $('#bar').style.display='none';
  drawRecall();
}
function drawRecall(){
  const sc=G.scenes[G.idx],cur=G.cur,a=cur.ans,step=cur.step;
  $('#sbox').innerHTML=sceneSVG(sc,'recall',{ans:a,step});
  const svg=$('#stage');
  const dots=`<span class="dots">${[0,1,2].map(i=>`<i class="${i===step?'on':i<step?'done':''}"></i>`).join('')}</span>`;
  const kick=`<div class="kicker">${dots}Question ${step+1} of 3 ${cur.assisted?'<span class="assist">assisted</span>':''}</div>`;
  const acts=(ok)=>`<div class="row split actions"><button class="btn" id="lock" ${ok?'':'disabled'}>Lock in</button><button class="btn ghost small" id="replay">↺ Replay (assisted)</button></div>`;
  let html='';
  if(step===0){
    html=kick+`<p class="prompt">Put the <b>${lab(sc.place)}</b> back where ${sc.place.pl?'they were':'it was'}.</p>
    <div class="tray"><div class="titem${cur.sel?' sel':''}${a.place?' used':''}" id="titem" tabindex="0" role="button" aria-label="${lab(sc.place)}: press Enter to drop it in the scene, then move it with the arrow keys">${iconSVG(sc.place.k,sc.place.hex)}</div><div class="traytext">${a.place?'Drag inside the scene to adjust.':'Drag it into the scene, or tap it and then tap the spot.'}</div></div>`+acts(!!a.place);
  } else if(step===1){
    const m=sc.move;
    const btn=d=>`<button data-d="${d}" class="${a.dir===d?'sel':''}" aria-label="${DIRN[d]}"><svg width="30" height="30" viewBox="-15 -15 30 30"><path d="M-9 0H9M3-6L9 0 3 6" stroke="#1E2430" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${d})"/></svg></button>`;
    html=kick+`<p class="prompt">Which way was the <b>${lab(m)}</b> moving?</p>
    <div class="compass">${btn(225)}${btn(270)}${btn(315)}${btn(180)}<div class="mid">${iconSVG(m.k,m.hex).replace('<svg ','<svg width="44" height="44" ')}</div>${btn(0)}${btn(135)}${btn(90)}${btn(45)}</div>`+acts(a.dir!=null);
  } else {
    const c=sc.color;
    html=kick+`<p class="prompt">${c.cq||`What color was the <b>${c.name}</b>?`}</p>
    <div class="swatches">${PNAMES.map(n=>`<button class="sw${a.color===n?' sel':''}" data-c="${n}" style="background:${PAL[n]}" aria-label="${n}"></button>`).join('')}</div>`+acts(!!a.color);
  }
  $('#panel').innerHTML=html;
  $('#replay').onclick=()=>{cur.assisted=true;replayThen()};
  $('#lock').onclick=()=>{if(cur.step<2){cur.step++;cur.sel=false;drawRecall()}else reveal()};
  if(step===0) wirePlace(svg);
  if(step===1) document.querySelectorAll('.compass button[data-d]').forEach(b=>b.onclick=()=>{a.dir=+b.dataset.d;drawRecall()});
  if(step===2) document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{a.color=b.dataset.c;drawRecall()});
}
function replayThen(){
  // show stage again with countdown and replay; then return to recall at same step
  const sc=G.scenes[G.idx];
  main.innerHTML=stageWrap(sc,sceneSVG(sc,'bg'),sc.tpl.icon+' '+sc.tpl.name,`${G.idx+1} / 3`)+`<div class="panel"></div>`;
  view(true);
}
function svgPt(svg,cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const r=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:clamp(r.x,0,W),y:clamp(r.y,0,H)}}
function wirePlace(svg){
  const sc=G.scenes[G.idx],cur=G.cur,a=cur.ans,cy=K[sc.place.k].cy;
  svg.classList.add('placing');
  const ap=()=>svg.querySelector('#ansPlace');
  const setPos=(cx,cyy)=>{const p=svgPt(svg,cx,cyy);a.place={x:p.x,y:clamp(p.y-cy,0,H)};const e=ap();e.style.display='';e.setAttribute('transform',`translate(${a.place.x.toFixed(1)},${a.place.y.toFixed(1)})`)};
  const done=()=>{cur.sel=false;const l=$('#lock');l.disabled=false;const ti=$('#titem');ti.classList.remove('sel');ti.classList.add('used');document.querySelector('.traytext').textContent='Drag inside the scene to adjust.'};
  let down=false;
  svg.addEventListener('pointerdown',e=>{if(!cur.sel&&!a.place)return;down=true;svg.setPointerCapture(e.pointerId);setPos(e.clientX,e.clientY);e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(down)setPos(e.clientX,e.clientY)});
  const up=()=>{if(down){down=false;done()}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  // tray drag
  const ti=$('#titem'),ghost=$('#ghost');
  let drag=null;
  ti.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};ti.setPointerCapture(e.pointerId);e.preventDefault()});
  ti.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.moved=true;ghost.innerHTML=iconSVG(sc.place.k,sc.place.hex)}
    if(!drag.moved)return;
    const r=svg.getBoundingClientRect();
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(inside){ghost.style.display='none';setPos(e.clientX,e.clientY)}
    else{ghost.style.display='block';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
  });
  const tup=e=>{
    if(!drag)return;
    ghost.style.display='none';
    if(!drag.moved){cur.sel=!cur.sel;ti.classList.toggle('sel',cur.sel);if(cur.sel)document.querySelector('.traytext').textContent='Now tap the spot in the scene.'}
    else{const r=svg.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){setPos(e.clientX,e.clientY);done()}else if(a.place)done()}
    drag=null;
  };
  ti.addEventListener('pointerup',tup);ti.addEventListener('pointercancel',()=>{drag=null;ghost.style.display='none';if(a.place)done()});
  // keyboard: Enter/Space drops the object mid-scene (or toggles), arrows nudge it
  const kset=(x,y)=>{a.place={x:clamp(x,0,W),y:clamp(y,0,H)};const e=ap();e.style.display='';e.setAttribute('transform',`translate(${a.place.x.toFixed(1)},${a.place.y.toFixed(1)})`)};
  ti.addEventListener('keydown',e=>{
    const st=e.shiftKey?24:6,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!a.place){kset(W/2,H/2-cy);done();document.querySelector('.traytext').textContent='Use the arrow keys to move it (Shift for bigger steps).'}else $('#lock').focus();return}
    if(mv&&a.place){e.preventDefault();kset(a.place.x+mv[0],a.place.y+mv[1])}
  });
}
function reveal(){
  const tok=++animTok;
  const sc=G.scenes[G.idx],cur=G.cur,a=cur.ans;
  const r=[scorePlace(sc,a.place),scoreDir(sc,a.dir),scoreColor(sc,a.color)];
  const res={scores:r,assisted:cur.assisted,t:sc.tpl.id};
  G.results[G.idx]=res;persist();
  const tot=r[0]+r[1]+r[2];
  main.innerHTML=stageWrap(sc,sceneSVG(sc,'reveal',{ans:a,res:r}),sc.tpl.icon+' '+sc.tpl.name,`${G.idx+1} / 3`)+`<div class="panel">
   <div class="sceneTotal"><span>Scene ${G.idx+1} ${cur.assisted?'<span class="assist">assisted</span>':''}</span><span class="big">${tot}<small style="font-size:15px;color:var(--muted);font-family:DM Sans"> / 300</small></span></div>
   <ul class="results">
    <li><span class="ic" style="background:${scoreCol(r[0])};color:${scoreCol(r[0])}">${ICO.pin}</span><span class="t">Placed the ${sc.place.name}<small>${r[0]>=95?'Right on the spot.':r[0]>=70?'Close — just a little off.':r[0]>0?'In the neighborhood, but not quite.':'It was somewhere else entirely.'} The faded copy is your guess.</small></span><span class="pts">${r[0]}</span></li>
    <li><span class="ic" style="background:${scoreCol(r[1])}">${ICO.arrow}</span><span class="t">The ${sc.move.name} went ${DIRN[sc.move.path.dir]}<small>${r[1]===100?'You called it.':`You said ${DIRN[a.dir]}${r[1]===50?' — one notch off, half credit.':'.'}`}</small></span><span class="pts">${r[1]}</span></li>
    <li><span class="ic" style="background:${scoreCol(r[2])}">${ICO.drop}</span><span class="t">The ${sc.color.cname||sc.color.name} ${(sc.color.cpl??sc.color.pl)?'were':'was'} <span class="cdot" style="background:${sc.color.hex}"></span>${sc.color.color}<small>${r[2]?'Correct.':`You said <span class="cdot" style="background:${PAL[a.color]}"></span>${a.color}.`}</small></span><span class="pts">${r[2]}</span></li>
   </ul>
   <div class="row actions"><button class="btn accent" id="next">${G.idx<2?'Next scene →':'See today’s result'}</button></div></div>`;
  if(!reduceMotion()){const big=main.querySelector('.sceneTotal .big');const tn=big.firstChild;const t1=performance.now();const up=now=>{if(tok!==animTok)return;const q=Math.min(1,(now-t1)/600);tn.nodeValue=String(Math.round(tot*(1-Math.pow(1-q,3))));if(q<1)requestAnimationFrame(up)};tn.nodeValue='0';requestAnimationFrame(up)}
  $('#bar').style.display='none';
  $('#next').onclick=()=>{G.idx++;if(G.idx<3)ready();else final()};
  // loop the movers
  const movers=sc.items.filter(i=>i.path),els=[...document.querySelectorAll('#mv > g')];
  const t0=performance.now();
  const frame=now=>{if(tok!==animTok)return;const p=((now-t0)%(VIEW_MS+900))/VIEW_MS;els.forEach((e,i)=>e.setAttribute('transform',moverT(movers[i],Math.min(1,p))));requestAnimationFrame(frame)};
  requestAnimationFrame(frame);
}
function rank(t){return t>=820?'Photographic memory':t>=680?'Sharp-eyed witness':t>=500?'Reliable witness':t>=300?'Hazy recollection':'Were you even there?'}
function shareText(){
  const tot=G.results.reduce((s,r)=>s+r.scores.reduce((a,b)=>a+b,0),0);
  const anyA=G.results.some(r=>r.assisted);
  const lines=G.results.map((r,i)=>{const t=TEMPLATES.find(x=>x.id===r.t)||G.scenes[i].tpl;return `${t.icon} ${r.scores.map(scoreEmoji).join('')}${r.assisted?' ↺':''}`});
  return `Eyewitness ${G.practice?'(practice)':'No. '+dayNo} — ${tot}/900${anyA?' (assisted)':''}\n${lines.join('\n')}`;
}
function final(){
  animTok++;
  const tot=G.results.reduce((s,r)=>s+r.scores.reduce((a,b)=>a+b,0),0);
  const st=streak();
  const days=Object.values(store.days).filter(d=>d.done);
  const best=days.filter(d=>!(d.results||[]).some(r=>r&&r.assisted)).reduce((m,d)=>Math.max(m,d.total||0),0);
  main.innerHTML=`<div class="final screen">
   <div class="kicker" style="justify-content:center">${G.practice?'Practice round':'Case closed · No. '+dayNo}</div>
   <div class="score">${tot}</div><div class="of">out of 900${G.results.some(r=>r.assisted)?' · <span class="assist">assisted</span>':''}</div>
   <div class="stamp">${rank(tot)}</div>
   <div class="srows">${G.results.map((r,i)=>{const t=TEMPLATES.find(x=>x.id===r.t)||G.scenes[i].tpl;const s=r.scores.reduce((a,b)=>a+b,0);return `<div class="srow"><span>${t.icon}</span><span class="nm">${t.name} ${r.assisted?'<span class="assist">assisted</span>':''}</span><span class="em">${r.scores.map(scoreEmoji).join('')}</span><span class="pt">${s}</span></div>`}).join('')}</div>
   ${G.practice?'':`<div class="stats"><div><b>${st}</b><span>day streak</span></div><div><b>${days.length}</b><span>cases solved</span></div><div><b>${best}</b><span>best score</span></div></div>`}
   <div class="row" style="justify-content:center"><button class="btn accent" id="share">Copy result</button><button class="btn ghost" id="again">${G.practice?'Another practice round':'Practice round'}</button></div>
   <textarea class="sharebox" id="sbx" readonly></textarea>
   ${G.practice?'<p class="hint"><button class="linkbtn" id="back">← Back to today’s case</button></p>':`<p class="hint" id="nextin" aria-live="off"></p>`}
  </div>`;
  $('#share').onclick=()=>{const t=shareText();const fb=()=>{const b=$('#sbx');b.style.display='block';b.value=t;b.select();toast('Select and copy the text below')};try{navigator.clipboard.writeText(t).then(()=>toast('Copied — paste it anywhere'),fb)}catch(e){fb()}};
  $('#again').onclick=()=>{newGame('practice-'+Date.now(),true);ready()};
  if(G.practice) $('#back').onclick=e=>{e.preventDefault();newGame(TODAY,false);G.idx>=3?final():intro()};
  else{const tick=()=>{const el=$('#nextin');if(!el)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-n)/1000));if(s===0||dkey(n)!==TODAY){el.textContent='A new case is ready. Reload the page to play it.';return}el.textContent=`Next case in ${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;setTimeout(tick,1000)};tick()}
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}

hdr();
newGame(TODAY,false);
if(G.idx>=3) final(); else intro();
// expose for testing
window.__EW={get G(){return G},genScene,sceneSVG,TEMPLATES,mulberry,hashStr,K,kRect,rGap,obGap,frameGap,moverRectAt,dayTemplates,buildScenes};
})();
</script>
