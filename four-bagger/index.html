<style>
:root{--bg:#10221c;--panel:#183128;--cream:#f5ecd7;--dim:#b9b39f;--red:#d2402f;--gold:#f0b43c;--line:rgba(245,236,215,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#1d3b30,var(--bg) 70%);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:8px 10px 10px}
header{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
header h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;margin:0;letter-spacing:-.02em}
header h1 span{color:var(--gold)}
header .num{color:var(--dim);font-size:13px;margin-right:auto}
.icon{background:var(--panel);border:1px solid var(--line);color:var(--cream);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;gap:6px}
#hud b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;display:block;color:var(--cream)}
#hud .l{color:var(--dim)} #hud .r{text-align:right;color:var(--dim)}
#rack{display:flex;gap:5px}
#rack i{width:15px;height:15px;border-radius:4px;background:var(--red);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:block;transition:.2s}
#rack i.used{background:rgba(245,236,215,.12);box-shadow:none}
#rack i.pick{outline:2px solid var(--gold);outline-offset:1px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0}
canvas{border-radius:14px;touch-action:manipulation;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast{position:absolute;left:50%;top:33%;transform:translate(-50%,0);background:rgba(16,34,28,.92);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;max-width:86%}
#toast.show{opacity:1}
#toast b{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;display:block}
#controls{display:flex;gap:8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1.3}
.seg button,.dbl{flex:1;background:none;border:0;color:var(--dim);font:700 14px 'DM Sans',sans-serif;border-radius:9px;padding:6px 4px;cursor:pointer;line-height:1.15}
.seg button small,.dbl small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.seg button.on{background:var(--cream);color:#1b2a22}
.dbl{background:var(--panel);border:1px solid var(--line);flex:1}
.dbl.on{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.dbl:disabled,.seg button:disabled{opacity:.4;cursor:default}
#hint{text-align:center;color:var(--dim);font-size:12.5px;padding:7px 0 0;min-height:24px}
#hint b{color:var(--cream)}
#overlay{position:fixed;inset:0;background:rgba(6,14,11,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:10;backdrop-filter:blur(3px)}
#overlay.show{display:flex}
#overlay.sheet{align-items:flex-end;background:rgba(6,14,11,.38);backdrop-filter:none}
#overlay.sheet .card{max-height:56dvh}
.chip.tw{background:#1d3a2f;color:#f5ecd7;border-color:#1d3a2f;font-weight:700}
#hud b small{font-size:11px;color:var(--gold);font-weight:700;margin-right:6px;font-family:'DM Sans',sans-serif}
.card{background:#f6eedb;color:#24291f;border-radius:18px;max-width:420px;width:100%;max-height:92dvh;overflow:auto;padding:20px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;margin:2px 0 6px;letter-spacing:-.02em;line-height:1.05}
.kick{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a6a3c;font-weight:700}
.match{display:flex;align-items:center;gap:10px;background:#efe3c7;border-radius:12px;padding:10px 12px;margin:10px 0}
.match .sw{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.match .vs{font-weight:800;color:#8a6a3c;font-size:12px}
.match div.t{font-size:13px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#fff8e8;border:1px solid #e2d3b0;border-radius:999px;padding:4px 10px;font-size:12px}
.card ul{padding-left:18px;margin:8px 0;font-size:13.5px;line-height:1.45}
.card li{margin:3px 0}
.legend{display:flex;gap:10px;align-items:center;margin:10px 0}
.mini{width:62px;height:118px;border-radius:5px;position:relative;overflow:hidden;flex:none;border:2px solid #3e2512}
.mini div{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque',sans-serif;color:rgba(40,20,8,.55)}
.mini .h{width:18px;height:18px;border-radius:50%;background:#120a05;left:20px;right:auto;top:14px;color:#f0b43c;font-size:11px}
.btn{display:block;width:100%;background:#1d3a2f;color:var(--cream);border:0;border-radius:12px;padding:13px;font:800 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;margin-top:10px}
.stick{position:sticky;bottom:-18px;background:linear-gradient(rgba(246,238,219,0),#f6eedb 30%);padding:6px 0 14px;margin-bottom:-14px}
.card ul{padding-left:18px;margin:6px 0;font-size:13.5px;line-height:1.4}
@media (max-width:420px){.card{padding:16px 16px 14px}.card h2{font-size:24px}.chip{font-size:11.5px;padding:3px 9px}}
.btn.alt{background:#e9dcbd;color:#2b2a20}
.big{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;font-weight:800;line-height:1;margin:6px 0 2px}
.big small{font-size:18px;color:#7a6a4a;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
td{padding:5px 2px;border-bottom:1px solid #e3d5b4}
td:last-child{text-align:right;font-weight:700}
pre{background:#fff8e8;border:1px solid #e2d3b0;border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;margin:8px 0 0;font-family:inherit}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.stats b{display:block;font:800 20px 'Bricolage Grotesque',sans-serif}
.stats span{font-size:11px;color:#7a6a4a}
.muted{color:#7a6a4a;font-size:12.5px}
.tag{display:inline-block;background:#1d3a2f;color:#f5ecd7;border-radius:6px;padding:2px 7px;font-size:11.5px;margin:2px 3px 2px 0}
</style>

<div id="app">
  <header>
    <h1>Four <span>Bagger</span></h1><div class="num" id="num"></div>
    <button class="icon" id="muteBtn" title="Sound">🔊</button>
    <button class="icon" id="helpBtn" title="How to play">?</button>
  </header>
  <div id="hud">
    <div class="l"><span id="hFrame">Frame 1 / 3</span><b id="hWind">Calm</b></div>
    <div id="rack"></div>
    <div class="r">Score · target <span id="hTarget">–</span><b id="hScore">0</b></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="controls">
    <div class="seg" id="shotSeg">
      <button data-shot="slide" class="on">Slide<small>lands short, slides</small></button>
      <button data-shot="lob">Lob<small>high arc, sticks</small></button>
    </div>
    <button class="dbl" id="dblBtn">Stack 2<small>×2 pts · off board −2</small></button>
  </div>
  <div id="hint"></div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
// PHYS-START
const BW=12, BL=48, HOLE={x:0,y:39,r:3}, CAP=2.4, AIRCAP=1.9, DT=1/120, E=0.55;
// v2 tuning: sweep periods (s), max speed a bag can drop at (faster bags ride over the hole),
// a stacked double is wider so it needs a more central line to drop.
const V2={AIM_PERIOD:1.9,POW_PERIOD:2.0,VCAP:34,CAP_DBL:1.6,AIRCAP_DBL:1.3,STACK_OFF:-2};
const SHOTS={slide:{vy:50,drift:0.45,dur:0.8,peak:55},lob:{vy:22,drift:1.4,dur:1.2,peak:140}};
const YMIN=-12, YSPAN=66, AIMX=16;
const SURFACES=[{id:'slick',name:'Fresh wax',desc:'slick, bags slide a long way',mu:48},{id:'normal',name:'Broken in',desc:'normal slide',mu:70},{id:'sticky',name:'Muggy night',desc:'sticky, bags grab early',mu:105},
  {id:'glass',name:'Glass board',desc:'just waxed, bags fly',mu:38},{id:'soaked',name:'Soaked board',desc:'wet wood, slides die fast',mu:150}];
const VENUES=["Uncle Ray's Backyard","Tailgate · Lot C","Lakeside Cabin","Brewery Patio","Cul-de-sac Classic","Ski Lodge Deck","Church Picnic Lawn","Rooftop Bar","Fire Station Cookout","Campground Site 14",
  "County Fair Midway","Beach Volleyball Courts","Grandma's Porch","Office Parking Garage","Wedding Reception Lawn","Fourth of July Block Party","Dive Bar Back Lot","Marina Dock","Frat Row Front Yard","Farmers Market Square",
  "Little League Bleachers","Apple Orchard","Barn Dance","Pumpkin Patch","Food Truck Rally","Riverside Pavilion","The 19th Hole","Mountain Trailhead","Alley Behind the Diner","Community Pool Deck"];
const OPPS=[{n:'The Lake Effect',c:'#2f7fc1'},{n:'Bag Daddies',c:'#e1a42b'},{n:'Corn Stars',c:'#7c4dbd'},{n:'Hole Patrol',c:'#1f9e8a'},{n:'Sack Attack',c:'#e07a2e'},{n:'Kernel Panic',c:'#cdb935'},{n:'The Woodies',c:'#5aa04a'},{n:'Toss Bosses',c:'#c2477f'},{n:'Cob Squad',c:'#3d4fb8'},{n:'Dirty Rags',c:'#8a8f98'},
  {n:'Bean Counters',c:'#9a6b3f'},{n:'Slide Rules',c:'#3f9fb8'},{n:'Lucky Ducks',c:'#2e8b57'},{n:'Sweet Corn Society',c:'#d4a017'},{n:'Board Members',c:'#6a5acd'}];
const TWISTS=[
  {id:'crowded',name:'Crowded board',desc:'an extra blocker in every frame'},
  {id:'gusty',name:'Gusty',desc:'the wind changes before every throw'},
  {id:'wall',name:'The Wall',desc:'frame 3 has a bag parked right in front of the hole'},
  {id:'glass',name:'Glass board',desc:'just waxed and dead calm: bags fly'},
  {id:'rain',name:'Rain delay',desc:'soaked board, slides die fast'},
  {id:'cross',name:'Crosswind',desc:'strong wind in every frame'}];
const EPOCH=Date.UTC(2026,10,5);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dayIndex(key){const p=key.split('-').map(Number);return Math.round((Date.UTC(p[0],p[1]-1,p[2])-EPOCH)/864e5)}
// Daily schedule: venue cycles through 30 (no repeat inside 30 days), opponent through 15 (no repeat inside 15),
// and every third day brings one of six twists (each twist comes back every 18 days).
function dayFor(key){const i=dayIndex(key),m=(n,k)=>((n%k)+k)%k;
  return makeDay(hashStr('fourbagger-'+key),{venue:VENUES[m(i*7,30)],opp:OPPS[m(i*4,15)],twist:m(i,3)===1?TWISTS[m(Math.floor(i/3),6)]:null})}
function placeBlockers(r,nb,bl){let tries=0;
  while(bl.length<nb&&tries<400){tries++;
    const first=bl.length===0;
    const x=first?(r()*2-1)*3.5:(r()*2-1)*8.5, y=first?20+r()*11:11+r()*24;
    if(Math.hypot(x-HOLE.x,y-HOLE.y)<7.5)continue;
    if(bl.some(b=>Math.hypot(b.x-x,b.y-y)<6.6))continue;
    bl.push({x:+x.toFixed(2),y:+y.toFixed(2),rot:+((r()*2-1)*.5).toFixed(3)});
  }return bl}
function makeDay(seed,sched){
  const r=mulberry32(seed); r();r();
  let venue=VENUES[Math.floor(r()*10)], opp=OPPS[Math.floor(r()*10)];
  const sr=r(); let surface=SURFACES[sr<.3?0:sr<.72?1:2];
  let twist=null;
  if(sched){venue=sched.venue;opp=sched.opp;twist=sched.twist}
  else if(r()<.5)twist=TWISTS[Math.floor(r()*TWISTS.length)];   // practice boards: random twist half the time
  const tid=twist&&twist.id;
  if(tid==='glass')surface=SURFACES[3];
  if(tid==='rain')surface=SURFACES[4];
  const frames=[0,1,2].map(i=>{
    const maxW=[3,6,8][i]; let wind=Math.round((r()*2-1)*maxW);
    if(tid==='glass')wind=0;
    if(tid==='cross'){const sg=r()<.5?-1:1;wind=sg*(4+Math.floor(r()*[2,3,4][i]))}
    let nb=[0,1+(r()<.5?1:0),2+(r()<.5?1:0)][i];
    if(tid==='crowded')nb+=1;
    const bl=[];
    if(tid==='wall'&&i===2)bl.push({x:+((r()*2-1)*.6).toFixed(2),y:33.2,rot:+((r()*2-1)*.3).toFixed(3)});
    placeBlockers(r,nb,bl);
    const f={wind,blockers:bl};
    if(tid==='gusty'){const g=[wind];for(let k=1;k<4;k++)g.push(Math.max(-9,Math.min(9,g[k-1]+Math.round((r()*2-1)*4))));f.winds=g}
    return f;
  });
  // targets calibrated from v2 bot runs: roughly the score of a steady casual player
  const base={glass:36,slick:36,normal:36,sticky:36,soaked:34}[surface.id];
  const windPen=frames.reduce((s,f)=>s+(Math.abs(f.wind)>=6?1:0),0);
  const twAdj={crowded:0,gusty:-2,wall:-1,glass:0,rain:0,cross:-3}[tid]||0;
  return {venue,opp,surface,frames,twist,target:base-windPen+twAdj};
}
function windAt(frame,used){return frame.winds?frame.winds[Math.min(3,used)]:frame.wind}
function landPoint(spec,wind){const S=SHOTS[spec.shot];const drift=wind*S.drift;return{x:spec.aimX+drift,y:YMIN+YSPAN*spec.t,drift}}
function slideLen(shot,mu){const v=SHOTS[shot].vy;return v*v/(2*mu)}
function zoneOf(y){return y<16?1:y<32?2:3}
function bagPts(b){if(b.status==='hole')return b.dbl?12:5;if(b.status!=='board')return b.dbl&&b.own?V2.STACK_OFF:0;const z=zoneOf(b.y);return b.dbl?z*2:z}
function makeBlockers(frame){return frame.blockers.map((p,i)=>({id:100+i,x:p.x,y:p.y,vx:0,vy:0,r:2.9,m:1,own:false,dbl:false,status:'board',rot:p.rot,bumped:false,how:''}))}
function landBag(bags,spec,wind,id){
  const S=SHOTS[spec.shot], lp=landPoint(spec,wind), dbl=!!spec.dbl;
  const b={id,x:lp.x,y:lp.y,vx:0,vy:0,r:dbl?3.2:2.9,m:dbl?2:1,own:true,dbl,status:'board',rot:(((id*37)%30)-15)*Math.PI/180,bumped:false,how:'',shot:spec.shot};
  const ev=[];
  if(lp.y<-2.5||lp.y>BL+1||Math.abs(lp.x)>BW+0.8){
    b.status='ground';b.how=lp.y<-2.5?'short':lp.y>BL+1?'long':'wide';
    if(b.how==='long')b.y=lp.y+5;
    ev.push({t:'grass',b});
  }else{
    b.y=Math.min(Math.max(lp.y,0.8),BL-0.3);b.x=Math.max(-BW+0.4,Math.min(BW-0.4,lp.x));
    if(spec.shot==='lob'&&Math.hypot(b.x-HOLE.x,b.y-HOLE.y)<(dbl?V2.AIRCAP_DBL:AIRCAP)){b.status='hole';b.how='airmail';ev.push({t:'airmail',b})}
    else{b.vy=S.vy;b.vx=S.vy*b.x/(330+b.y)+wind*(spec.shot==='lob'?0.25:0.12);ev.push({t:'land',b})}
  }
  bags.push(b);return ev;
}
function step(bags,mu,ev){
  let moving=false;const act=bags.filter(b=>b.status==='board');
  for(const b of act){const sp=Math.hypot(b.vx,b.vy);if(sp>0){const d=mu*DT;if(sp<=d){b.vx=b.vy=0}else{const k=(sp-d)/sp;b.vx*=k;b.vy*=k;b.x+=b.vx*DT;b.y+=b.vy*DT;b.rot+=b.vx*0.003;moving=true}}}
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],c=act[j];if(a.status!=='board'||c.status!=='board')continue;
    const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),mn=a.r+c.r;
    if(d<mn&&d>1e-6){const nx=dx/d,ny=dy/d,ov=mn-d,ta=c.m/(a.m+c.m),tc=a.m/(a.m+c.m);
      a.x-=nx*ov*ta;a.y-=ny*ov*ta;c.x+=nx*ov*tc;c.y+=ny*ov*tc;
      const vr=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
      if(vr>0){const sa=Math.hypot(a.vx,a.vy),sc=Math.hypot(c.vx,c.vy);const J=(1+E)*vr/(1/a.m+1/c.m);
        a.vx-=J/a.m*nx;a.vy-=J/a.m*ny;c.vx+=J/c.m*nx;c.vy+=J/c.m*ny;
        if(sa>sc)c.bumped=true;else a.bumped=true;moving=true;ev.push({t:'hit',b:a,o:c,j:J})}}
  }
  for(const b of act){if(b.status!=='board')continue;
    const dh=Math.hypot(b.x-HOLE.x,b.y-HOLE.y);
    if(dh<(b.dbl?V2.CAP_DBL:CAP)){
      if(b.bumped||!b.own||Math.hypot(b.vx,b.vy)<=V2.VCAP){b.status='hole';b.vx=b.vy=0;ev.push({t:b.own?(b.bumped?'jumper':'slider'):'oppHole',b});continue}
      else if(!b.over){b.over=1;ev.push({t:'over',b})}
    }
    if(Math.abs(b.x)>BW||b.y>BL||b.y<0){b.status='ground';if(Math.abs(b.x)>BW)b.x+=Math.sign(b.x)*3;if(b.y>BL)b.y+=4;if(b.y<0)b.y-=3;b.vx=b.vy=0;ev.push({t:b.own?'off':'cleared',b})}
  }
  return moving;
}
function settle(bags,mu,ev){let n=0;while(step(bags,mu,ev)&&n<6000)n++;return ev}
function frameScore(bags){
  let own=0,cleared=0,oops=0,allIn=true,any=false;
  for(const b of bags){if(b.own){any=true;own+=bagPts(b);if(b.status!=='hole')allIn=false}else{if(b.status==='ground')cleared++;if(b.status==='hole')oops++}}
  const four=any&&allIn?3:0;
  return {own,cleared,oops,four,total:own+cleared-3*oops+four};
}
// PHYS-END

/* ---------- view ---------- */
const CW=420,CH=680,DIST=300,CAMH=110,F=3550,CX=210,CY=612-F*(CAMH-3)/DIST;
const OWN='#d2402f';
function proj(X,Y,Z){const s=F/Z;return{x:CX+X*s,y:CY+(CAMH-Y)*s,s}}
function boardPt(x,y){return proj(x,3+9*y/48,DIST+y)}
function hAt(b){return b.status==='board'?3+9*Math.max(0,Math.min(BL,b.y))/BL:0}
function surfAt(X,Z){const yb=Z-DIST;return(Math.abs(X)<=BW&&yb>=0&&yb<=BL)?3+9*yb/BL:0}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let VS=1,DPR=1;
function fit(){const st=document.getElementById('stage');const w=st.clientWidth,h=st.clientHeight;VS=Math.min(w/CW,h/CH);DPR=window.devicePixelRatio||1;cv.style.width=CW*VS+'px';cv.style.height=CH*VS+'px';cv.width=Math.round(CW*VS*DPR);cv.height=Math.round(CH*VS*DPR)}
window.addEventListener('resize',fit);

/* ---------- audio ---------- */
let AC=null,muted=false,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function noise(){if(NB)return NB;const a=ac();NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB}
function burst(o){const a=ac();if(!a||muted)return;const t=a.currentTime+(o.delay||0);const s=a.createBufferSource();s.buffer=noise();s.loop=true;const f=a.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||300;f.Q.value=o.q||1;const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.g||.4,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(0.0001,t+(o.d||.15));s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+(o.d||.15)+.05)}
function tone(f0,f1,d,gv,type,delay){const a=ac();if(!a||muted)return;const t=a.currentTime+(delay||0);const o=a.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gv,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={
  thud(){burst({f:170,q:1.3,d:.22,g:.9});tone(95,55,.16,.35)},
  slide(){burst({f:1100,q:.5,a:.05,d:.55,g:.12})},
  grass(){burst({f:500,q:.4,type:'lowpass',d:.12,g:.35})},
  hole(){tone(130,45,.35,.55);burst({f:260,q:.8,d:.3,g:.5,delay:.02})},
  knock(){burst({f:320,q:1,d:.09,g:.45})},
  cheer(){burst({f:1600,q:.4,a:.25,d:1.4,g:.22});burst({f:2600,q:.6,a:.3,d:1.2,g:.1,delay:.1});tone(660,880,.12,.06,'square',.05);tone(880,1320,.15,.05,'square',.18)},
  ooh(){tone(330,210,.8,.07,'triangle');tone(262,170,.8,.05,'triangle',.03)},
  click(){tone(1200,1100,.035,.08,'square')},
  whoosh(){burst({f:700,q:.7,a:.12,d:.45,g:.08})}
};

/* ---------- date / storage ---------- */
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const now=new Date(),TODAY=dkey(now);
const PNUM=Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(2026,10,5))/864e5)+1;
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- game state ---------- */
let G=null, phase='intro', phaseT=0, aimX=0, powT=0, flight=null, settleQuiet=0, lastHit=0;
let floaters=[],parts=[],shake=0,cheerT=0,toastTimer=null;
function newGame(mode,seed){
  const day=mode==='daily'?dayFor(TODAY):makeDay(seed);
  G={mode,seed,day,fi:0,bags:[],left:4,shot:'slide',dbl:false,frames:[],throws:[],highlights:[],nextId:1,done:false,pending:null};
  startFrame(true);
}
function startFrame(silent){
  const f=G.day.frames[G.fi];G.bags=makeBlockers(f);G.left=4;G.dbl=false;G.throws.push([]);
  if(G.throws.length>G.fi+1)G.throws.length=G.fi+1;
  setPhase('aim');updateHUD();
  const bl=f.blockers.length;
  toast(`Frame ${G.fi+1}`,`${bl?bl+' '+G.day.opp.n+' bag'+(bl>1?'s':'')+' on the board · ':''}${windTxt(curWind())}${f.winds?' · gusty':''}`);
}
function curWind(){return G?windAt(G.day.frames[Math.min(G.fi,2)],4-G.left):0}
function windTxt(w){return w===0?'calm':`wind ${w<0?'← ':''}${Math.abs(w)} mph${w>0?' →':''}`}
function setPhase(p){phase=p;phaseT=0;updateControls()}
function save(){if(!G||G.mode!=='daily')return;ls('fb-'+TODAY,{v:2,fi:G.fi,bags:G.bags,left:G.left,shot:G.shot,frames:G.frames,throws:G.throws,highlights:G.highlights,nextId:G.nextId,done:G.done,pending:G.pending||null})}
function restore(s){Object.assign(G,s);if(!Array.isArray(G.throws))G.throws=[];while(G.throws.length<=G.fi)G.throws.push([]);if(!Array.isArray(G.highlights))G.highlights=[];if(!Array.isArray(G.frames))G.frames=[];updateHUD()}

/* ---------- input ---------- */
function tri(t,period){const x=(t/period)%1;return x<.5?x*2:2-x*2}
function onTap(){
  ac();
  if(phase==='aim'){sfx.click();setPhase('power')}
  else if(phase==='power'){throwBag()}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();onTap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(document.getElementById('overlay').classList.contains('show'))return;e.preventDefault();onTap()}});
document.querySelectorAll('#shotSeg button').forEach(b=>b.onclick=()=>{if(phase!=='aim')return;G.shot=b.dataset.shot;sfx.click();updateControls()});
document.getElementById('dblBtn').onclick=()=>{if(phase!=='aim'||G.left<2)return;G.dbl=!G.dbl;sfx.click();updateControls();updateHUD()};
document.getElementById('muteBtn').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
document.getElementById('helpBtn').onclick=()=>showIntro(true);

function throwBag(){
  const f=G.day.frames[G.fi];
  const spec={aimX:+aimX.toFixed(3),t:+powT.toFixed(4),shot:G.shot,dbl:G.dbl,id:G.nextId,w:curWind()};
  G.pending=spec;save();   // the throw counts the moment it leaves your hand, even if you reload
  const lp=landPoint(spec,spec.w),S=SHOTS[spec.shot];
  flight={spec,lp,S,t:0,spin:0};sfx.whoosh();setPhase('flight');
}
function finishFlight(){
  const spec=flight.spec;const id=spec.id;G.nextId=id+1;
  const ev=landBag(G.bags,spec,spec.w,id);
  G.cur={id,spec};flight=null;handleEvents(ev);settleQuiet=0;setPhase('settle');
}
function bagScreen(b){return proj(b.x,hAt(b),DIST+b.y)}
function handleEvents(ev){
  for(const e of ev){const p=bagScreen(e.b);
    switch(e.t){
      case'land':sfx.thud();sfx.slide();dust(p,e.b.dbl?14:8,'#d9b98a');if(e.b.dbl)shake=5;break;
      case'grass':sfx.grass();dust(p,6,'#7fb069');float(p,e.b.dbl?'Lost both bags −2':(e.b.how==='short'?'Short':e.b.how==='long'?'Long':'Wide'),'#f5ecd7');if(e.b.dbl)sfx.ooh();break;
      case'airmail':sfx.hole();cheer(p,'AIRMAIL!'+(e.b.dbl?' ×2':''));hl('Airmail'+(e.b.dbl?' (double)':''));break;
      case'slider':sfx.hole();cheer(p,(e.b.dbl?'DOUBLE DUNK':'Slider!'));hl(e.b.dbl?'Double dunk':'Slider');break;
      case'jumper':sfx.hole();cheer(p,'Jumper! Pushed in');hl('Jumper');break;
      case'oppHole':sfx.hole();sfx.ooh();float(p,"Oops, that's theirs −3",'#ffb4a8');hl('Dunked their bag');break;
      case'cleared':sfx.knock();float(p,'Clean-out +1','#f0b43c');hl('Clean-out');break;
      case'over':float(p,'Too hot, rode over','#f5ecd7');break;
      case'off':sfx.knock();sfx.ooh();float(p,e.b.dbl?'Double knocked off −2':'Knocked off','#f5ecd7');break;
      case'hit':{const t=performance.now();if(t-lastHit>90&&e.j>4){sfx.knock();lastHit=t}break}
    }
  }
}
function hl(s){G.highlights.push(s)}
function afterSettle(){
  const b=G.bags.find(x=>x.id===G.cur.id);
  if(b&&b.status==='board'&&Math.hypot(b.x-HOLE.x,b.y-HOLE.y)<HOLE.r+1.6){float(bagScreen(b),'Hanger','#f0b43c');hl('Hanger')}
  G.throws[G.fi].push({id:G.cur.id,dbl:G.cur.spec.dbl});
  const w0=curWind();
  G.left-=G.cur.spec.dbl?2:1;G.dbl=false;G.cur=null;G.pending=null;
  if(G.left<=0)recordFrame();
  save();updateHUD();
  if(G.left<=0){setPhase('frameEnd');setTimeout(endFrame,900)}else{setPhase('aim');const w1=curWind();if(w1!==w0)toast('Gust!',`Wind now ${windTxt(w1)}`)}
}
// replays a throw that was in the air when the page was closed, so it counts exactly as thrown
function commitPending(){
  const sp=G.pending;if(!sp||G.left<=0||G.frames[G.fi]){G.pending=null;return null}
  const ev=landBag(G.bags,sp,sp.w,sp.id);settle(G.bags,G.day.surface.mu,ev);
  G.nextId=Math.max(G.nextId,sp.id+1);G.throws[G.fi].push({id:sp.id,dbl:!!sp.dbl});
  const b=G.bags.find(x=>x.id===sp.id);
  if(b&&b.status==='hole')hl(b.how==='airmail'?'Airmail':b.bumped?'Jumper':'Slider');
  G.left-=sp.dbl?2:1;G.dbl=false;G.pending=null;
  if(G.left<=0)recordFrame();
  save();return b
}
function recordFrame(){
  if(G.frames[G.fi])return G.frames[G.fi];
  const sc=frameScore(G.bags);
  const rows=G.throws[G.fi].map(t=>{const b=G.bags.find(x=>x.id===t.id);return{e:throwEmoji(b),p:bagPts(b),txt:(b.dbl?'Stacked double · ':'')+(b.status==='hole'?(b.how==='airmail'?'airmail':'in the hole'):b.status==='board'?'zone '+zoneOf(b.y):'off the board')}});
  G.frames[G.fi]={...sc,rows};
  if(sc.four)hl('Four-bagger');
  return G.frames[G.fi];
}
function throwEmoji(b){const e=b.status==='hole'?'🎯':b.status==='board'?'🟫':'⬜';return b.dbl?'['+e+e+']':e}
function endFrame(){
  const sc=recordFrame(),rows=sc.rows;
  save();updateHUD();
  const last=G.fi===2;
  let h=`<div class="kick">Frame ${G.fi+1} of 3</div><h2>${sc.total} point${sc.total===1?'':'s'}</h2><table>`;
  rows.forEach((r,i)=>h+=`<tr><td>${r.e} Throw ${i+1} · ${r.txt}</td><td>${r.p}</td></tr>`);
  if(sc.cleared)h+=`<tr><td>🧹 Knocked ${sc.cleared} of their bags off</td><td>+${sc.cleared}</td></tr>`;
  if(sc.oops)h+=`<tr><td>😬 Pushed ${sc.oops} of their bags in</td><td>−${3*sc.oops}</td></tr>`;
  if(sc.four)h+=`<tr><td>🌽 Four-bagger bonus</td><td>+3</td></tr>`;
  h+=`</table><div class="muted">Running total: <b>${total()}</b> · target ${G.day.target}</div>`;
  h+=`<button class="btn" id="nextBtn">${last?'See today\'s result':'Next frame →'}</button>`;
  showCard(h,true);
  document.getElementById('nextBtn').onclick=()=>{hideCard();if(last){G.done=true;save();finishDay()}else{G.fi++;startFrame();save()}};
}
function total(){return G.frames.reduce((s,f)=>s+(f?f.total:0),0)}

/* ---------- HUD / controls ---------- */
function updateHUD(){
  if(!G)return;const f=G.day.frames[Math.min(G.fi,2)],w=curWind();
  document.getElementById('num').textContent=G.mode==='daily'?`#${PNUM}`:'Practice';
  document.getElementById('hFrame').textContent=`Frame ${G.fi+1} / 3`;
  document.getElementById('hWind').innerHTML=(w===0?'Calm':`${w<0?'← ':''}${Math.abs(w)} mph${w>0?' →':''}`)+(f.winds?'<small>gusty</small>':'');
  document.getElementById('hTarget').textContent=G.day.target;
  const live=!G.frames[G.fi]&&G.throws[G.fi]&&G.throws[G.fi].length?frameScore(G.bags).total:null;
  document.getElementById('hScore').innerHTML=(live!==null?`<small>${live>=0?'+':''}${live} this frame</small>`:'')+(total()+(live||0));
  let r='';const used=4-G.left;for(let i=0;i<4;i++){const u=i<used;const pick=!u&&G.dbl&&i<used+2||(!u&&!G.dbl&&i===used&&phase==='aim');r+=`<i class="${u?'used':''} ${pick?'pick':''}"></i>`}
  document.getElementById('rack').innerHTML=r;
}
function updateControls(){
  const can=phase==='aim'&&G;
  document.querySelectorAll('#shotSeg button').forEach(b=>{b.classList.toggle('on',G&&b.dataset.shot===G.shot);b.disabled=!can});
  const d=document.getElementById('dblBtn');d.classList.toggle('on',!!(G&&G.dbl));d.disabled=!can||G.left<2;
  const hint=document.getElementById('hint');
  const w=G?curWind():0,dr=G?Math.abs(w*SHOTS[G.shot].drift):0,side=w>0?'left':'right';
  const adv=!G||w===0?'':` · wind ${w>0?'→':'←'}, aim ${dr<1.5?'a hair':dr<4?'a bit':dr<8?'well':'way'} ${side}`;
  hint.innerHTML=phase==='aim'?'<b>Tap</b> to lock your aim'+adv:phase==='power'?(G.shot==='slide'?'<b>Tap</b> to set distance · end the gold tail on the hole':'<b>Tap</b> to set distance · drop it on the hole'):phase==='flight'||phase==='settle'?'&nbsp;':'';
  updateHUD();
}
function toast(t,s){const el=document.getElementById('toast');el.innerHTML=`<b>${t}</b>${s}`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}

/* ---------- effects ---------- */
function float(p,text,color){floaters.push({x:p.x,y:p.y-18,text,color,t:0})}
function dust(p,n,col){for(let i=0;i<n;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()*2-1)*60,vy:-Math.random()*50-10,t:0,life:.5+Math.random()*.3,col,r:1.5+Math.random()*2})}
function cheer(p,text){float(p,text,'#f0b43c');sfx.cheer();cheerT=1.4;shake=Math.max(shake,4);for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*120;parts.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,t:0,life:.9+Math.random()*.4,col:Math.random()<.7?'#f2cf4a':'#fff3c4',r:2+Math.random()*1.8,g:1})}}

/* ---------- drawing ---------- */
function quad(P){ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y);ctx.closePath()}
function roundPoly(P){const n=P.length,m=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});ctx.beginPath();const s=m(P[0],P[1]);ctx.moveTo(s.x,s.y);for(let i=1;i<=n;i++){const a=P[i%n],b=P[(i+1)%n],q=m(a,b);ctx.quadraticCurveTo(a.x,a.y,q.x,q.y)}ctx.closePath()}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return`rgb(${f(r)},${f(g)},${f(b)})`}
function drawScene(time){
  const fenceB=CY+F*CAMH/480;
  // fence
  const fg=ctx.createLinearGradient(0,0,0,fenceB);fg.addColorStop(0,'#3b2a1d');fg.addColorStop(1,'#6e4c2f');ctx.fillStyle=fg;ctx.fillRect(0,0,CW,fenceB);
  const pw=5.5*F/480;for(let x=-pw*.3,i=0;x<CW;x+=pw,i++){ctx.fillStyle=i%2?'rgba(255,220,170,.05)':'rgba(0,0,0,.06)';ctx.fillRect(x,0,pw-2,fenceB);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x+pw-2,0,2,fenceB)}
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,fenceB-58,CW,4);ctx.fillStyle='rgba(255,220,170,.07)';ctx.fillRect(0,fenceB-62,CW,4);
  // banner
  const op=G?G.day.opp:OPPS[0];ctx.save();ctx.translate(CW/2,84);ctx.rotate(-.015);ctx.fillStyle='#f3e6c8';ctx.fillRect(-118,-24,236,46);ctx.fillStyle=op.c;ctx.fillRect(-118,-24,236,7);
  ctx.fillStyle='#2b2216';ctx.textAlign='center';ctx.font="800 17px 'Bricolage Grotesque',sans-serif";ctx.fillText('vs '+op.n.toUpperCase(),0,4);ctx.font="500 10.5px 'DM Sans',sans-serif";ctx.fillStyle='#6d5a3c';ctx.fillText(G?G.day.venue:'',0,17);ctx.restore();
  // string lights
  for(const [y0,sag,ph] of [[14,26,0],[38,18,1.3]]){ctx.strokeStyle='rgba(20,14,8,.8)';ctx.lineWidth=1.2;ctx.beginPath();for(let x=0;x<=CW;x+=10){const y=y0+sag*Math.sin(Math.PI*x/CW)+Math.sin(time*1.1+ph)*1.2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    for(let x=14;x<CW;x+=34){const y=y0+sag*Math.sin(Math.PI*x/CW)+Math.sin(time*1.1+ph)*1.2+4;const fl=.75+.25*Math.sin(time*3+x);const gr=ctx.createRadialGradient(x,y,0,x,y,14);gr.addColorStop(0,`rgba(255,214,130,${.55*fl})`);gr.addColorStop(1,'rgba(255,214,130,0)');ctx.fillStyle=gr;ctx.fillRect(x-14,y-14,28,28);ctx.fillStyle=`rgba(255,236,190,${fl})`;ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}}
  // wind flag
  if(G){const w=curWind();const px=374,top=110;ctx.strokeStyle='#cfc4ad';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px,fenceB-6);ctx.stroke();
    const L=Math.abs(w)<.5?6:10+Math.abs(w)*3.2,dir=w>=0?1:-1,droop=Math.abs(w)<.5?18:Math.max(2,10-Math.abs(w));ctx.fillStyle='#e8553f';ctx.beginPath();ctx.moveTo(px,top);
    for(let i=0;i<=8;i++){const u=i/8;ctx.lineTo(px+dir*L*u,top+droop*u*0.6+Math.sin(time*7+u*5)*2*u)}ctx.lineTo(px,top+12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#f5ecd7';ctx.font="700 11px 'DM Sans',sans-serif";ctx.textAlign='center';ctx.fillText(w===0?'calm':Math.abs(w)+' mph',px+(w<0?-14:0),top-6)}
  // grass
  const gg=ctx.createLinearGradient(0,fenceB,0,CH);gg.addColorStop(0,'#2f5f30');gg.addColorStop(1,'#4c8b42');ctx.fillStyle=gg;ctx.fillRect(0,fenceB,CW,CH-fenceB);
  for(let z=480,i=0;z>110;z-=40,i++){if(i%2)continue;const a=proj(0,0,z).y,b=proj(0,0,z-40).y;ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(0,a,CW,b-a)}
  const sg=ctx.createLinearGradient(0,fenceB,0,fenceB+24);sg.addColorStop(0,'rgba(0,0,0,.35)');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.fillRect(0,fenceB,CW,24);
  // cup
  const cp=proj(-15.6,0,DIST+8);const cs=cp.s;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(cp.x+4,cp.y,2.2*cs,.7*cs,0,0,7);ctx.fill();
  ctx.fillStyle='#c8322a';ctx.beginPath();ctx.moveTo(cp.x-1.75*cs,cp.y-4.5*cs);ctx.lineTo(cp.x+1.75*cs,cp.y-4.5*cs);ctx.lineTo(cp.x+1.3*cs,cp.y);ctx.lineTo(cp.x-1.3*cs,cp.y);ctx.closePath();ctx.fill();ctx.fillStyle='#f4f0e6';ctx.fillRect(cp.x-1.75*cs,cp.y-4.8*cs,3.5*cs,.45*cs);
}
function boardText(t,x,y,size,col){const p=boardPt(x,y);const fy=(boardPt(x,y-.5).y-boardPt(x,y+.5).y)/p.s;ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s*fy);ctx.font=`800 ${size}px 'Bricolage Grotesque',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,0,0);ctx.restore()}
function drawBoard(){
  ctx.fillStyle='rgba(0,0,0,.3)';quad([proj(-12,0,DIST+2),proj(12.8,0,DIST+2),proj(14,0,DIST+50),proj(-10.5,0,DIST+50)]);ctx.fill();
  ctx.fillStyle='#4a2e18';quad([boardPt(-12,0),boardPt(12,0),proj(12,0,DIST),proj(-12,0,DIST)]);ctx.fill();
  const zc=['#e6c48e','#cd955a','#965a32'];[[0,16],[16,32],[32,48]].forEach(([a,b],i)=>{ctx.fillStyle=zc[i];quad([boardPt(-12,a),boardPt(12,a),boardPt(12,b),boardPt(-12,b)]);ctx.fill()});
  ctx.strokeStyle='rgba(70,35,12,.13)';ctx.lineWidth=1;for(const x of[-10.3,-7,-3.6,-.4,3.1,6.6,9.9]){const a=boardPt(x,0),b=boardPt(x+.3,48);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  const ac=G?G.day.opp.c:'#2f7fc1';for(const s of[-1,1]){ctx.fillStyle='#1d3a2f';quad([boardPt(s*10.1,0),boardPt(s*11.3,0),boardPt(s*11.3,48),boardPt(s*10.1,48)]);ctx.fill()}
  for(const y of[16,32]){ctx.fillStyle='rgba(255,246,222,.9)';quad([boardPt(-12,y-.35),boardPt(12,y-.35),boardPt(12,y+.35),boardPt(-12,y+.35)]);ctx.fill()}
  ctx.strokeStyle='#3a2210';ctx.lineWidth=2.5;quad([boardPt(-12,0),boardPt(12,0),boardPt(12,48),boardPt(-12,48)]);ctx.stroke();
  boardText('1',0,8,9,'rgba(90,50,20,.32)');boardText('2',0,24,9,'rgba(70,35,12,.35)');boardText('3',-6.5,41,8,'rgba(255,230,190,.35)');boardText('3',6.5,41,8,'rgba(255,230,190,.35)');
  const c=boardPt(0,39),rx=3*c.s,ry=(boardPt(0,36).y-boardPt(0,42).y)/2;
  ctx.fillStyle='#3a200e';ctx.beginPath();ctx.ellipse(c.x,c.y,rx+2,ry+1.4,0,0,7);ctx.fill();
  ctx.fillStyle='#0b0704';ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,220,160,.12)';ctx.beginPath();ctx.ellipse(c.x,c.y+ry*.55,rx*.8,ry*.3,0,0,Math.PI);ctx.fill();
  boardText('5',0,45.2,3.4,'rgba(255,230,190,.55)');
}
function bagPoly(b,h,dx,dy){const r=b.r*.97,c=Math.cos(b.rot),s=Math.sin(b.rot);return[[-r,-r],[r,-r],[r,r],[-r,r]].map(([u,v])=>proj(b.x+dx+u*c-v*s,h,DIST+b.y+dy+u*s+v*c))}
function bagColor(b){return b.own?OWN:G.day.opp.c}
function drawBagFlat(b){
  const h=hAt(b)+.5,col=bagColor(b);const layers=b.dbl?[[1,-1,0,-.28],[0,0,1.3,0]]:[[0,0,0,0]];
  const sp=bagPoly(b,hAt(b),.8,.6);ctx.fillStyle='rgba(0,0,0,.25)';roundPoly(sp);ctx.fill();
  for(const[dx,dy,dh,sh]of layers){const P=bagPoly(b,h+dh,dx,dy);roundPoly(P);ctx.fillStyle=shade(col,sh);ctx.fill();ctx.strokeStyle=shade(col,-.45);ctx.lineWidth=1.2;ctx.stroke();
    const I=bagPoly({...b,r:b.r*.74},h+dh,dx,dy);ctx.setLineDash([2.5,2.5]);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;quad(I);ctx.stroke();ctx.setLineDash([])}
  if(b.status==='ground'){ctx.fillStyle='rgba(20,40,20,.22)';roundPoly(bagPoly(b,h,0,0));ctx.fill()}
  if(b.dbl){const p=proj(b.x,h+2,DIST+b.y);ctx.fillStyle='#f0b43c';ctx.font="800 11px 'Bricolage Grotesque',sans-serif";ctx.textAlign='center';ctx.fillText('×2',p.x,p.y-b.r*p.s*.55)}
}
function drawFlight(){
  const{lp,S,t,spec}=flight;const u=Math.min(1,t/S.dur);const X0=0,Y0=48,Z0=110;
  const Zl=DIST+lp.y,Yl=surfAt(lp.x,Zl)+.5;const X=X0+(lp.x-lp.drift-X0)*u+lp.drift*u*u,Z=Z0+(Zl-Z0)*u,Y=Y0+(Yl-Y0)*u+4*S.peak*u*(1-u);
  const sh=proj(X,surfAt(X,Z),Z);const p=proj(X,Y,Z);const size=5.8*p.s*(spec.dbl?1.1:1);
  ctx.fillStyle=`rgba(0,0,0,${.12+.18*u})`;ctx.beginPath();ctx.ellipse(sh.x,sh.y,size*.5,size*.2,0,0,7);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(flight.spin);ctx.scale(1,.72);
  const draw=(ox,oy,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-size/2+ox,-size/2+oy,size,size,size*.28);ctx.fill();ctx.strokeStyle=shade(OWN,-.45);ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([2.5,2.5]);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.strokeRect(-size*.36+ox,-size*.36+oy,size*.72,size*.72);ctx.setLineDash([])};
  if(spec.dbl)draw(size*.12,size*.16,shade(OWN,-.28));draw(0,0,OWN);ctx.restore();
}
function lanePath(x,y0,y1,dash,col,w){ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();let first=true;for(let y=y0;y<=y1+.01;y+=1.5){const p=proj(x,surfAt(x,DIST+y),DIST+y);first?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);first=false}ctx.stroke();ctx.restore()}
function drawGuides(){
  if(phase==='aim'){lanePath(aimX,YMIN-6,YMIN+YSPAN,[6,6],'rgba(255,255,255,.85)',2.2);const p=proj(aimX,0,DIST+YMIN-8);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(p.x,p.y-8);ctx.lineTo(p.x-7,p.y+5);ctx.lineTo(p.x+7,p.y+5);ctx.closePath();ctx.fill()}
  if(phase==='power'){lanePath(aimX,YMIN-6,YMIN+YSPAN,[3,7],'rgba(255,255,255,.35)',1.5);
    const y=YMIN+YSPAN*powT,Z=DIST+y,h=surfAt(aimX,Z);const sl=slideLen(G.shot,G.day.surface.mu);
    if(y>=0&&y<=BL&&Math.abs(aimX)<=BW){lanePath(aimX,y,Math.min(y+sl,BL+2),[2,4],'rgba(240,180,60,.95)',2.4)}
    const c=proj(aimX,h,Z),rx=3*c.s,ry=(proj(aimX,h,Z-3).y-proj(aimX,h,Z+3).y)/2;
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,0,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(c.x-rx-6,c.y);ctx.lineTo(c.x+rx+6,c.y);ctx.stroke()}
}
function draw(time){
  ctx.setTransform(VS*DPR,0,0,VS*DPR,0,0);ctx.clearRect(0,0,CW,CH);
  ctx.save();if(shake>0)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  drawScene(time);
  if(G){
    const bags=G.bags;
    bags.filter(b=>b.status==='ground'&&b.y>30).sort((a,b)=>b.y-a.y).forEach(drawBagFlat);
    drawBoard();
    bags.filter(b=>b.status==='ground'&&b.y<=30).sort((a,b)=>b.y-a.y).forEach(drawBagFlat);
    drawGuides();
    bags.filter(b=>b.status==='board').sort((a,b)=>b.y-a.y).forEach(drawBagFlat);
    if(flight)drawFlight();
  }else drawBoard();
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  ctx.textAlign='center';for(const f of floaters){const a=Math.max(0,1-Math.max(0,f.t-1)/0.6);ctx.globalAlpha=a;ctx.font="800 18px 'Bricolage Grotesque',sans-serif";ctx.lineWidth=4;ctx.strokeStyle='rgba(16,30,22,.85)';const y=f.y-f.t*26;ctx.strokeText(f.text,f.x,y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,y)}ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;phaseT+=dt;const time=ts/1000;
  if(G){
    if(phase==='aim')aimX=(tri(phaseT+.45,1.9)*2-1)*AIMX;
    if(phase==='power')powT=tri(phaseT,2.0);
    if(phase==='flight'){flight.t+=dt;flight.spin+=dt*(G.shot==='lob'?5:9);if(flight.t>=flight.S.dur)finishFlight()}
    if(phase==='settle'){const ev=[];let mv=false;const n=Math.round(dt/DT);for(let i=0;i<n;i++)mv=step(G.bags,G.day.surface.mu,ev)||mv;if(ev.length){handleEvents(ev);updateHUD()}if(mv)settleQuiet=0;else{settleQuiet+=dt;if(settleQuiet>.45)afterSettle()}}
  }
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g?420:160)*dt}parts=parts.filter(p=>p.t<p.life);
  for(const f of floaters)f.t+=dt;floaters=floaters.filter(f=>f.t<1.6);
  shake=Math.max(0,shake-dt*18);
  draw(time);requestAnimationFrame(loop);
}

/* ---------- cards ---------- */
function showCard(h,sheet){document.getElementById('card').innerHTML=h;const o=document.getElementById('overlay');o.classList.toggle('sheet',!!sheet);o.classList.add('show');document.getElementById('card').scrollTop=0}
function hideCard(){document.getElementById('overlay').classList.remove('show')}
function introHTML(again){
  const d=G.day,dt=new Date();const fr=d.frames;
  return `<div class="kick">${G.mode==='daily'?`Four Bagger #${PNUM} · ${dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}`:'Practice board'}</div>
  <h2>Three frames. Four bags each.</h2>
  <div class="match"><div class="sw" style="background:${OWN}"></div><span class="vs">VS</span><div class="sw" style="background:${d.opp.c}"></div><div class="t"><b>${d.opp.n}</b><br>${d.venue}</div></div>
  <div class="chips">${d.twist?`<span class="chip tw">⚡ Today: ${d.twist.name} · ${d.twist.desc}</span>`:''}<span class="chip">🪵 ${d.surface.name}: ${d.surface.desc}</span>${fr.map((f,i)=>`<span class="chip">F${i+1}: ${f.winds?'gusts '+f.winds.map(x=>Math.abs(x)).join('/')+' mph':windTxt(f.wind)}${f.blockers.length?` · ${f.blockers.length} blocker${f.blockers.length>1?'s':''}`:''}</span>`).join('')}<span class="chip">🎯 Target ${d.target}</span></div>
  <div class="legend"><div class="mini" style="background:linear-gradient(#965a32 0 33.3%,#cd955a 33.3% 66.6%,#e6c48e 66.6%)"><div style="top:0;height:33%">3</div><div style="top:33%;height:33%">2</div><div style="top:66%;height:34%">1</div><div class="h">5</div></div>
  <ul style="margin:0"><li><b>Tap</b> to lock your aim, <b>tap</b> again to set distance.</li><li><b>Slide</b> lands short and runs along the gold tail. Too hot and it <b>rides over</b> the hole.</li><li><b>Lob</b> sticks where it lands and can drop straight in, but wind pushes it about 3× more.</li></ul></div>
  <ul><li>Bags score where they <b>end up</b>: zone 1, 2 or 3, <b>5</b> in the hole, <b>+3</b> if all four go in.</li>
  <li><b>Stack 2</b>: two bags as one for <b>double points</b> (12 in the hole). Wider, so it needs a truer line. Off the board: <b>−2</b>.</li>
  <li>Their bags: knock one off <b>+1</b>, push one in <b>−3</b>.</li></ul>
  <div class="stick"><button class="btn" id="startBtn">${again?'Back to the board':G.fi>0||G.throws.length>1||(G.throws[0]&&G.throws[0].length)?`Resume frame ${G.fi+1}`:'Start throwing'}</button></div>`;
}
function showIntro(again){if(!G)return;showCard(introHTML(again));document.getElementById('startBtn').onclick=()=>{ac();hideCard();if(!again&&phase==='intro'){setPhase('aim');startFrameToast()}}}
function startFrameToast(){const f=G.day.frames[G.fi];toast(`Frame ${G.fi+1}`,windTxt(curWind())+(f.winds?' · gusty':''))}
function rank(s,t){return s>=t+25?'Cornhole Hall of Fame':s>=t+12?'Backyard legend':s>=t?'Four-bagger material':s>=t-7?'Solid on the wood':s>=t-15?'Tailgate regular':'Grass collector'}
function shareText(){
  const t=total(),d=G.day.target,diff=t-d;
  let s=`Four Bagger #${PNUM} 🌽 ${t} pts (target ${d}, ${diff>=0?'+':''}${diff})${G.day.twist?' ⚡'+G.day.twist.name:''}\n`;
  G.frames.forEach((f,i)=>{s+=`F${i+1} ${f.rows.map(r=>r.e).join('')} ${f.total}${f.cleared?' 🧹'+f.cleared:''}${f.oops?' 😬'+f.oops:''}\n`});
  return s.trim();
}
function finishDay(){
  const t=total(),d=G.day.target;
  let stats=ls('fb-stats')||{played:0,streak:0,best:0,last:null,sum:0};
  if(G.mode==='daily'&&stats.last!==TODAY){const y=new Date(now);y.setDate(y.getDate()-1);stats.streak=stats.last===dkey(y)?stats.streak+1:1;stats.played++;stats.best=Math.max(stats.best,t);stats.sum+=t;stats.last=TODAY;ls('fb-stats',stats)}
  const hlCount={};G.highlights.forEach(h=>hlCount[h]=(hlCount[h]||0)+1);
  let h=`<div class="kick">${G.mode==='daily'?`Four Bagger #${PNUM} · final`:'Practice · final'}</div>
  <div class="big">${t} <small>/ target ${d} (${t-d>=0?'+':''}${t-d})</small></div><h2 style="font-size:21px">${rank(t,d)}</h2><table>`;
  G.frames.forEach((f,i)=>h+=`<tr><td>Frame ${i+1} &nbsp;${f.rows.map(r=>r.e).join('')}</td><td>${f.total}</td></tr>`);
  h+='</table>';
  if(Object.keys(hlCount).length)h+=`<div>${Object.entries(hlCount).map(([k,v])=>`<span class="tag">${k}${v>1?' ×'+v:''}</span>`).join('')}</div>`;
  if(G.mode==='daily')h+=`<div class="stats"><div><b>${stats.streak}</b><span>streak</span></div><div><b>${stats.played}</b><span>played</span></div><div><b>${stats.best}</b><span>best</span></div><div><b>${stats.played?Math.round(stats.sum/stats.played):0}</b><span>average</span></div></div>`;
  h+=`<pre id="share">${shareText()}</pre><button class="btn" id="copyBtn">Copy result</button>`;
  if(G.mode==='daily')h+=`<p class="muted" style="text-align:center;margin:10px 0 0">New board in <b id="cd"></b></p>`;
  h+=`<button class="btn alt" id="pracBtn">Practice board</button>`;
  if(G.mode!=='daily')h+=`<button class="btn alt" id="dailyBtn">Back to today's game</button>`;
  showCard(h);
  document.getElementById('copyBtn').onclick=async e=>{const txt=shareText();let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(_){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(__){}}
    if(ok)e.target.textContent='Copied ✓';else{e.target.textContent='Select the text above to copy';const r=document.createRange();r.selectNodeContents(document.getElementById('share'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}};
  document.getElementById('pracBtn').onclick=()=>{hideCard();newGame('practice',(Math.random()*1e9)|0);phase='intro';showIntro(false)};
  const db=document.getElementById('dailyBtn');if(db)db.onclick=()=>{hideCard();boot()};
  tickCD();
}
function tickCD(){const el=document.getElementById('cd');if(!el)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);el.textContent=`${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`;setTimeout(tickCD,20000)}

/* ---------- boot ---------- */
function boot(){
  newGame('daily',hashStr('fourbagger-'+TODAY));phase='intro';updateControls();
  const s=ls('fb-'+TODAY);
  let replayed=null;
  const valid=s&&typeof s==='object'&&(s.done===true||(Array.isArray(s.bags)&&Number.isInteger(s.fi)&&s.fi>=0&&s.fi<=2&&typeof s.left==='number'&&Array.isArray(s.frames)));
  if(valid){try{restore(s);if(s.done){finishDay();return}
    if(G.pending)replayed=commitPending();
    if(!G.frames[G.fi]&&G.left<=0)recordFrame();
    if(G.frames[G.fi]){G.fi++;if(G.fi>2){G.done=true;save();finishDay();return}G.bags=makeBlockers(G.day.frames[G.fi]);G.left=4;G.throws[G.fi]=[];save()}
  }catch(e){newGame('daily',0);phase='intro'}}
  else if(s)ls('fb-'+TODAY+'-bad',s);
  showIntro(false);
  if(replayed)toast('Your last throw counted',replayed.status==='hole'?'It went in 🎯':replayed.status==='board'?'It stayed on the board':'It missed the board');
}
fit();boot();requestAnimationFrame(loop);
</script>
